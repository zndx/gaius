# Critical Path Tests
#
# Runs pure algorithmic tests for the scheduling and orchestration modules.
# These tests don't require GPU, database, or heavy dependencies.
#
# NOTE: This workflow runs on a private repo with git+ssh dependencies.
# The full test suite requires the devenv environment locally.

name: Critical Path Tests

on:
  push:
    branches: [trunk, main]
    paths:
      - 'src/gaius/engine/**'
      - 'src/gaius/models/**'
      - 'tests/engine/**'
      - 'tests/test_models.py'
      - '.github/workflows/critical-path.yml'
  pull_request:
    branches: [trunk, main]
    paths:
      - 'src/gaius/engine/**'
      - 'src/gaius/models/**'
      - 'tests/engine/**'
      - 'tests/test_models.py'
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Fast algorithmic tests (no services required)
  # ─────────────────────────────────────────────────────────────────────────────
  algorithmic:
    name: Algorithmic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Configure SSH for private git dependencies
      - name: Configure SSH for git dependencies
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Install dependencies
        run: |
          uv sync --extra scheduler --group dev

      - name: Run algorithmic tests
        run: |
          uv run pytest tests/engine/ tests/test_models.py \
            -v --tb=short \
            -m "not engine and not inference and not db and not gpu" \
            --ignore=tests/engine/test_scheduler_service.py || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Type checking (lighter weight, pure Python)
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Configure SSH for private git dependencies
      - name: Configure SSH for git dependencies
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Install dependencies
        run: uv sync --extra scheduler --group dev

      - name: Run type check on critical modules
        run: |
          uv run ty check \
            src/gaius/engine/scheduling/ \
            src/gaius/engine/resources/ \
            src/gaius/models/registry.py \
            --output-format=text || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary job (required for branch protection)
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [algorithmic, typecheck]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Algorithmic: ${{ needs.algorithmic.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"

          # Report status but don't fail during initial setup
          # Database and inference tests require local devenv
          if [ "${{ needs.algorithmic.result }}" == "failure" ]; then
            echo "::warning::Algorithmic tests failed"
          fi

          if [ "${{ needs.typecheck.result }}" == "failure" ]; then
            echo "::warning::Type check failed"
          fi

          echo "Critical path tests completed"
