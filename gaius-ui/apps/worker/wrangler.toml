name = "gaius-web"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Development settings
[dev]
port = 8787
local_protocol = "http"

# KV namespace for OAuth pending codes
[[kv_namespaces]]
binding = "GAIUS_SESSIONS"
id = "98d07129d1564d479a3ba0b8c81e36c3"

# Environment variables
[vars]
# ENGINE_CALLBACK_URL = "https://engine.gaius.zndx.org"  # Set after tunnel is configured

# Production custom domain
# This will create/update the custom domain routing
[[routes]]
pattern = "gaius.zndx.org"
zone_id = "b44e1003e7233d89a90312aeb88e31d4"
custom_domain = true
