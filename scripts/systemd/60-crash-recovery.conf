# /etc/sysctl.d/60-crash-recovery.conf  (STAGED — arm with the commands below)
#
# Auto-recover from a hard hang instead of sitting wedged for hours. Paired with
# the crash-gated GPU defer (crash-guard.service + gaius-engine.sh) so a
# load-induced recurring crash cannot loop: crash -> auto-reboot -> GPU deferred
# -> stable and waiting for an operator.
#
# hung_task_panic: panic (=> reboot, see kernel.panic) when a task is stuck in
# uninterruptible (D) state past the timeout. This is exactly the 2026-08-26
# failure mode — an NVMe bus-drop wedged /raid I/O in D-state with no panic, so
# kernel.panic never fired and the box sat dead ~8h.
kernel.hung_task_panic = 1
# Generous timeout so heavy-but-progressing warehouse I/O never false-triggers;
# a genuine wedge stays wedged well past this (recovery in ~10 min vs. ~8 hours).
kernel.hung_task_timeout_secs = 600
# Reboot 10s after any panic (already the effective value; set here as the
# single documented source).
kernel.panic = 10
kernel.panic_on_oops = 1
#
# ARM (only after the defer chain is validated — see the hardening doc):
#   sudo install -m 0644 scripts/systemd/60-crash-recovery.conf /etc/sysctl.d/60-crash-recovery.conf
#   sudo sysctl --system
# DISARM:
#   sudo rm /etc/sysctl.d/60-crash-recovery.conf && sudo sysctl -w kernel.hung_task_panic=0
