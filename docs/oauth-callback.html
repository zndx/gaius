<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaius X Authorization</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #00d4ff; }
        .code-box {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            word-break: break-all;
            font-family: 'Fira Code', monospace;
        }
        .command {
            background: #0f3460;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { color: #00ff88; }
        .error { color: #ff6b6b; }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #00b8e6; }
        .copied { background: #00ff88 !important; }
    </style>
</head>
<body>
    <h1>Gaius X Authorization</h1>

    <div id="content">
        <p>Processing authorization...</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const errorDesc = params.get('error_description');

        const content = document.getElementById('content');

        if (error) {
            content.innerHTML = `
                <p class="error">Authorization failed: ${error}</p>
                <p>${errorDesc || 'Unknown error'}</p>
            `;
        } else if (code) {
            content.innerHTML = `
                <p class="success">Authorization successful!</p>

                <p>Copy this authorization code:</p>
                <div class="code-box" id="code-box">${code}</div>
                <button onclick="copyCode()">Copy Code</button>

                <p>Then run this command in your terminal:</p>
                <div class="command">/x-bookmarks auth complete ${code}</div>

                <p style="color: #888; font-size: 0.9em;">
                    State: ${state || 'none'}<br>
                    You can close this page after copying the code.
                </p>
            `;
        } else {
            content.innerHTML = `
                <p class="error">No authorization code received.</p>
                <p>Please try the authorization flow again.</p>
            `;
        }

        function copyCode() {
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('button');
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Code';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
