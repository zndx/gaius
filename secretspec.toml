# Declared secrets — values never live here (https://secretspec.dev/).
# dotenv (.env) is the local provider. See devenv.yaml secretspec: and
# external/signals-protocol/specification/operations/kerberos_and_secretspec.md

[project]
name = "gaius"
revision = "1.0"

[profiles.default]
SIGNALS_KRB_USER_KEYTAB = { description = "Client keytab for GSSAPI / FDW when joining Signals", required = false }
ENGINE_KRB_KEYTAB = { description = "gaius-engine service keytab", required = false }
ENGINE_KRB_PRINCIPAL = { description = "Engine principal if not gaius-engine@REALM", required = false }
XAI_API_KEY = { description = "xAI API key (ACP / weekly compose / grok)", required = false }
XAI_MANAGEMENT_KEY = { description = "xAI management key", required = false }
BRAVE_API_KEY = { description = "Brave Search API key", required = false }
CEREBRAS_API_KEY = { description = "Cerebras Cloud API key", required = false }
ANTHROPIC_API_KEY = { description = "Anthropic API key", required = false }
FMP_API_KEY = { description = "Financial Modeling Prep API key", required = false }
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token", required = false }
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account id", required = false }
