  string horizon = 3;
  string path = 4;                // current/agenda.md
  bool created = 5;
  repeated ThetaAgendaItem items = 6;
  string ascii_format = 7;
  string error = 8;
}

// Consciousness surface — scratch zettels (note | list | event).
// Not ThetaAgenda (day rollup). Not Synth gestures.
message AgendaCheck {
  bool done = 1;
  string text = 2;
}

message AgendaCard {
  string path = 1;                 // scratch/YYYY-MM-DD/YYYY-MM-DD-HHmmss_skewer.md
