// Custom Gaius service extensions for gaius-engine.
// Complements the KServe Open Inference Protocol with Gaius-specific operations.

syntax = "proto3";
package gaius.engine;

import "google/protobuf/empty.proto";

// ═══════════════════════════════════════════════════════════════════════════
// Orchestrator Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message OrchestratorStatusResponse {
  int32 total_gpus = 1;
  int32 available_gpus = 2;
  repeated GPUAllocation allocations = 3;
  repeated EndpointInfo endpoints = 4;
}

message GPUAllocation {
  string agent_alias = 1;
  string model = 2;
  repeated int32 gpu_ids = 3;
  float vram_reserved_gb = 4;
}

message EndpointInfo {
  string name = 1;
  string model = 2;
  string status = 3;  // "running", "stopped", "starting", "error"
  repeated int32 gpu_ids = 4;
  int32 port = 5;
}

message StartEndpointRequest {
  string endpoint_name = 1;
}

message StopEndpointRequest {
  string endpoint_name = 1;
  bool force = 2;
}

message RestartEndpointRequest {
  string endpoint_name = 1;
}

message EndpointResponse {
  bool success = 1;
  string message = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// Scheduler Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message CompleteRequest {
  string agent_alias = 1;
  string prompt = 2;
  string system_prompt = 3;
  int32 max_tokens = 4;
  float temperature = 5;
  string priority = 6;  // "critical", "high", "normal", "low"
}

message CompleteResponse {
  string text = 1;
  int32 tokens_used = 2;
  float latency_ms = 3;
  string model = 4;
  string job_id = 5;
}

message SubmitJobRequest {
  string agent_alias = 1;
  string prompt = 2;
  string system_prompt = 3;
  int32 max_tokens = 4;
  float temperature = 5;
  string priority = 6;
  bool async = 7;  // If true, returns immediately with job_id
}

message SubmitJobResponse {
  string job_id = 1;
  string status = 2;  // "queued", "running", "completed", "failed"
}

message GetJobResultRequest {
  string job_id = 1;
}

message GetJobResultResponse {
  string job_id = 1;
  string status = 2;
  string text = 3;
  int32 tokens_used = 4;
  float latency_ms = 5;
  string error = 6;
}

message SchedulerStatusResponse {
  int32 queue_depth = 1;
  int32 active_jobs = 2;
  float avg_latency_ms = 3;
  map<string, int32> jobs_by_priority = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// Evolution Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message EvolutionStatusResponse {
  bool running = 1;
  int32 cycles_completed = 2;
  float total_improvement_pct = 3;
  string current_agent = 4;
  string next_agent = 5;
  string mode = 6;  // "idle", "running", "paused"
  int64 last_cycle_timestamp_ms = 7;
}

message TriggerEvolutionRequest {
  string agent_id = 1;
}

message EvolutionCycleResponse {
  bool success = 1;
  float improvement_pct = 2;
  int32 duration_ms = 3;
  string agent_id = 4;
  string version_id = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// Health Streaming Messages
// ═══════════════════════════════════════════════════════════════════════════

message HealthStreamRequest {
  int32 interval_ms = 1;  // How often to send updates (default: 1000)
}

message HealthMetrics {
  int64 timestamp_ms = 1;
  repeated GPUMetrics gpus = 2;
  repeated EndpointHealth endpoints = 3;
  int32 queue_depth = 4;
  bool evolution_running = 5;
  float system_memory_used_gb = 6;
  float system_memory_total_gb = 7;
}

message GPUMetrics {
  int32 gpu_id = 1;
  float utilization = 2;  // 0.0 to 1.0
  float memory_used_gb = 3;
  float memory_total_gb = 4;
  int32 temperature_c = 5;
  int32 power_watts = 6;
}

message EndpointHealth {
  string name = 1;
  string model = 2;
  bool healthy = 3;
  int64 requests_served = 4;
  float avg_latency_ms = 5;
  int64 last_request_timestamp_ms = 6;
}

// ═══════════════════════════════════════════════════════════════════════════
// Event Streaming Messages
// ═══════════════════════════════════════════════════════════════════════════

message EventStreamRequest {
  repeated string event_types = 1;  // Filter by types, empty = all
}

message Event {
  string event_type = 1;
  int64 timestamp_ms = 2;
  string service = 3;  // "orchestrator", "scheduler", "evolution", etc.
  bytes data = 4;  // JSON-serialized event data
}

// Event types:
// - ENDPOINT_STARTED, ENDPOINT_STOPPED, ENDPOINT_ERROR
// - JOB_QUEUED, JOB_STARTED, JOB_COMPLETED, JOB_FAILED
// - EVOLUTION_STARTED, EVOLUTION_PROGRESS, EVOLUTION_COMPLETED
// - GPU_THRESHOLD_WARNING, GPU_THRESHOLD_CRITICAL

// ═══════════════════════════════════════════════════════════════════════════
// Grid Service Messages (Embedding Projection)
// ═══════════════════════════════════════════════════════════════════════════

message ProjectEmbeddingsRequest {
  repeated string embedding_ids = 1;
  string method = 2;  // "umap", "tsne", "pca"
  int32 grid_size = 3;  // Default: 19
}

message GridPosition {
  string id = 1;
  int32 x = 2;  // 0 to grid_size-1
  int32 y = 3;  // 0 to grid_size-1
  int32 cluster = 4;
  float confidence = 5;  // 0.0 to 1.0
}

message ProjectEmbeddingsResponse {
  repeated GridPosition positions = 1;
  int32 num_clusters = 2;
  int32 grid_size = 3;
}

message ProjectQueryRequest {
  repeated float embedding = 1;  // Query embedding vector
  string method = 2;  // "umap", "tsne", "pca"
}

message ProjectQueryResponse {
  int32 x = 1;
  int32 y = 2;
  repeated string nearest_ids = 3;  // IDs of nearest neighbors
  repeated float distances = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// TDA Service Messages (Topological Data Analysis)
// ═══════════════════════════════════════════════════════════════════════════

message ComputeTDARequest {
  repeated string embedding_ids = 1;
  string method = 2;  // "persistent_homology", "mapper"
  int32 max_dimension = 3;  // Default: 2
}

message PersistenceInterval {
  int32 dimension = 1;
  float birth = 2;
  float death = 3;
}

message TDAResponse {
  repeated PersistenceInterval intervals = 1;
  repeated int32 betti_numbers = 2;  // b0, b1, b2, ...
  bytes persistence_diagram = 3;  // Optional: serialized diagram
}

// ═══════════════════════════════════════════════════════════════════════════
// Service Definition
// ═══════════════════════════════════════════════════════════════════════════

service GaiusService {
  // ─────────────────────────────────────────────────────────────────────────
  // Orchestrator
  // ─────────────────────────────────────────────────────────────────────────
  rpc OrchestratorStatus(google.protobuf.Empty) returns (OrchestratorStatusResponse);
  rpc StartEndpoint(StartEndpointRequest) returns (EndpointResponse);
  rpc StopEndpoint(StopEndpointRequest) returns (EndpointResponse);
  rpc RestartEndpoint(RestartEndpointRequest) returns (EndpointResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Scheduler
  // ─────────────────────────────────────────────────────────────────────────
  rpc SchedulerStatus(google.protobuf.Empty) returns (SchedulerStatusResponse);
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJobResult(GetJobResultRequest) returns (GetJobResultResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Evolution
  // ─────────────────────────────────────────────────────────────────────────
  rpc EvolutionStatus(google.protobuf.Empty) returns (EvolutionStatusResponse);
  rpc TriggerEvolution(TriggerEvolutionRequest) returns (EvolutionCycleResponse);
  rpc StartEvolution(google.protobuf.Empty) returns (EvolutionStatusResponse);
  rpc StopEvolution(google.protobuf.Empty) returns (EvolutionStatusResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Grid (Embedding Projection)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ProjectEmbeddings(ProjectEmbeddingsRequest) returns (ProjectEmbeddingsResponse);
  rpc ProjectQuery(ProjectQueryRequest) returns (ProjectQueryResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // TDA (Topological Data Analysis)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ComputeTDA(ComputeTDARequest) returns (TDAResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Streaming
  // ─────────────────────────────────────────────────────────────────────────
  rpc HealthStream(HealthStreamRequest) returns (stream HealthMetrics);
  rpc EventStream(EventStreamRequest) returns (stream Event);
}
