// ═══════════════════════════════════════════════════════════════════════════
// Ambient Computing Workload Messages
// ═══════════════════════════════════════════════════════════════════════════

// Ambient cycle request - triggers multi-phase workload test
message AmbientCycleRequest {
  bool skip_reasoning = 1;        // Skip phase 3-4 (baseline only)
  int32 baseline_task_count = 2;  // Tasks per baseline endpoint (default: 1)
  string reasoning_prompt = 3;    // Custom reasoning prompt (or default)
}

// Phase enum for ambient cycle progress
enum AmbientPhase {
  AMBIENT_PHASE_UNSPECIFIED = 0;
  AMBIENT_PHASE_BASELINE_HEALTH = 1;
  AMBIENT_PHASE_BASELINE_WORKLOAD = 2;
  AMBIENT_PHASE_REASONING_EVICTION = 3;
  AMBIENT_PHASE_REASONING_WORKLOAD = 4;
  AMBIENT_PHASE_BASELINE_RESTORATION = 5;
  AMBIENT_PHASE_COMPLETE = 6;
  AMBIENT_PHASE_ERROR = 7;
  // New phases for content fetch and summarization
  AMBIENT_PHASE_FETCH_CONTENT = 8;
  AMBIENT_PHASE_SUMMARIZATION = 9;
  AMBIENT_PHASE_BUFFER_ANALYSIS = 10;  // Bytez analysis of new content
}

// Streaming event for ambient cycle progress
message AmbientPhaseEvent {
  AmbientPhase phase = 1;
  string message = 2;
  float progress = 3;               // 0.0 - 1.0 within phase
  map<string, string> metrics = 4;  // endpoint -> latency_ms, etc.
  int64 timestamp_ms = 5;
}

// Final ambient cycle response
message AmbientCycleResponse {
  bool success = 1;
  int32 phases_completed = 2;
  int32 total_tasks = 3;
  int32 successful_tasks = 4;
  map<string, int32> endpoint_latencies = 5;  // endpoint -> avg_latency_ms
  string error_message = 6;
  int32 duration_ms = 7;
}

// Ambient status response
message AmbientStatusResponse {
  bool cycle_running = 1;
  AmbientPhase current_phase = 2;
  int32 cycles_completed = 3;
  int64 last_cycle_timestamp_ms = 4;
  repeated string baseline_endpoints = 5;
  string reasoning_endpoint = 6;
  AmbientCycleResponse last_result = 7;
  // New fields for daemon mode
  bool daemon_running = 8;          // Is continuous daemon running?
  int32 max_cycles = 9;             // Target cycles (0 = infinite)
  int32 current_cycle = 10;         // Current cycle number in daemon
  int64 daemon_started_at_ms = 11;  // When daemon started (ms since epoch, 0 = never)
  int64 daemon_stopped_at_ms = 12;  // When daemon stopped (ms since epoch, 0 = never/running)
}

// ─────────────────────────────────────────────────────────────────────────
// Ambient Daemon Messages (Start/Stop continuous cycling)
// ─────────────────────────────────────────────────────────────────────────

// Start ambient daemon request
message AmbientStartRequest {
  bool baseline_only = 1;           // Skip reasoning phases
  int32 max_cycles = 2;             // 0 = infinite, N = run N cycles then stop
}

// Start ambient daemon response (fire-and-forget)
message AmbientStartResponse {
  bool success = 1;
  string message = 2;
  int32 max_cycles = 3;             // Echo back for confirmation
}

// Stop ambient daemon request
message AmbientStopRequest {}

// Stop ambient daemon response
message AmbientStopResponse {
  bool success = 1;
  string message = 2;
  int32 cycles_completed = 3;       // How many cycles ran before stop
}

// Subscribe to ambient events (for TUI InfoPanel)
message AmbientSubscribeRequest {}

// Note: Reuses AmbientPhaseEvent for streaming events

// Export ambient buffer to zettelkasten file
message AmbientBufferExportRequest {
  string kb_root = 1;  // Optional, defaults to build/dev
}

message AmbientBufferExportResponse {
  string path = 1;           // Relative path: scratch/2026-01-03/143025_buffer.md
  int32 entry_count = 2;
  int64 total_bytes = 3;
  string error = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// Observability Dashboard Messages
// ═══════════════════════════════════════════════════════════════════════════

// Request for observability dashboard data
message ObserveStatusRequest {
  bool include_sparklines = 1;    // Include time-series data for sparklines
  int32 sparkline_points = 2;     // Number of historical points (default: 20)
}

// Snapshot of a single metric
message MetricSnapshot {
  string name = 1;                // Internal metric ID (e.g., "latency_p95")
  string display_name = 2;        // Human-readable name (e.g., "Latency p95")
  double current_value = 3;       // Current metric value
  string unit = 4;                // Unit suffix (e.g., "ms", "%", "cycles")
  repeated double sparkline_data = 5;  // Historical values for sparkline rendering
  string status = 6;              // "ok", "warning", "critical"
}

// Snapshot of an endpoint's status
message EndpointSnapshot {
  string name = 1;                // Endpoint name (e.g., "orchestrator", "reasoning")
  string status = 2;              // "healthy", "starting", "unhealthy", "stopped", "pending"
  repeated int32 gpus = 3;        // Allocated GPU IDs
  string model = 4;               // Model name
}

// Response with full observability dashboard data
message ObserveStatusResponse {
  string timestamp = 1;           // ISO8601 timestamp
  bool prometheus_available = 2;  // Whether Prometheus is reachable

  // Metrics matching ObservePanel's OBSERVE_METRICS
  repeated MetricSnapshot metrics = 3;

  // Endpoint status from orchestrator
  repeated EndpointSnapshot endpoints = 4;

  // Summary counts
  int32 healthy_endpoints = 5;
  int32 unhealthy_endpoints = 6;
  int32 active_incidents = 7;
  int32 evolution_cycles = 8;
}

// ═══════════════════════════════════════════════════════════════════════════
// Prospects/Stewardship Messages
// ═══════════════════════════════════════════════════════════════════════════

// Candidate summary for status response
message CandidateSummary {
  string symbol = 1;
  string company_name = 2;
  string exchange = 3;
  string cik = 4;
  string last_filing_date = 5;    // ISO date of most recent SEC filing
  string last_filing_type = 6;    // 10-K, 10-Q, 8-K
  int32 pending_filings = 7;      // Filings awaiting analysis
}

// Strategy summary for status response
message StrategySummary {
  string symbol = 1;
  string category = 2;            // Free text: "growth", "income", "strategic"
  float allocation_weight = 3;    // Current weight 0.0-1.0
  float target_weight = 4;        // Target weight
  float conviction = 5;           // 0.0-1.0
  string last_analysis_at = 6;    // ISO timestamp
  bool needs_update = 7;          // Local LLM flagged for attention
}

// Status request - lightweight check of prospect state
message ProspectsStatusRequest {
  string profile = 1;             // Profile context (e.g., "zndx", "home")
  string domain = 2;              // Domain context (e.g., "prospecting", "retirement")
  repeated string symbols = 3;    // Filter to specific symbols (empty = all)
}

// Full status response
message ProspectsStatusResponse {
  bool success = 1;
  string profile = 2;
  string domain = 3;
  repeated CandidateSummary candidates = 4;
  repeated StrategySummary strategies = 5;
  int32 pending_filings = 6;      // Total filings awaiting analysis
  string last_fmp_sync_at = 7;    // ISO timestamp
  bool update_recommended = 8;    // Local LLM recommends full update
  string update_reason = 9;       // Why update is recommended
  string error = 10;
  int64 buffer_bytes = 11;        // prospects-buffer current bytes
  int64 buffer_max_bytes = 12;
  int32 buffer_entries = 13;
}

// Check request - lightweight daily check (local LLM only)
message ProspectsCheckRequest {
  string profile = 1;
  string domain = 2;
  bool force = 3;                 // Force check even if recently checked
}

message ProspectsCheckResponse {
  bool success = 1;
  bool update_recommended = 2;    // Should user run /prospects update?
  string reason = 3;              // Why update recommended/not recommended
  int32 new_filings_count = 4;    // New SEC filings found
  repeated string symbols_with_new_filings = 5;
  string checked_at = 6;          // ISO timestamp
  int32 duration_ms = 7;
  string error = 8;
}

// Update request - full billable analysis (Cerebras + Grok)
message ProspectsUpdateRequest {
  string profile = 1;
  string domain = 2;
  repeated string symbols = 3;    // Filter to specific symbols (empty = all)
  bool force = 4;                 // Force update even if no new filings
  int32 filings_per_symbol = 5;   // Max filings per symbol (0 = default 20, for stepwise testing)
}

// Streaming progress event during update
message ProspectsUpdateEvent {
  enum Type {
    QUEUED = 0;                   // Request queued
    FMP_SYNC_STARTED = 1;         // Syncing with FMP API
    FMP_SYNC_COMPLETED = 2;       // FMP sync done
    ANALYSIS_STARTED = 3;         // Starting Cerebras analysis
    FILING_ANALYZED = 4;          // Individual filing analyzed
    SYNTHESIS_STARTED = 5;        // XAI Grok synthesis
    SYNTHESIS_COMPLETED = 6;      // Synthesis done
    KB_WRITE_STARTED = 7;         // Writing KB documents
    KB_WRITE_COMPLETED = 8;       // KB docs written
    COMPLETED = 9;                // Full update complete
    FAILED = 10;                  // Update failed
  }
  Type type = 1;
  int64 timestamp_ms = 2;
  float progress = 3;             // 0.0-1.0
  string message = 4;             // Human-readable status
  string symbol = 5;              // For FILING_ANALYZED events
  string filing_type = 6;         // For FILING_ANALYZED events
  bytes data = 7;                 // JSON payload for rich events
  string sitrep_path = 8;         // Path to sitrep.md (only on COMPLETED)
}

// =============================================================================
// Collections (Public Content Landing Page)
// =============================================================================

// Collection summary for list views
message CollectionInfo {
  string collection_id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string status = 5;              // draft, active, archived
  bool featured = 6;
  int32 total_cards = 7;
  int32 pending_cards = 8;
  int32 published_cards = 9;
  string created_at = 10;
}

// Card summary for list views
message CardInfo {
  string card_id = 1;
  string title = 2;
  string summary = 3;
  string source_url = 4;
  string source_type = 5;         // arxiv, huggingface, cloudera, web, x_bookmark
  string image_url = 6;
  string status = 7;              // pending, published, archived
  string published_at = 8;
  int32 sequence = 9;
}

// Status request (overall statistics)
message CollectionStatusRequest {}

message CollectionStatusResponse {
  bool success = 1;
  int32 total_collections = 2;
  int32 total_cards = 3;
  int32 pending_cards = 4;
  int32 published_cards = 5;
  CollectionInfo featured_collection = 6;
  string error = 7;
}

// List collections request
message CollectionListRequest {
  string status = 1;              // Filter by status (empty = all)
  int32 limit = 2;                // Max results (default 50)
}

message CollectionListResponse {
  bool success = 1;
  repeated CollectionInfo collections = 2;
  string error = 3;
}

// Create collection request
message CollectionCreateRequest {
  string slug = 1;
  string name = 2;
  string description = 3;
  bool featured = 4;              // Set as featured collection
}

message CollectionCreateResponse {
  bool success = 1;
  CollectionInfo collection = 2;
  string error = 3;
}

// Set featured collection
message CollectionSetFeaturedRequest {
  string slug = 1;                // Collection slug to set as featured
}

message CollectionSetFeaturedResponse {
  bool success = 1;
  CollectionInfo collection = 2;
  string error = 3;
}

// Add card to collection
message CollectionAddCardRequest {
  string slug = 1;                // Collection slug
  string title = 2;
  string summary = 3;
  string source_url = 4;
  string source_type = 5;
  string image_url = 6;
}

message CollectionAddCardResponse {
  bool success = 1;
  CardInfo card = 2;
  string error = 3;
}

// List cards in collection
message CollectionListCardsRequest {
  string slug = 1;                // Collection slug
  string status = 2;              // Filter by status (empty = all)
  int32 limit = 3;                // Max results (default 100)
}

message CollectionListCardsResponse {
  bool success = 1;
  repeated CardInfo cards = 2;
  int32 total = 3;
  string error = 4;
}

// Publish pending cards
message CollectionPublishCardsRequest {
  int32 count = 1;                // Number of cards to publish (default 3)
  string collection_slug = 2;     // Specific collection (empty = featured)
}

message CollectionPublishCardsResponse {
  bool success = 1;
  repeated CardInfo published_cards = 2;
  int32 published_count = 3;
  string error = 4;
}

// Publish 3D visualization data to KV
message CollectionPublishVizRequest {}

message CollectionPublishVizResponse {
  bool success = 1;
  int32 points_count = 2;         // Number of points in viz
  int32 clusters_count = 3;       // Number of clusters
  string published_at = 4;
  string error = 5;
}

// Sync theme configuration from HOCON to Cloudflare KV
message CollectionSyncThemeRequest {}

message CollectionSyncThemeResponse {
  bool success = 1;
  string theme_id = 2;            // Theme synced (e.g., "keiretsu-dark")
  string title = 3;               // Site title
  string namespace_id = 4;        // KV namespace synced to
  string error = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// Article Curation (Situational Awareness + gRPC Compliance)
// ═══════════════════════════════════════════════════════════════════════════

// Article info for list responses
message ArticleInfo {
  string slug = 1;
  string title = 2;
  string status = 3;
  int32 zk_count = 4;
  int32 sources_count = 5;
}

// Recent curation run info
message CurationRunInfo {
  string run_id = 1;
  string slug = 2;
  string completed_at = 3;
  int32 cards_created = 4;
}

// Get article curation situational awareness
message ArticleStatusRequest {}

message ArticleStatusResponse {
  bool success = 1;
  bool running = 2;                           // Is curation flow currently running?
  string current_run_id = 3;                  // UUID of running flow (if any)
  string current_step = 4;                    // Current step name (if running)
  int32 articles_pending = 5;                 // Count of pending articles
  repeated ArticleInfo articles = 6;          // List of articles
  repeated CurationRunInfo recent_curations = 7;  // Recent completed curations
  int32 total_cards_pending = 8;              // Count of pending cards
  int32 total_cards_published = 9;            // Count of published cards
  string error = 10;
}

// Create new article directory structure (Engine-First)
message ArticleNewRequest {
  string slug = 1;                            // URL-friendly identifier
  string title = 2;                           // Display title (defaults to title-cased slug)
}

message ArticleNewResponse {
  bool success = 1;
  string slug = 2;
  string title = 3;
  string kb_path = 4;
  string article_id = 5;
  string collection_id = 6;
  string message = 7;
  string error = 8;
}

// Article curation progress event (for streaming)
message ArticleCurationEvent {
  string run_id = 1;
  string step = 2;                            // start, select, research, acquire, summarize, draft, base, cards, complete, failed
  int32 step_number = 3;
  int32 total_steps = 4;
  float progress = 5;                         // 0.0 - 1.0
  string message = 6;
}

// Stream article curation progress
message ArticleCurateRequest {
  string slug = 1;                            // Article slug to curate (empty = select from pending)
  bool skip_grok = 2;                         // Skip Grok synthesis
  int32 max_sources = 3;                      // Max external sources to acquire
}

// ═══════════════════════════════════════════════════════════════════════════
// Rendering (Blender Card Visualization)
// ═══════════════════════════════════════════════════════════════════════════

enum RenderPhase {
  RENDER_PHASE_UNSPECIFIED = 0;
  RENDER_PHASE_QUEUED = 1;          // Waiting for GPU resources
  RENDER_PHASE_ALLOCATING = 2;      // Evicting endpoints for GPU memory
  RENDER_PHASE_RENDERING = 3;       // Blender subprocess running
  RENDER_PHASE_UPLOADING = 4;       // Uploading to R2
  RENDER_PHASE_COMPLETE = 5;        // Card done
  RENDER_PHASE_FAILED = 6;          // Card failed
  RENDER_PHASE_BATCH_COMPLETE = 7;  // All cards done
}

message RenderCardsRequest {
  string collection_slug = 1;       // Render all pending cards in collection (empty = all)
  string card_id = 2;               // Render specific card (overrides collection)
  int32 sample = 3;                 // Random sample N cards (0 = all matching)
  repeated string variants = 4;     // ["display", "og"] (empty = all)
  bool force = 5;                   // Re-render even if image_url exists
  bool upload = 6;                  // Upload to R2 after rendering
}

message RenderCardEvent {
  RenderPhase phase = 1;
  string card_id = 2;               // Which card this event is for
  string message = 3;
  float progress = 4;               // 0.0-1.0 for overall batch progress
  string variant = 5;               // Which variant just completed
  string output_path = 6;           // Local path (on PHASE_COMPLETE)
  string image_url = 7;             // R2 URL (on PHASE_UPLOADING complete)
  int32 cards_done = 8;
  int32 cards_total = 9;
  int32 duration_ms = 10;
  string error = 11;                // Guru code on PHASE_FAILED
}

// ═══════════════════════════════════════════════════════════════════════════
// Service Definition
// ═══════════════════════════════════════════════════════════════════════════

// Ephemeral Signals DCGM scrape. Nothing persisted.
message SignalsTelemetryRequest {}

message GpuWatt {
  int32 index = 1;
  string uuid = 2;
  string model = 3;
  double power_w = 4;
  double util = 5;
  double memory_used_mib = 6;
  double memory_free_mib = 7;
  double energy_mj = 8;
  double temp_c = 9;
}

message SignalsTelemetryResponse {
  string source_url = 1;
  string scraped_at = 2;
  repeated GpuWatt gpus = 3;
  double total_w = 4;
  double parked_w = 5;
  double inferring_w = 6;
  string error = 7;
}

// Discover landing — ELK hist + Activation Examples on our corpus.
message DiscoverSurfaceRequest {
  string window = 1;                 // default 1h; also 24h | 36h | 7d | 30d
  string query = 2;                  // stream: source: feature: + free text
  string breakdown = 3;              // stream | source | layer
  int32 limit = 4;                   // docs page size, default 50
  string cursor = 5;
  repeated string feature_pins = 6;  // "12:4412"
  string from_ts = 7;
  string to_ts = 8;
}

message DiscoverBucket {
  string t = 1;
  int32 n = 2;
  string breakdown_key = 3;
  double salience = 4;
  double watts = 5;
  double util = 6;
  double salience_ma = 7;
  double watts_ma = 8;
  double util_ma = 9;
}

message DiscoverEpisode {
  string kind = 1;
  string at = 2;
  int32 eta_s = 3;
  string label = 4;
}

message DiscoverDoc {
  string id = 1;
  string stream = 2;
  string source = 3;
  string ts = 4;
  string title = 5;
  string body = 6;
  string source_id = 7;
  string url = 8;
}

message DiscoverFacet {
  string key = 1;
  string kind = 2;                   // stream | source | feature
  int32 count = 3;
  double salience = 4;
  string label = 5;                  // display; empty = use key
}

message DiscoverSurfaceResponse {
  repeated DiscoverBucket buckets = 1;
  repeated DiscoverDoc docs = 2;
  repeated DiscoverFacet facets = 3;
  int32 total = 4;
  string window = 5;
  string query = 6;
  string scraped_at = 7;
  string interval = 8;
  string error = 9;
  string last_salience_at = 10;
  DiscoverEpisode next_episode = 11;
  string clock = 12;                 // salience | wall
  DiscoverStatus status = 13;        // Signals-style strip (Engine + lens counts)
}

// Live strip on Discover `/`. Cheap / cached — not the tape join.
message DiscoverStatus {
  bool updating = 1;                 // MV CONCURRENTLY in flight
  int32 workflows = 2;               // currently running
  string waiting_at = 3;             // next salience ISO
  double watts = 4;                  // live Signals DCGM total
  int32 articles = 5;
  int32 projects = 6;
  int32 thoughts = 7;
  bool watts_live = 8;               // scrape succeeded
  int32 terms_skos = 9;              // OWL/SKOS terms in article bodies
  int32 terms_cites = 10;            // current cited references (sources/)
  double agenda_min = 11;            // agenda items/day
  double agenda_max = 12;
  double agenda_std = 13;
  double salience_peak = 14;         // peak hourly salience in 36h
  int32 cognition_tokens = 15;       // tokens in cognition thought buffers
}

// Concurrent refresh of discover_landing_36h. Returns as soon as the
// refresh is accepted (running or coalesced); does not wait for CONCURRENTLY.
message RefreshDiscoverLandingRequest {
  string reason = 1;                 // flow name / run_id
}

message RefreshDiscoverLandingResponse {
  bool accepted = 1;
  bool started = 2;                  // false if coalesced onto an in-flight refresh
  string refreshed_at = 3;           // last completed refresh, may be empty if first
  string error = 4;
}

service GaiusService {
  // ─────────────────────────────────────────────────────────────────────────
  // Orchestrator
  // ─────────────────────────────────────────────────────────────────────────
  rpc OrchestratorStatus(google.protobuf.Empty) returns (OrchestratorStatusResponse);
  rpc EnsureEndpoint(StartEndpointRequest) returns (EnsureEndpointResponse);  // Agent-first: ensure ready
  rpc StartEndpoint(StartEndpointRequest) returns (EndpointResponse);
  rpc StopEndpoint(StopEndpointRequest) returns (EndpointResponse);
  rpc RestartEndpoint(RestartEndpointRequest) returns (EndpointResponse);
  rpc CleanStart(CleanStartRequest) returns (CleanStartResponse);  // Kill stale processes and optionally start endpoints

  // Phase Change Pattern - Resilient Dynamic Workload Coordination
  rpc PhaseChange(PhaseChangeRequest) returns (PhaseChangeResponse);           // Execute phase change with convergence waiting
  rpc GetPhaseChangeProfiles(google.protobuf.Empty) returns (PhaseChangeProfilesResponse);  // Get timing statistics
  rpc GetActivePhaseChanges(google.protobuf.Empty) returns (ActivePhaseChangesResponse);    // Get in-progress changes

  // ─────────────────────────────────────────────────────────────────────────
  // Scheduler
  // ─────────────────────────────────────────────────────────────────────────
  rpc SchedulerStatus(google.protobuf.Empty) returns (SchedulerStatusResponse);
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJobResult(GetJobResultRequest) returns (GetJobResultResponse);
  rpc XAIBudget(google.protobuf.Empty) returns (XAIBudgetResponse);  // XAI budget tracking

  // Streaming swarm analysis - returns progress events then final result
  // Handles backend wait internally, streaming QUEUED status while waiting
  rpc SwarmStream(SwarmStreamRequest) returns (stream SwarmEvent);

  // ─────────────────────────────────────────────────────────────────────────
  // Workload Management (Yunikorn-Style)
  // ─────────────────────────────────────────────────────────────────────────
  rpc BeginWorkload(BeginWorkloadRequest) returns (BeginWorkloadResponse);
  rpc CompleteWorkload(CompleteWorkloadRequest) returns (google.protobuf.Empty);
  rpc GetActiveWorkloads(google.protobuf.Empty) returns (GetActiveWorkloadsResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Embeddings (Engine-Managed)
  // ─────────────────────────────────────────────────────────────────────────
  rpc EmbedTexts(EmbedTextsRequest) returns (EmbedTextsResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Semantic Search
  // ─────────────────────────────────────────────────────────────────────────
  rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse);

  // Streaming semantic search with progress events for observing ColNomic deployment
  // Use this when the TUI needs to show GPU allocation and model loading progress
  rpc SemanticSearchStream(SemanticSearchRequest) returns (stream SemanticSearchEvent);

  // Multi-phase search workflow with Metaflow execution
  // Combines BM25, vector search, web search, and parallel LLM synthesis
  rpc SearchFlowStream(SearchFlowRequest) returns (stream SearchFlowEvent);

  // Deep research workflow with MemRL (multi-pass with Q-learning)
  // Combines search, 7-agent swarm, Grok synthesis, and convergence detection
  rpc ResearchFlowStream(ResearchFlowRequest) returns (stream ResearchFlowEvent);
  // Get current research status (for /research status)
  rpc ResearchFlowStatus(google.protobuf.Empty) returns (ResearchFlowStatusResponse);
  // Request stop of running research (for /research stop)
  rpc ResearchFlowStop(google.protobuf.Empty) returns (ResearchFlowStopResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Evolution
  // ─────────────────────────────────────────────────────────────────────────
  rpc EvolutionStatus(google.protobuf.Empty) returns (EvolutionStatusResponse);
  rpc TriggerEvolution(TriggerEvolutionRequest) returns (EvolutionCycleResponse);
  rpc StartEvolution(google.protobuf.Empty) returns (EvolutionStatusResponse);
  rpc StopEvolution(google.protobuf.Empty) returns (EvolutionStatusResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Cognition
  // ─────────────────────────────────────────────────────────────────────────
  rpc CognitionStatus(google.protobuf.Empty) returns (CognitionStatusResponse);
  rpc GetRecentThoughts(GetRecentThoughtsRequest) returns (GetRecentThoughtsResponse);
  rpc TriggerCognition(TriggerCognitionRequest) returns (TriggerCognitionResponse);
  rpc CognitionActivity(google.protobuf.Empty) returns (CognitionActivityResponse);
  rpc CognitionSurface(CognitionSurfaceRequest) returns (CognitionSurfaceResponse);
  rpc CognitionWaterfall(CognitionWaterfallRequest) returns (CognitionWaterfallResponse);
  rpc SelfObservation(SelfObservationRequest) returns (SelfObservationResponse);
  rpc EngineAudit(EngineAuditRequest) returns (EngineAuditResponse);

  // Cognition streaming - replaces TUI polling
  rpc SubscribeCognition(CognitionStreamRequest) returns (stream CognitionEvent);
  rpc CognitionThought(CognitionThoughtRequest) returns (CognitionThoughtResponse);

  // Evolution streaming - replaces TUI polling
  rpc SubscribeEvolution(EvolutionStreamRequest) returns (stream EvolutionEvent);

  // Unified activity stream - all system activity
  rpc SubscribeActivity(ActivityStreamRequest) returns (stream ActivityEvent);

  // ─────────────────────────────────────────────────────────────────────────
  // State (Thin Client Architecture)
  // ─────────────────────────────────────────────────────────────────────────
  rpc GetCurrentState(GetStateRequest) returns (GridState);
  rpc SubscribeState(SubscribeStateRequest) returns (stream StateUpdate);
  rpc GetPreferences(GetPreferencesRequest) returns (UIPreferences);
  rpc SavePreferences(SavePreferencesRequest) returns (google.protobuf.Empty);
  rpc PruneSnapshots(PruneSnapshotsRequest) returns (PruneSnapshotsResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Command (Unified Entry Point)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

  // Full init: index KB + project to grid + compute TDA + save to cache
  rpc Init(InitRequest) returns (InitResponse);
  rpc InitProgressStream(InitRequest) returns (stream InitProgress);

  // Reindex: re-embed documents + re-project + re-compute TDA
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
  rpc ReindexStream(ReindexRequest) returns (stream ReindexProgress);

  // ─────────────────────────────────────────────────────────────────────────
  // Grid (Embedding Projection)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ProjectEmbeddings(ProjectEmbeddingsRequest) returns (ProjectEmbeddingsResponse);
  rpc ProjectQuery(ProjectQueryRequest) returns (ProjectQueryResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // TDA (Topological Data Analysis)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ComputeTDA(ComputeTDARequest) returns (TDAResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Explain (Grid Position Interpretation)
  // ─────────────────────────────────────────────────────────────────────────
  rpc Explain(ExplainRequest) returns (ExplainResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Dataset Generation
  // ─────────────────────────────────────────────────────────────────────────
  rpc SubmitDatasetJob(DatasetGenerationRequest) returns (DatasetJobStatus);
  rpc GetDatasetJobStatus(GetDatasetJobRequest) returns (DatasetJobStatus);
  rpc CancelDatasetJob(CancelDatasetJobRequest) returns (DatasetJobStatus);
  rpc DatasetProgressStream(GetDatasetJobRequest) returns (stream DatasetProgressEvent);
  rpc GetDatasetLineage(DatasetLineageRequest) returns (DatasetLineageResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // ThetaAgent (Neuromorphic Consolidation)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ThetaSitrep(ThetaSitrepRequest) returns (ThetaSitrepResponse);
  rpc ThetaConsolidate(ThetaConsolidateRequest) returns (ThetaConsolidateResponse);
  rpc ThetaConsolidationStats(ThetaConsolidationStatsRequest) returns (ThetaConsolidationStatsResponse);
  rpc ThetaAgenda(ThetaAgendaRequest) returns (ThetaAgendaResponse);
  rpc AgendaList(AgendaListRequest) returns (AgendaListResponse);
  rpc AgendaGet(AgendaGetRequest) returns (AgendaGetResponse);
  rpc AgendaCreate(AgendaCreateRequest) returns (AgendaCreateResponse);
  rpc AgendaUpdate(AgendaUpdateRequest) returns (AgendaUpdateResponse);
  rpc WeeklySignalsSummary(WeeklySignalsSummaryRequest) returns (WeeklySignalsSummaryResponse);
  rpc WeeklySignalsSummaryList(WeeklySignalsSummaryListRequest) returns (WeeklySignalsSummaryListResponse);
  rpc WeeklySignalsSummaryGet(WeeklySignalsSummaryGetRequest) returns (WeeklySignalsSummaryGetResponse);
  rpc KnowledgeSummary(KnowledgeSummaryRequest) returns (KnowledgeSummaryResponse);
  rpc FederationSurfaces(FederationSurfacesRequest) returns (FederationSurfacesResponse);
  rpc FederationCognition(FederationCognitionRequest) returns (FederationCognitionResponse);
  rpc CognitionCorpus(CognitionCorpusRequest) returns (CognitionCorpusResponse);
  rpc CognitionTrace(CognitionTraceRequest) returns (CognitionTraceResponse);
  rpc AskPresent(AskPresentRequest) returns (AskPresentResponse);
  rpc FmpNews(FmpNewsRequest) returns (FmpNewsResponse);
  rpc FmpSearch(FmpSearchRequest) returns (FmpSearchResponse);
  rpc FmpEmployees(FmpEmployeesRequest) returns (FmpEmployeesResponse);
  rpc SummaryIndex(SummaryIndexRequest) returns (SummaryIndexResponse);
  rpc SummaryGet(SummaryGetRequest) returns (SummaryGetResponse);
  rpc SummaryHop(SummaryHopRequest) returns (SummaryHopResponse);
  rpc SummaryFork(SummaryForkRequest) returns (SummaryForkResponse);
  rpc SummarySchedules(SummarySchedulesRequest) returns (SummarySchedulesResponse);
  rpc SummaryScheduleTrigger(SummaryScheduleTriggerRequest) returns (SummaryScheduleTriggerResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // MetaAgent (Multi-Agent Analytics)
  // ─────────────────────────────────────────────────────────────────────────
  rpc MetaAgentQuery(MetaAgentQueryRequest) returns (MetaAgentQueryResponse);
  rpc MetaAgentQueryStream(MetaAgentQueryRequest) returns (stream MetaAgentEvent);

  // MetaAgent Service (Metabase Sync & Weekly Audit)
  rpc MetaAgentStatus(MetaAgentStatusRequest) returns (MetaAgentStatusResponse);           // Daemon status
  rpc MetabaseSyncTrigger(MetabaseSyncRequest) returns (MetabaseSyncResponse);             // Manual sync trigger
  rpc MetaAgentAuditTrigger(MetaAgentAuditRequest) returns (MetaAgentAuditResponse);       // Manual audit trigger
  rpc GetPooledBudget(GetPooledBudgetRequest) returns (GetPooledBudgetResponse);           // Budget status
  rpc GetQualitySummary(GetQualitySummaryRequest) returns (GetQualitySummaryResponse);     // Quality metrics
  rpc ListRecommendations(ListRecommendationsRequest) returns (ListRecommendationsResponse); // Audit recommendations
  rpc UpdateRecommendation(UpdateRecommendationRequest) returns (UpdateRecommendationResponse); // Update rec status

  // ─────────────────────────────────────────────────────────────────────────
  // CLT (Cross-Layer Transcoders)
  // ─────────────────────────────────────────────────────────────────────────
  rpc CLTExtract(CLTExtractRequest) returns (CLTExtractResponse);
  rpc CLTAttribute(CLTAttributeRequest) returns (CLTAttributeResponse);
  rpc CLTStatus(CLTStatusRequest) returns (CLTStatusResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Streaming
  // ─────────────────────────────────────────────────────────────────────────
  rpc HealthStream(HealthStreamRequest) returns (stream HealthMetrics);
  rpc EventStream(EventStreamRequest) returns (stream Event);

  // Bidirectional initialization stream - allows TUI/MCP to connect immediately
  // during engine startup and receive real-time progress, while also sending
  // control commands (pause, cancel, health checks) back to the engine.
  rpc InitStream(stream InitCommand) returns (stream InitEvent);

  // ─────────────────────────────────────────────────────────────────────────
  // HealthObserver (Autonomous FMEA Monitoring + ACP Escalation)
  // ─────────────────────────────────────────────────────────────────────────
  rpc HealthObserverStatus(HealthObserverStatusRequest) returns (HealthObserverStatusResponse);
  rpc HealthObserverStart(google.protobuf.Empty) returns (HealthObserverStatusResponse);
  rpc HealthObserverStop(google.protobuf.Empty) returns (HealthObserverStatusResponse);
  rpc HealthObserverForceCheck(ForceHealthCheckRequest) returns (ForceHealthCheckResponse);
  rpc HealthObserverListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
  rpc HealthObserverGetIncident(GetIncidentDetailRequest) returns (GetIncidentDetailResponse);
  rpc HealthObserverResolveIncident(ResolveIncidentRequest) returns (ResolveIncidentResponse);
  rpc HealthObserverGetOrphanedIssues(GetOrphanedIssuesRequest) returns (GetOrphanedIssuesResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Observability Dashboard
  // ─────────────────────────────────────────────────────────────────────────
  rpc ObserveStatus(ObserveStatusRequest) returns (ObserveStatusResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // X Bookmarks
  // ─────────────────────────────────────────────────────────────────────────
  rpc XBookmarksGetAuthUrl(XBookmarksAuthRequest) returns (XBookmarksAuthResponse);
  rpc XBookmarksCompleteAuth(XBookmarksCompleteAuthRequest) returns (XBookmarksCompleteAuthResponse);
  rpc XBookmarksCompleteAuthByState(XBookmarksCompleteAuthByStateRequest) returns (XBookmarksCompleteAuthResponse);  // Engine Federation / Cloudflare Worker callback
  rpc XBookmarksAuthStatus(XBookmarksAuthStatusRequest) returns (XBookmarksAuthStatusResponse);
  rpc XBookmarksTriggerSync(XBookmarksSyncRequest) returns (XBookmarksSyncResponse);
  rpc XBookmarksSyncStatus(XBookmarksSyncStatusRequest) returns (XBookmarksSyncStatusResponse);
  rpc XBookmarksServiceStatus(XBookmarksServiceStatusRequest) returns (XBookmarksServiceStatusResponse);
  rpc XBookmarksListFolders(XBookmarksListFoldersRequest) returns (XBookmarksListFoldersResponse);
  rpc XBookmarksQueueStatus(XBookmarksQueueStatusRequest) returns (XBookmarksQueueStatusResponse);
  rpc XBookmarksEmitTestEvent(XBookmarksEmitTestEventRequest) returns (XBookmarksEmitTestEventResponse);  // Debug: emit test event with OTel tracing

  // ─────────────────────────────────────────────────────────────────────────
  // HuggingFace Dataset Discovery
  // ─────────────────────────────────────────────────────────────────────────
  rpc ListHFDatasets(ListHFDatasetsRequest) returns (ListHFDatasetsResponse);
  rpc AddExternalDataset(AddExternalDatasetRequest) returns (AddExternalDatasetResponse);
  rpc GetHFDatasetInfo(GetHFDatasetInfoRequest) returns (GetHFDatasetInfoResponse);
  rpc ListKBDatasets(ListKBDatasetsRequest) returns (ListKBDatasetsResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // HuggingFace Model Discovery
  // ─────────────────────────────────────────────────────────────────────────
  rpc ListHFModels(ListHFModelsRequest) returns (ListHFModelsResponse);
  rpc AddExternalModel(AddExternalModelRequest) returns (AddExternalModelResponse);
  rpc GetHFModelInfo(GetHFModelInfoRequest) returns (GetHFModelInfoResponse);
  rpc ListKBModels(ListKBModelsRequest) returns (ListKBModelsResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Ambient Computing Workload
  // ─────────────────────────────────────────────────────────────────────────
  rpc AmbientCycle(AmbientCycleRequest) returns (stream AmbientPhaseEvent);  // Streaming cycle with progress events (deprecated: use AmbientStart)
  rpc AmbientStatus(google.protobuf.Empty) returns (AmbientStatusResponse);  // Current ambient status
  rpc AmbientStart(AmbientStartRequest) returns (AmbientStartResponse);      // Start continuous ambient cycling daemon
  rpc AmbientStop(AmbientStopRequest) returns (AmbientStopResponse);         // Stop ambient daemon gracefully
  rpc AmbientSubscribe(AmbientSubscribeRequest) returns (stream AmbientPhaseEvent);  // Subscribe to ambient events (TUI)
  rpc AmbientBufferExport(AmbientBufferExportRequest) returns (AmbientBufferExportResponse);  // Export buffer to zettelkasten file

  // ─────────────────────────────────────────────────────────────────────────
  // Prospects/Stewardship (Capital Stewardship System)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ProspectsStatus(ProspectsStatusRequest) returns (ProspectsStatusResponse);      // Lightweight status check
  rpc ProspectsCheck(ProspectsCheckRequest) returns (ProspectsCheckResponse);         // Daily check with local LLM
  rpc ProspectsUpdate(ProspectsUpdateRequest) returns (stream ProspectsUpdateEvent);  // Full billable analysis (streaming)

  // ─────────────────────────────────────────────────────────────────────────
  // Collections (Public Content Landing Page)
  // ─────────────────────────────────────────────────────────────────────────
  rpc CollectionStatus(CollectionStatusRequest) returns (CollectionStatusResponse);      // Get overall statistics
  rpc CollectionList(CollectionListRequest) returns (CollectionListResponse);            // List all collections
  rpc CollectionCreate(CollectionCreateRequest) returns (CollectionCreateResponse);       // Create new collection
  rpc CollectionSetFeatured(CollectionSetFeaturedRequest) returns (CollectionSetFeaturedResponse);  // Set featured collection
  rpc CollectionAddCard(CollectionAddCardRequest) returns (CollectionAddCardResponse);    // Add card to collection
  rpc CollectionListCards(CollectionListCardsRequest) returns (CollectionListCardsResponse);  // List cards in collection
  rpc CollectionPublishCards(CollectionPublishCardsRequest) returns (CollectionPublishCardsResponse);  // Publish pending cards
  rpc CollectionPublishViz(CollectionPublishVizRequest) returns (CollectionPublishVizResponse);  // Update 3D viz data
  rpc CollectionSyncTheme(CollectionSyncThemeRequest) returns (CollectionSyncThemeResponse);    // Sync HOCON theme to KV

  // ─────────────────────────────────────────────────────────────────────────
  // Article Curation (gRPC-First, Engine Owns Filesystem)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ArticleStatus(ArticleStatusRequest) returns (ArticleStatusResponse);               // Situational awareness for /article sitrep
  rpc ArticleNew(ArticleNewRequest) returns (ArticleNewResponse);                        // Create article (engine writes to KB)
  rpc ArticleCurate(ArticleCurateRequest) returns (stream ArticleCurationEvent);         // Stream curation progress events

  // ─────────────────────────────────────────────────────────────────────────
  // Rendering (Blender Card Visualization via Workload Management)
  // ─────────────────────────────────────────────────────────────────────────
  rpc RenderCards(RenderCardsRequest) returns (stream RenderCardEvent);                   // Stream card rendering progress

  // Signals DCGM — one scrape, no store. Discover via Status.surfaces kind=telemetry.
  rpc SignalsTelemetry(SignalsTelemetryRequest) returns (SignalsTelemetryResponse);
  rpc DiscoverSurface(DiscoverSurfaceRequest) returns (DiscoverSurfaceResponse);
  rpc RefreshDiscoverLanding(RefreshDiscoverLandingRequest) returns (RefreshDiscoverLandingResponse);
}
