// Custom Gaius service extensions for gaius-engine.
// Complements the KServe Open Inference Protocol with Gaius-specific operations.

syntax = "proto3";
package gaius.engine;

import "google/protobuf/empty.proto";

// ═══════════════════════════════════════════════════════════════════════════
// Common Enums
// ═══════════════════════════════════════════════════════════════════════════

// Status of a vLLM/inference endpoint process
enum ProcessStatus {
  PROCESS_STATUS_UNSPECIFIED = 0;
  PROCESS_STATUS_STOPPED = 1;
  PROCESS_STATUS_STARTING = 2;
  PROCESS_STATUS_HEALTHY = 3;
  PROCESS_STATUS_UNHEALTHY = 4;
  PROCESS_STATUS_STOPPING = 5;
  PROCESS_STATUS_FAILED = 6;
  PROCESS_STATUS_PENDING = 7;  // Queued for startup, waiting for another endpoint to finish starting
}

// ═══════════════════════════════════════════════════════════════════════════
// Health FSM - Authoritative State Definitions
// All health-related code MUST use these enums, not string literals
// ═══════════════════════════════════════════════════════════════════════════

// Check result status (point-in-time health observation)
enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_PASS = 1;        // Check passed, no issue
  CHECK_STATUS_WARN = 2;        // Warning level, non-blocking
  CHECK_STATUS_FAIL = 3;        // Failure, triggers incident
  CHECK_STATUS_SKIP = 4;        // Skipped (e.g., upstream dependency failed)
}

// Incident lifecycle status (FSM states)
enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_ACTIVE = 1;          // Detected, awaiting remediation
  INCIDENT_STATUS_HEALING = 2;         // Remediation in progress
  INCIDENT_STATUS_RECOVERING = 3;      // Remediation succeeded, verifying stability
  INCIDENT_STATUS_RESOLVED = 4;        // Incident closed successfully
  INCIDENT_STATUS_MANUAL_REQUIRED = 5; // Escalated, requires human intervention
}

// Remediation tier (FMEA-driven escalation ladder)
enum RemediationTier {
  REMEDIATION_TIER_UNSPECIFIED = 0;
  REMEDIATION_TIER_0 = 1;  // Automatic, no approval needed
  REMEDIATION_TIER_1 = 2;  // Automatic with validation
  REMEDIATION_TIER_2 = 3;  // Requires user approval
  REMEDIATION_TIER_3 = 4;  // Manual intervention (ACP/GitHub escalation)
}

// Valid FSM transitions - codifies the state machine
// Use for OTel tracing and audit logs
enum IncidentTransition {
  INCIDENT_TRANSITION_UNSPECIFIED = 0;

  // Forward transitions
  INCIDENT_TRANSITION_ACTIVE_TO_HEALING = 1;      // Remediation started
  INCIDENT_TRANSITION_ACTIVE_TO_RECOVERING = 2;   // Spontaneous recovery
  INCIDENT_TRANSITION_HEALING_TO_RECOVERING = 3;  // Remediation succeeded
  INCIDENT_TRANSITION_HEALING_TO_MANUAL = 4;      // Escalated to tier 3
  INCIDENT_TRANSITION_RECOVERING_TO_RESOLVED = 5; // Verification passed

  // Regression (Fail Open - this is expected)
  INCIDENT_TRANSITION_RECOVERING_TO_ACTIVE = 6;   // Verification failed, health regressed
}

// Maps FMEA failure mode IDs to KB heuristic paths
// This fixes the matching gap that causes stuck incidents
message FailureModeMapping {
  string fmea_id = 1;           // e.g., "GPU_001"
  string heuristic_path = 2;    // e.g., "inference/gpu_memory_exhausted"
  string check_name_pattern = 3; // Regex for fallback matching
  string endpoint_pattern = 4;   // Regex for endpoint matching
}

// Registry loaded from KB on startup
message FailureModeRegistry {
  repeated FailureModeMapping mappings = 1;
}

// ═══════════════════════════════════════════════════════════════════════════
// Orchestrator Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message OrchestratorStatusResponse {
  int32 total_gpus = 1;
  int32 available_gpus = 2;
  repeated GPUAllocation allocations = 3;
  repeated EndpointInfo endpoints = 4;
}

message GPUAllocation {
  string agent_alias = 1;
  string model = 2;
  repeated int32 gpu_ids = 3;
  float vram_reserved_gb = 4;
}

message EndpointInfo {
  string name = 1;
  string model = 2;
  ProcessStatus status = 3;  // Endpoint process status
  repeated int32 gpu_ids = 4;
  int32 port = 5;
}

message StartEndpointRequest {
  string endpoint_name = 1;
}

message StopEndpointRequest {
  string endpoint_name = 1;
  bool force = 2;
}

message RestartEndpointRequest {
  string endpoint_name = 1;
}

message CleanStartRequest {
  repeated string endpoints = 1;  // Endpoints to start after cleanup (empty = cleanup only)
}

message CleanStartResponse {
  bool success = 1;
  string message = 2;
  int32 processes_killed = 3;
  int32 endpoints_started = 4;
}

message EndpointResponse {
  bool success = 1;
  string message = 2;
}

// Response for EnsureEndpoint - includes full status for agent-first architecture
message EnsureEndpointResponse {
  bool healthy = 1;          // True if endpoint is ready to accept requests
  string status = 2;         // "healthy", "starting", "stopping", "stopped", "error"
  int32 port = 3;            // Port if running
  repeated int32 gpu_ids = 4; // Allocated GPUs
  string message = 5;        // Error message if not healthy
}

// ═══════════════════════════════════════════════════════════════════════════
// Scheduler Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message CompleteRequest {
  string agent_alias = 1;
  string prompt = 2;
  string system_prompt = 3;
  int32 max_tokens = 4;
  float temperature = 5;
  string priority = 6;  // "critical", "high", "normal", "low"
}

message CompleteResponse {
  string text = 1;
  int32 tokens_used = 2;
  float latency_ms = 3;
  string model = 4;
  string job_id = 5;
}

message SubmitJobRequest {
  string agent_alias = 1;
  string prompt = 2;
  string system_prompt = 3;
  int32 max_tokens = 4;
  float temperature = 5;
  string priority = 6;
  bool async = 7;  // If true, returns immediately with job_id
}

message SubmitJobResponse {
  string job_id = 1;
  string status = 2;  // "queued", "running", "completed", "failed"
}

message GetJobResultRequest {
  string job_id = 1;
}

message GetJobResultResponse {
  string job_id = 1;
  string status = 2;
  string text = 3;
  int32 tokens_used = 4;
  float latency_ms = 5;
  string error = 6;
}

message SchedulerStatusResponse {
  int32 queue_depth = 1;
  int32 active_jobs = 2;
  float avg_latency_ms = 3;
  map<string, int32> jobs_by_priority = 4;
}

// XAI API budget status
message XAIBudgetResponse {
  int32 daily_used = 1;      // Requests used today
  int32 daily_limit = 2;     // Daily request limit
  int32 weekly_used = 3;     // Requests used this week
  int32 weekly_limit = 4;    // Weekly request limit
  string reset_at = 5;       // ISO timestamp when daily budget resets
}

// ═══════════════════════════════════════════════════════════════════════════
// Swarm Streaming Messages
// ═══════════════════════════════════════════════════════════════════════════

message SwarmStreamRequest {
  string domain = 1;            // Domain to analyze (e.g., "pension", "kudu")
  string context = 2;           // Additional context
  repeated string roles = 3;    // Agent roles (empty = all core roles)
  bool clt = 4;                 // Use CLT-enhanced swarm with interpretable features
}

// Streaming events for swarm execution progress
message SwarmEvent {
  enum Type {
    QUEUED = 0;              // Request queued, waiting for backends
    WAITING_FOR_BACKENDS = 1; // Actively waiting for endpoints to be ready
    STARTED = 2;             // Swarm analysis started
    AGENT_STARTED = 3;       // Individual agent started
    AGENT_COMPLETED = 4;     // Individual agent completed
    AGENT_FAILED = 5;        // Individual agent failed
    SYNTHESIS = 6;           // Synthesis phase started
    COMPLETED = 7;           // All agents completed
    FAILED = 8;              // Swarm failed entirely
  }
  Type type = 1;
  int64 timestamp_ms = 2;     // Event timestamp
  string agent = 3;           // Agent name (for AGENT_* events)
  float progress = 4;         // Overall progress 0.0-1.0
  string message = 5;         // Human-readable status message
  bytes data = 6;             // JSON payload (agent result on AGENT_COMPLETED)
}

// Final swarm result (sent after all COMPLETED events)
message SwarmResult {
  map<string, bytes> results = 1;  // Role name -> JSON result data
  string saved_path = 2;           // Path where results were saved
  int32 total_agents = 3;
  int32 completed_agents = 4;
  int32 failed_agents = 5;
  int32 total_duration_ms = 6;
}

// ═══════════════════════════════════════════════════════════════════════════
// Evolution Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message EvolutionStatusResponse {
  bool running = 1;
  int32 cycles_completed = 2;
  float total_improvement_pct = 3;
  string current_agent = 4;
  string next_agent = 5;
  string mode = 6;  // "idle", "running", "paused"
  int64 last_cycle_timestamp_ms = 7;
}

message TriggerEvolutionRequest {
  string agent_id = 1;
}

message EvolutionCycleResponse {
  bool success = 1;
  float improvement_pct = 2;
  int32 duration_ms = 3;
  string agent_id = 4;
  string version_id = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// Cognition Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message CognitionStatusResponse {
  bool running = 1;
  int32 cycles_completed = 2;
  int64 last_cycle_timestamp_ms = 3;
  string current_task = 4;
}

message ThoughtMessage {
  string id = 1;
  string thought_type = 2;  // "pattern", "connection", "curiosity", "self_observation"
  string title = 3;
  string summary = 4;
  float salience = 5;
  int32 generation = 6;
  int64 timestamp_ms = 7;
  string note_path = 8;
}

message GetRecentThoughtsRequest {
  int32 limit = 1;  // Default: 10
}

message GetRecentThoughtsResponse {
  repeated ThoughtMessage thoughts = 1;
}

message TriggerCognitionRequest {
  int32 max_thoughts = 1;  // Default: 5
  string trigger_reason = 2;  // "manual", "scheduled", "session_start"
}

message TriggerCognitionResponse {
  bool success = 1;
  int32 thoughts_generated = 2;
  int32 patterns_detected = 3;
  int32 connections_found = 4;
  int32 curiosities_generated = 5;
  int32 duration_ms = 6;
  string error = 7;
  int32 self_observations = 8;
  string kb_path = 9;  // Path to zettelkasten file where thoughts were saved
  int32 tokens_out = 10;  // Output tokens used by LLM for thought generation
}

// Self-observation - meta-cognition on recent thoughts
message SelfObservationRequest {
  int32 max_observations = 1;  // Default: 5
}

message SelfObservationResponse {
  bool success = 1;
  int32 observations_generated = 2;
  int32 duration_ms = 3;
  string error = 4;
  repeated string observation_ids = 5;
}

// Engine audit - health analysis and anomaly detection
message EngineAuditRequest {
  bool include_metrics = 1;  // Include detailed metrics in response
}

message EngineAuditResponse {
  bool success = 1;
  int32 observations_recorded = 2;
  int32 anomalies_found = 3;
  int32 duration_ms = 4;
  string error = 5;
  repeated string anomaly_details = 6;
}

message CognitionActivityResponse {
  bool cognition_running = 1;
  int32 cycles_completed = 2;
  int64 last_cycle_timestamp_ms = 3;
  string current_task = 4;
  int32 thoughts_today = 5;
  int32 active_thoughts = 6;
}

// ═══════════════════════════════════════════════════════════════════════════
// Cognition Streaming Messages (TUI Real-time Updates)
// ═══════════════════════════════════════════════════════════════════════════

// Request to subscribe to cognition events
message CognitionStreamRequest {
  int32 buffer_size = 1;           // Max events to buffer (default: 100)
  repeated string event_types = 2;  // Filter by types (empty = all)
}

// Streaming cognition event - pushed to TUI/MCP clients
message CognitionEvent {
  enum Type {
    CYCLE_START = 0;       // Cognition cycle beginning
    THOUGHT = 1;           // New thought generated
    PATTERN = 2;           // Pattern detected
    CONNECTION = 3;        // Connection found
    CURIOSITY = 4;         // Curiosity generated
    SELF_OBSERVATION = 5;  // Meta-cognition thought
    ENGINE_AUDIT = 6;      // Engine audit completed
    CYCLE_END = 7;         // Cognition cycle complete
    ERROR = 8;             // Error occurred
  }
  Type type = 1;
  int64 timestamp_ms = 2;
  string thought_id = 3;           // UUID of thought (for THOUGHT events)
  string thought_type = 4;         // "pattern", "connection", etc.
  string title = 5;                // Thought title
  string summary = 6;              // Brief summary (truncated for streaming)
  float salience = 7;              // 0.0-1.0 importance score
  int32 generation = 8;            // Thought generation number
  string cycle_id = 9;             // UUID of current cycle
  int32 thoughts_in_cycle = 10;    // Thoughts generated so far in this cycle
  string error = 11;               // Error message if type=ERROR
}

// ═══════════════════════════════════════════════════════════════════════════
// Evolution Streaming Messages (TUI Real-time Updates)
// ═══════════════════════════════════════════════════════════════════════════

// Request to subscribe to evolution events
message EvolutionStreamRequest {
  string agent_filter = 1;         // Filter by agent ID (empty = all agents)
  int32 buffer_size = 2;           // Max events to buffer (default: 100)
}

// Streaming evolution event - pushed to TUI/MCP clients
message EvolutionEvent {
  enum Type {
    CYCLE_START = 0;       // Evolution cycle beginning
    EVALUATION_START = 1;  // Evaluating an agent version
    EVALUATION_DONE = 2;   // Evaluation complete with score
    PROMOTION = 3;         // Version promoted to active
    ROLLBACK = 4;          // Rolled back to previous version
    MERGE_START = 5;       // Model merge beginning
    MERGE_DONE = 6;        // Model merge complete
    TASK_IDEATION = 7;     // New task concepts generated
    CALIBRATION = 8;       // Calibration cycle completed
    CYCLE_END = 9;         // Evolution cycle complete
    ERROR = 10;            // Error occurred
  }
  Type type = 1;
  int64 timestamp_ms = 2;
  string agent_id = 3;             // Agent being evolved
  string version_id = 4;           // Version being evaluated/promoted
  float score = 5;                 // Evaluation score (0.0-1.0)
  float improvement_pct = 6;       // Improvement percentage
  string details = 7;              // Human-readable details
  int32 cycle_number = 8;          // Cycle number in current session
  string merge_id = 9;             // Merge ID for MERGE_* events
  string error = 10;               // Error message if type=ERROR
}

// ═══════════════════════════════════════════════════════════════════════════
// Activity Streaming Messages (Unified Feed)
// ═══════════════════════════════════════════════════════════════════════════

// Request to subscribe to all activity (cognition + evolution + system)
message ActivityStreamRequest {
  int32 buffer_size = 1;           // Max events to buffer (default: 100)
  repeated string domains = 2;     // Filter by domain (empty = all)
}

// Unified activity event
message ActivityEvent {
  string event_type = 1;           // "cognition", "evolution", "system", "kb"
  int64 timestamp_ms = 2;
  string source = 3;               // Service that generated event
  string domain = 4;               // Domain context
  string title = 5;                // Brief title
  string summary = 6;              // Human-readable summary
  bytes data = 7;                  // JSON payload with full details
}

// ═══════════════════════════════════════════════════════════════════════════
// Workload Management Messages (Yunikorn-Style)
// ═══════════════════════════════════════════════════════════════════════════

enum WorkloadType {
  WORKLOAD_INIT = 0;
  WORKLOAD_SWARM = 1;
  WORKLOAD_INFERENCE = 2;
  WORKLOAD_EMBEDDING = 3;
  WORKLOAD_EVOLUTION = 4;
}

message BeginWorkloadRequest {
  string workload_id = 1;                    // Unique ID (e.g., "init-2024-12-11-001")
  WorkloadType workload_type = 2;            // Type of workload
  repeated string required_capabilities = 3;  // TaskType names (e.g., "text_embedding")
  string priority = 4;                        // "critical", "high", "normal", "low"
  int32 estimated_duration_s = 5;            // Hint for makespan planning
  int32 estimated_memory_mb = 6;             // GPU memory needed (0 for CPU-only)
  bool preemptible = 7;                      // Can this workload be preempted?
}

message EndpointAllocationInfo {
  string endpoint_name = 1;
  string capability = 2;                      // TaskType value
  int32 port = 3;
  bool healthy = 4;
  string model_id = 5;
}

message BeginWorkloadResponse {
  bool success = 1;
  string workload_id = 2;
  repeated EndpointAllocationInfo allocated_endpoints = 3;
  repeated string evicted_endpoints = 4;     // Endpoints stopped to make room
  repeated string restore_plan = 5;          // Endpoints to restart after completion
  string error = 6;
  int32 wait_time_ms = 7;
}

message CompleteWorkloadRequest {
  string workload_id = 1;
}

message ActiveWorkloadInfo {
  string workload_id = 1;
  string workload_type = 2;
  string priority = 3;
  repeated string capabilities = 4;
  float elapsed_s = 5;
  int32 estimated_duration_s = 6;
  bool is_overdue = 7;
  repeated string endpoints = 8;
}

message GetActiveWorkloadsResponse {
  repeated ActiveWorkloadInfo workloads = 1;
}

// ═══════════════════════════════════════════════════════════════════════════
// Embedding Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message EmbedTextsRequest {
  repeated string texts = 1;                  // Texts to embed
  string model = 2;                           // Optional model ID, uses default if empty
  string workload_id = 3;                     // Optional workload context
}

message EmbeddingVector {
  repeated float values = 1;
}

message EmbedTextsResponse {
  repeated EmbeddingVector embeddings = 1;
  string model_used = 2;
  int32 latency_ms = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// Semantic Search Messages
// ═══════════════════════════════════════════════════════════════════════════

message SemanticSearchRequest {
  string query = 1;                    // Search query text
  string collection = 2;               // Collection name (default: "kb")
  int32 limit = 3;                     // Max results (default: 10)
  float min_score = 4;                 // Minimum score threshold
  bool use_maxsim = 5;                 // Use MaxSim scoring (default: true)
  string content_type = 6;             // Filter: "text", "image", or "" for all
}

message SearchResult {
  string path = 1;                     // KB path
  string title = 2;                    // Document title
  float score = 3;                     // MaxSim similarity score
  string snippet = 4;                  // Content preview (truncated)
  string chunk_id = 5;                 // Chunk identifier for citation
  string content_type = 6;             // "text" or "image"
}

message SemanticSearchResponse {
  repeated SearchResult results = 1;
  int32 total = 2;
  string collection = 3;
  string embedding_model = 4;          // "colnomic"
  int32 latency_ms = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// Health Streaming Messages
// ═══════════════════════════════════════════════════════════════════════════

message HealthStreamRequest {
  int32 interval_ms = 1;  // How often to send updates (default: 1000)
}

message HealthMetrics {
  int64 timestamp_ms = 1;
  repeated GPUMetrics gpus = 2;
  repeated EndpointHealth endpoints = 3;
  int32 queue_depth = 4;
  bool evolution_running = 5;
  float system_memory_used_gb = 6;
  float system_memory_total_gb = 7;
}

message GPUMetrics {
  int32 gpu_id = 1;
  float utilization = 2;  // 0.0 to 1.0
  float memory_used_gb = 3;
  float memory_total_gb = 4;
  int32 temperature_c = 5;
  int32 power_watts = 6;
}

message EndpointHealth {
  string name = 1;
  string model = 2;
  bool healthy = 3;
  int64 requests_served = 4;
  float avg_latency_ms = 5;
  int64 last_request_timestamp_ms = 6;
}

// ═══════════════════════════════════════════════════════════════════════════
// Event Streaming Messages
// ═══════════════════════════════════════════════════════════════════════════

message EventStreamRequest {
  repeated string event_types = 1;  // Filter by types, empty = all
}

message Event {
  string event_type = 1;
  int64 timestamp_ms = 2;
  string service = 3;  // "orchestrator", "scheduler", "evolution", etc.
  bytes data = 4;  // JSON-serialized event data
}

// Event types:
// - ENDPOINT_STARTED, ENDPOINT_STOPPED, ENDPOINT_ERROR
// - JOB_QUEUED, JOB_STARTED, JOB_COMPLETED, JOB_FAILED
// - EVOLUTION_STARTED, EVOLUTION_PROGRESS, EVOLUTION_COMPLETED
// - GPU_THRESHOLD_WARNING, GPU_THRESHOLD_CRITICAL

// ═══════════════════════════════════════════════════════════════════════════
// Initialization Streaming Messages (Bidirectional)
// ═══════════════════════════════════════════════════════════════════════════

// Commands sent from TUI/MCP client to engine during initialization
message InitCommand {
  enum Type {
    SUBSCRIBE = 0;   // Start receiving events
    HEALTH = 1;      // Immediate: basic health check (no endpoints needed)
    STATUS = 2;      // Immediate: current initialization state
    CANCEL = 3;      // Immediate: cancel current endpoint preload
    SKIP = 4;        // Immediate: skip to next endpoint
    PAUSE = 5;       // Immediate: pause preloading
    RESUME = 6;      // Immediate: resume preloading
  }
  Type type = 1;
  string client_id = 2;     // Client identifier for tracking
  string endpoint = 3;      // Target endpoint for CANCEL/SKIP
  bytes payload = 4;        // JSON for complex command data
}

// Events sent from engine to TUI/MCP client during initialization
message InitEvent {
  enum Type {
    PHASE_STARTED = 0;      // New initialization phase began
    PROGRESS = 1;           // Progress update (overall or per-endpoint)
    ENDPOINT_STARTING = 2;  // Endpoint is starting to load
    ENDPOINT_READY = 3;     // Endpoint finished loading successfully
    ENDPOINT_FAILED = 4;    // Endpoint failed to load
    CANCELLED = 5;          // Endpoint preload was cancelled
    PAUSED = 6;             // Preloading paused by user
    RESUMED = 7;            // Preloading resumed
    READY = 8;              // All endpoints ready, init complete
    HEALTH_OK = 9;          // Response to HEALTH command
    QUEUED = 10;            // Command queued (needs endpoint to execute)
    ERROR = 11;             // Error occurred
    // X Bookmarks events (pushed to TUI for real-time auth status updates)
    XB_AUTH_COMPLETED = 12; // X Bookmarks OAuth completed successfully
    XB_AUTH_FAILED = 13;    // X Bookmarks OAuth failed
    XB_STATUS_CHANGED = 14; // X Bookmarks sync/queue status changed
  }
  Type type = 1;
  int64 timestamp_ms = 2;   // Event timestamp
  string phase = 3;         // Current phase name (e.g., "backends", "orchestrator", "preload")
  float progress = 4;       // Progress 0.0-1.0
  string endpoint = 5;      // Related endpoint name
  string message = 6;       // Human-readable message
  bytes data = 7;           // JSON for complex payloads (health data, XB auth info, etc.)
}

// ═══════════════════════════════════════════════════════════════════════════
// State Service Messages (Thin Client Architecture)
// ═══════════════════════════════════════════════════════════════════════════

// Request for current grid state
message GetStateRequest {
  string kb_root = 1;
  string client_id = 2;
  int64 since_generation = 3;  // 0 = full state, >0 = check if newer exists
  bool include_geometry = 4;   // Include curvature/gradient (larger payload)
}

// Complete grid state for TUI rendering
message GridState {
  string snapshot_id = 1;
  int64 generation = 2;        // Monotonic counter for sync
  int64 updated_at_ms = 3;

  // Grid positions (19x19)
  repeated GridPosition documents = 4;
  repeated GridPosition clusters = 5;
  repeated int32 allocations = 6;  // 361 values (19x19 flattened)

  // TDA features
  TDAFeatures tda = 7;

  // Geometry features (optional, only if include_geometry=true)
  GeometryFeatures geometry = 8;

  // Metadata
  int32 n_documents = 9;
  float coverage = 10;
  string projection_method = 11;
  string embedding_model = 12;
}

// TDA features for overlay rendering
message TDAFeatures {
  repeated BoundingBox h1_cycles = 1;
  repeated BoundingBox h2_voids = 2;
  repeated int32 risk_scores = 3;  // Per-cell risk (361 values)
  float entropy = 4;
  int32 h0_count = 5;
  int32 h1_count = 6;
  int32 h2_count = 7;
}

// Bounding box for TDA features
message BoundingBox {
  int32 x_min = 1;
  int32 y_min = 2;
  int32 x_max = 3;
  int32 y_max = 4;
  float persistence = 5;
}

// Geometry features for Iso view
message GeometryFeatures {
  repeated float curvature_map = 1;    // 361 values (19x19)
  repeated GradientVector gradient_field = 2;
  repeated float divergence_map = 3;   // 361 values (19x19)
}

// Gradient vector for geometry overlay
message GradientVector {
  int32 x = 1;
  int32 y = 2;
  float gx = 3;
  float gy = 4;
}

// Subscribe to state updates
message SubscribeStateRequest {
  string kb_root = 1;
  string client_id = 2;
}

// State update event (generation-based)
message StateUpdate {
  enum Type {
    FULL_REFRESH = 0;           // Complete state (on connect or major change)
    GENERATION_CHANGED = 1;     // Generation incremented, fetch new state
    COMPUTATION_STARTED = 2;    // Heavy compute started (show progress)
    COMPUTATION_PROGRESS = 3;   // Progress update
    COMPUTATION_COMPLETE = 4;   // Compute done, state updated
    ERROR = 5;                  // Error occurred
  }
  Type type = 1;
  int64 generation = 2;
  int64 timestamp_ms = 3;
  GridState state = 4;          // Set for FULL_REFRESH
  float progress = 5;           // 0.0-1.0 for COMPUTATION_PROGRESS
  string message = 6;           // Human-readable message
  string phase = 7;             // Current phase name
}

// UI preferences request
message GetPreferencesRequest {
  string client_id = 1;
}

// UI preferences
message UIPreferences {
  string client_id = 1;
  int32 cursor_x = 2;
  int32 cursor_y = 3;
  string view_mode = 4;
  string overlay_mode = 5;
  string iso_mode = 6;
  string center_panel_mode = 7;
  bool left_panel_visible = 8;
  bool right_panel_visible = 9;
  string domain = 10;
  bytes preferences_json = 11;  // Extensible JSON
}

// Save preferences request
message SavePreferencesRequest {
  UIPreferences preferences = 1;
}

// Prune request for snapshot cleanup
message PruneSnapshotsRequest {
  string kb_root = 1;
  int32 keep_count = 2;         // Keep N most recent (0 = use older_than_days)
  int32 older_than_days = 3;    // Delete older than N days (0 = use keep_count)
  bool dry_run = 4;             // If true, just return count without deleting
}

message PruneSnapshotsResponse {
  int32 deleted_count = 1;
  int32 remaining_count = 2;
  bool dry_run = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// Command Service Messages (Unified Entry Point)
// ═══════════════════════════════════════════════════════════════════════════

// Generic command request - routes to appropriate handler
message ExecuteCommandRequest {
  string command = 1;           // Command name (e.g., "reindex", "goto", "domain")
  string args = 2;              // Command arguments as string
  string kb_root = 3;           // KB root for context
  string client_id = 4;         // Client identifier (tui, cli, mcp)
  map<string, string> context = 5;  // Additional context (cursor_x, cursor_y, etc.)
}

// Generic command response
message ExecuteCommandResponse {
  bool success = 1;
  string command = 2;
  string message = 3;           // Human-readable result message
  bytes result_json = 4;        // JSON-encoded result data
  int64 generation = 5;         // State generation after command (0 if unchanged)
  int32 duration_ms = 6;        // Execution duration
}

// Init request - full initialization pipeline (index + project + TDA + cache)
message InitRequest {
  string kb_root = 1;
  string client_id = 2;
  bool force = 3;               // Force reinit even if cache exists
  string embedding_model = 4;   // Override default model (empty = use config)
  string projection_method = 5; // "umap" or "pca" (empty = umap)
}

// Init response
message InitResponse {
  bool success = 1;
  string message = 2;
  int32 documents_indexed = 3;
  int32 h0_count = 4;           // Connected components
  int32 h1_count = 5;           // Loops/cycles
  int32 h2_count = 6;           // Voids/cavities
  float entropy = 7;            // TDA entropy
  int64 generation = 8;         // New state generation
  int32 duration_ms = 9;
}

// Streaming init progress
message InitProgress {
  enum Phase {
    STARTED = 0;
    SCANNING = 1;        // Scanning KB for documents
    EMBEDDING = 2;       // Computing embeddings (ColBERT)
    PROJECTING = 3;      // UMAP/PCA projection to grid
    TDA = 4;             // Computing TDA features (H0/H1/H2)
    GEOMETRY = 5;        // Computing geometry features (optional)
    SAVING = 6;          // Saving to Postgres cache
    COMPLETE = 7;
    ERROR = 8;
  }
  Phase phase = 1;
  float progress = 2;           // 0.0 to 1.0
  string message = 3;
  int32 documents_processed = 4;
  int32 documents_total = 5;
}

// Reindex request - triggers full KB reindexing
message ReindexRequest {
  string kb_root = 1;
  string client_id = 2;
  bool force = 3;               // Force reindex even if up-to-date
  string embedding_model = 4;   // Override default model (empty = use config)
}

// Reindex response with progress info
message ReindexResponse {
  bool success = 1;
  string message = 2;
  int32 documents_indexed = 3;
  int32 documents_skipped = 4;
  int64 generation = 5;         // New state generation
  int32 duration_ms = 6;
}

// Streaming reindex progress
message ReindexProgress {
  enum Phase {
    STARTED = 0;
    SCANNING = 1;
    EMBEDDING = 2;
    PROJECTING = 3;
    TDA = 4;
    SAVING = 5;
    COMPLETE = 6;
    ERROR = 7;
  }
  Phase phase = 1;
  float progress = 2;           // 0.0 to 1.0
  string message = 3;
  int32 documents_processed = 4;
  int32 documents_total = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// Explain Service Messages (Grid Position Interpretation)
// ═══════════════════════════════════════════════════════════════════════════

// Request to explain a grid position with differential geometry context
message ExplainRequest {
  string kb_root = 1;
  int32 x = 2;                    // Grid x coordinate (0-18)
  int32 y = 3;                    // Grid y coordinate (0-18)
  bool save_to_kb = 4;            // Save explanation as zettelkasten entry
  string client_id = 5;           // Client making request
  int32 max_tokens = 6;           // Max tokens for explanation (default: 800)
}

// Explanation response with geometry and LLM interpretation
message ExplainResponse {
  bool success = 1;
  string position = 2;            // Go notation (e.g., "K10")
  int32 x = 3;
  int32 y = 4;

  // Document at position (if any)
  string document_title = 5;
  string document_path = 6;

  // Geometry features at position
  float curvature = 7;            // Ricci curvature
  float gradient_x = 8;           // Gradient x component
  float gradient_y = 9;           // Gradient y component
  float divergence = 10;          // Divergence at position

  // TDA context
  float tda_entropy = 11;
  int32 h0_count = 12;            // Connected components
  int32 h1_count = 13;            // Loops/cycles
  int32 h2_count = 14;            // Voids/cavities
  float risk_score = 15;          // Topological risk at position

  // Grid context
  float grid_coverage = 16;       // Fraction of grid with documents
  int32 total_documents = 17;
  repeated string nearby_documents = 18;  // Titles of nearby docs (max 5)

  // Mini-grid data (9x9 each, flattened)
  repeated float embed_grid = 19; // 81 values: cosine similarity around position
  repeated float iso_grid = 20;   // 81 values: curvature-based elevation

  // LLM explanation
  string explanation = 21;        // Generated interpretation
  string model = 22;              // Model used for generation
  int32 duration_ms = 23;

  // KB path if saved
  string saved_path = 24;
  string error = 25;
}

// ═══════════════════════════════════════════════════════════════════════════
// Grid Service Messages (Embedding Projection)
// ═══════════════════════════════════════════════════════════════════════════

message ProjectEmbeddingsRequest {
  repeated string embedding_ids = 1;
  string method = 2;  // "umap", "tsne", "pca"
  int32 grid_size = 3;  // Default: 19
}

message GridPosition {
  string id = 1;
  int32 x = 2;  // 0 to grid_size-1
  int32 y = 3;  // 0 to grid_size-1
  int32 cluster = 4;
  float confidence = 5;  // 0.0 to 1.0
}

message ProjectEmbeddingsResponse {
  repeated GridPosition positions = 1;
  int32 num_clusters = 2;
  int32 grid_size = 3;
}

message ProjectQueryRequest {
  repeated float embedding = 1;  // Query embedding vector
  string method = 2;  // "umap", "tsne", "pca"
}

message ProjectQueryResponse {
  int32 x = 1;
  int32 y = 2;
  repeated string nearest_ids = 3;  // IDs of nearest neighbors
  repeated float distances = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// TDA Service Messages (Topological Data Analysis)
// ═══════════════════════════════════════════════════════════════════════════

message ComputeTDARequest {
  repeated string embedding_ids = 1;
  string method = 2;  // "persistent_homology", "mapper"
