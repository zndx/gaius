// Custom Gaius service extensions for gaius-engine.
// Complements the KServe Open Inference Protocol with Gaius-specific operations.

syntax = "proto3";
package gaius.engine;

import "google/protobuf/empty.proto";

// ═══════════════════════════════════════════════════════════════════════════
// Orchestrator Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message OrchestratorStatusResponse {
  int32 total_gpus = 1;
  int32 available_gpus = 2;
  repeated GPUAllocation allocations = 3;
  repeated EndpointInfo endpoints = 4;
}

message GPUAllocation {
  string agent_alias = 1;
  string model = 2;
  repeated int32 gpu_ids = 3;
  float vram_reserved_gb = 4;
}

message EndpointInfo {
  string name = 1;
  string model = 2;
  string status = 3;  // "running", "stopped", "starting", "error"
  repeated int32 gpu_ids = 4;
  int32 port = 5;
}

message StartEndpointRequest {
  string endpoint_name = 1;
}

message StopEndpointRequest {
  string endpoint_name = 1;
  bool force = 2;
}

message RestartEndpointRequest {
  string endpoint_name = 1;
}

message CleanStartRequest {
  repeated string endpoints = 1;  // Endpoints to start after cleanup (empty = cleanup only)
}

message CleanStartResponse {
  bool success = 1;
  string message = 2;
  int32 processes_killed = 3;
  int32 endpoints_started = 4;
}

message EndpointResponse {
  bool success = 1;
  string message = 2;
}

// Response for EnsureEndpoint - includes full status for agent-first architecture
message EnsureEndpointResponse {
  bool healthy = 1;          // True if endpoint is ready to accept requests
  string status = 2;         // "healthy", "starting", "stopping", "stopped", "error"
  int32 port = 3;            // Port if running
  repeated int32 gpu_ids = 4; // Allocated GPUs
  string message = 5;        // Error message if not healthy
}

// ═══════════════════════════════════════════════════════════════════════════
// Scheduler Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message CompleteRequest {
  string agent_alias = 1;
  string prompt = 2;
  string system_prompt = 3;
  int32 max_tokens = 4;
  float temperature = 5;
  string priority = 6;  // "critical", "high", "normal", "low"
}

message CompleteResponse {
  string text = 1;
  int32 tokens_used = 2;
  float latency_ms = 3;
  string model = 4;
  string job_id = 5;
}

message SubmitJobRequest {
  string agent_alias = 1;
  string prompt = 2;
  string system_prompt = 3;
  int32 max_tokens = 4;
  float temperature = 5;
  string priority = 6;
  bool async = 7;  // If true, returns immediately with job_id
}

message SubmitJobResponse {
  string job_id = 1;
  string status = 2;  // "queued", "running", "completed", "failed"
}

message GetJobResultRequest {
  string job_id = 1;
}

message GetJobResultResponse {
  string job_id = 1;
  string status = 2;
  string text = 3;
  int32 tokens_used = 4;
  float latency_ms = 5;
  string error = 6;
}

message SchedulerStatusResponse {
  int32 queue_depth = 1;
  int32 active_jobs = 2;
  float avg_latency_ms = 3;
  map<string, int32> jobs_by_priority = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// Swarm Streaming Messages
// ═══════════════════════════════════════════════════════════════════════════

message SwarmStreamRequest {
  string domain = 1;            // Domain to analyze (e.g., "pension", "kudu")
  string context = 2;           // Additional context
  repeated string roles = 3;    // Agent roles (empty = all core roles)
}

// Streaming events for swarm execution progress
message SwarmEvent {
  enum Type {
    QUEUED = 0;              // Request queued, waiting for backends
    WAITING_FOR_BACKENDS = 1; // Actively waiting for endpoints to be ready
    STARTED = 2;             // Swarm analysis started
    AGENT_STARTED = 3;       // Individual agent started
    AGENT_COMPLETED = 4;     // Individual agent completed
    AGENT_FAILED = 5;        // Individual agent failed
    SYNTHESIS = 6;           // Synthesis phase started
    COMPLETED = 7;           // All agents completed
    FAILED = 8;              // Swarm failed entirely
  }
  Type type = 1;
  int64 timestamp_ms = 2;     // Event timestamp
  string agent = 3;           // Agent name (for AGENT_* events)
  float progress = 4;         // Overall progress 0.0-1.0
  string message = 5;         // Human-readable status message
  bytes data = 6;             // JSON payload (agent result on AGENT_COMPLETED)
}

// Final swarm result (sent after all COMPLETED events)
message SwarmResult {
  map<string, bytes> results = 1;  // Role name -> JSON result data
  string saved_path = 2;           // Path where results were saved
  int32 total_agents = 3;
  int32 completed_agents = 4;
  int32 failed_agents = 5;
  int32 total_duration_ms = 6;
}

// ═══════════════════════════════════════════════════════════════════════════
// Evolution Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message EvolutionStatusResponse {
  bool running = 1;
  int32 cycles_completed = 2;
  float total_improvement_pct = 3;
  string current_agent = 4;
  string next_agent = 5;
  string mode = 6;  // "idle", "running", "paused"
  int64 last_cycle_timestamp_ms = 7;
}

message TriggerEvolutionRequest {
  string agent_id = 1;
}

message EvolutionCycleResponse {
  bool success = 1;
  float improvement_pct = 2;
  int32 duration_ms = 3;
  string agent_id = 4;
  string version_id = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// Cognition Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message CognitionStatusResponse {
  bool running = 1;
  int32 cycles_completed = 2;
  int64 last_cycle_timestamp_ms = 3;
  string current_task = 4;
}

message ThoughtMessage {
  string id = 1;
  string thought_type = 2;  // "pattern", "connection", "curiosity", "self_observation"
  string title = 3;
  string summary = 4;
  float salience = 5;
  int32 generation = 6;
  int64 timestamp_ms = 7;
  string note_path = 8;
}

message GetRecentThoughtsRequest {
  int32 limit = 1;  // Default: 10
}

message GetRecentThoughtsResponse {
  repeated ThoughtMessage thoughts = 1;
}

message TriggerCognitionRequest {
  int32 max_thoughts = 1;  // Default: 5
  string trigger_reason = 2;  // "manual", "scheduled", "session_start"
}

message TriggerCognitionResponse {
  bool success = 1;
  int32 thoughts_generated = 2;
  int32 patterns_detected = 3;
  int32 connections_found = 4;
  int32 curiosities_generated = 5;
  int32 duration_ms = 6;
  string error = 7;
}

message CognitionActivityResponse {
  bool cognition_running = 1;
  int32 cycles_completed = 2;
  int64 last_cycle_timestamp_ms = 3;
  string current_task = 4;
  int32 thoughts_today = 5;
  int32 active_thoughts = 6;
}

// ═══════════════════════════════════════════════════════════════════════════
// Workload Management Messages (Yunikorn-Style)
// ═══════════════════════════════════════════════════════════════════════════

enum WorkloadType {
  WORKLOAD_INIT = 0;
  WORKLOAD_SWARM = 1;
  WORKLOAD_INFERENCE = 2;
  WORKLOAD_EMBEDDING = 3;
  WORKLOAD_EVOLUTION = 4;
}

message BeginWorkloadRequest {
  string workload_id = 1;                    // Unique ID (e.g., "init-2024-12-11-001")
  WorkloadType workload_type = 2;            // Type of workload
  repeated string required_capabilities = 3;  // TaskType names (e.g., "text_embedding")
  string priority = 4;                        // "critical", "high", "normal", "low"
  int32 estimated_duration_s = 5;            // Hint for makespan planning
  int32 estimated_memory_mb = 6;             // GPU memory needed (0 for CPU-only)
  bool preemptible = 7;                      // Can this workload be preempted?
}

message EndpointAllocationInfo {
  string endpoint_name = 1;
  string capability = 2;                      // TaskType value
  int32 port = 3;
  bool healthy = 4;
  string model_id = 5;
}

message BeginWorkloadResponse {
  bool success = 1;
  string workload_id = 2;
  repeated EndpointAllocationInfo allocated_endpoints = 3;
  repeated string evicted_endpoints = 4;     // Endpoints stopped to make room
  repeated string restore_plan = 5;          // Endpoints to restart after completion
  string error = 6;
  int32 wait_time_ms = 7;
}

message CompleteWorkloadRequest {
  string workload_id = 1;
}

message ActiveWorkloadInfo {
  string workload_id = 1;
  string workload_type = 2;
  string priority = 3;
  repeated string capabilities = 4;
  float elapsed_s = 5;
  int32 estimated_duration_s = 6;
  bool is_overdue = 7;
  repeated string endpoints = 8;
}

message GetActiveWorkloadsResponse {
  repeated ActiveWorkloadInfo workloads = 1;
}

// ═══════════════════════════════════════════════════════════════════════════
// Embedding Service Messages
// ═══════════════════════════════════════════════════════════════════════════

message EmbedTextsRequest {
  repeated string texts = 1;                  // Texts to embed
  string model = 2;                           // Optional model ID, uses default if empty
  string workload_id = 3;                     // Optional workload context
}

message EmbeddingVector {
  repeated float values = 1;
}

message EmbedTextsResponse {
  repeated EmbeddingVector embeddings = 1;
  string model_used = 2;
  int32 latency_ms = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// Health Streaming Messages
// ═══════════════════════════════════════════════════════════════════════════

message HealthStreamRequest {
  int32 interval_ms = 1;  // How often to send updates (default: 1000)
}

message HealthMetrics {
  int64 timestamp_ms = 1;
  repeated GPUMetrics gpus = 2;
  repeated EndpointHealth endpoints = 3;
  int32 queue_depth = 4;
  bool evolution_running = 5;
  float system_memory_used_gb = 6;
  float system_memory_total_gb = 7;
}

message GPUMetrics {
  int32 gpu_id = 1;
  float utilization = 2;  // 0.0 to 1.0
  float memory_used_gb = 3;
  float memory_total_gb = 4;
  int32 temperature_c = 5;
  int32 power_watts = 6;
}

message EndpointHealth {
  string name = 1;
  string model = 2;
  bool healthy = 3;
  int64 requests_served = 4;
  float avg_latency_ms = 5;
  int64 last_request_timestamp_ms = 6;
}

// ═══════════════════════════════════════════════════════════════════════════
// Event Streaming Messages
// ═══════════════════════════════════════════════════════════════════════════

message EventStreamRequest {
  repeated string event_types = 1;  // Filter by types, empty = all
}

message Event {
  string event_type = 1;
  int64 timestamp_ms = 2;
  string service = 3;  // "orchestrator", "scheduler", "evolution", etc.
  bytes data = 4;  // JSON-serialized event data
}

// Event types:
// - ENDPOINT_STARTED, ENDPOINT_STOPPED, ENDPOINT_ERROR
// - JOB_QUEUED, JOB_STARTED, JOB_COMPLETED, JOB_FAILED
// - EVOLUTION_STARTED, EVOLUTION_PROGRESS, EVOLUTION_COMPLETED
// - GPU_THRESHOLD_WARNING, GPU_THRESHOLD_CRITICAL

// ═══════════════════════════════════════════════════════════════════════════
// Initialization Streaming Messages (Bidirectional)
// ═══════════════════════════════════════════════════════════════════════════

// Commands sent from TUI/MCP client to engine during initialization
message InitCommand {
  enum Type {
    SUBSCRIBE = 0;   // Start receiving events
    HEALTH = 1;      // Immediate: basic health check (no endpoints needed)
    STATUS = 2;      // Immediate: current initialization state
    CANCEL = 3;      // Immediate: cancel current endpoint preload
    SKIP = 4;        // Immediate: skip to next endpoint
    PAUSE = 5;       // Immediate: pause preloading
    RESUME = 6;      // Immediate: resume preloading
  }
  Type type = 1;
  string client_id = 2;     // Client identifier for tracking
  string endpoint = 3;      // Target endpoint for CANCEL/SKIP
  bytes payload = 4;        // JSON for complex command data
}

// Events sent from engine to TUI/MCP client during initialization
message InitEvent {
  enum Type {
    PHASE_STARTED = 0;      // New initialization phase began
    PROGRESS = 1;           // Progress update (overall or per-endpoint)
    ENDPOINT_STARTING = 2;  // Endpoint is starting to load
    ENDPOINT_READY = 3;     // Endpoint finished loading successfully
    ENDPOINT_FAILED = 4;    // Endpoint failed to load
    CANCELLED = 5;          // Endpoint preload was cancelled
    PAUSED = 6;             // Preloading paused by user
    RESUMED = 7;            // Preloading resumed
    READY = 8;              // All endpoints ready, init complete
    HEALTH_OK = 9;          // Response to HEALTH command
    QUEUED = 10;            // Command queued (needs endpoint to execute)
    ERROR = 11;             // Error occurred
  }
  Type type = 1;
  int64 timestamp_ms = 2;   // Event timestamp
  string phase = 3;         // Current phase name (e.g., "backends", "orchestrator", "preload")
  float progress = 4;       // Progress 0.0-1.0
  string endpoint = 5;      // Related endpoint name
  string message = 6;       // Human-readable message
  bytes data = 7;           // JSON for complex payloads (health data, etc.)
}

// ═══════════════════════════════════════════════════════════════════════════
// Grid Service Messages (Embedding Projection)
// ═══════════════════════════════════════════════════════════════════════════

message ProjectEmbeddingsRequest {
  repeated string embedding_ids = 1;
  string method = 2;  // "umap", "tsne", "pca"
  int32 grid_size = 3;  // Default: 19
}

message GridPosition {
  string id = 1;
  int32 x = 2;  // 0 to grid_size-1
  int32 y = 3;  // 0 to grid_size-1
  int32 cluster = 4;
  float confidence = 5;  // 0.0 to 1.0
}

message ProjectEmbeddingsResponse {
  repeated GridPosition positions = 1;
  int32 num_clusters = 2;
  int32 grid_size = 3;
}

message ProjectQueryRequest {
  repeated float embedding = 1;  // Query embedding vector
  string method = 2;  // "umap", "tsne", "pca"
}

message ProjectQueryResponse {
  int32 x = 1;
  int32 y = 2;
  repeated string nearest_ids = 3;  // IDs of nearest neighbors
  repeated float distances = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// TDA Service Messages (Topological Data Analysis)
// ═══════════════════════════════════════════════════════════════════════════

message ComputeTDARequest {
  repeated string embedding_ids = 1;
  string method = 2;  // "persistent_homology", "mapper"
  int32 max_dimension = 3;  // Default: 2
}

message PersistenceInterval {
  int32 dimension = 1;
  float birth = 2;
  float death = 3;
}

message TDAResponse {
  repeated PersistenceInterval intervals = 1;
  repeated int32 betti_numbers = 2;  // b0, b1, b2, ...
  bytes persistence_diagram = 3;  // Optional: serialized diagram
}

// ═══════════════════════════════════════════════════════════════════════════
// Service Definition
// ═══════════════════════════════════════════════════════════════════════════

service GaiusService {
  // ─────────────────────────────────────────────────────────────────────────
  // Orchestrator
  // ─────────────────────────────────────────────────────────────────────────
  rpc OrchestratorStatus(google.protobuf.Empty) returns (OrchestratorStatusResponse);
  rpc EnsureEndpoint(StartEndpointRequest) returns (EnsureEndpointResponse);  // Agent-first: ensure ready
  rpc StartEndpoint(StartEndpointRequest) returns (EndpointResponse);
  rpc StopEndpoint(StopEndpointRequest) returns (EndpointResponse);
  rpc RestartEndpoint(RestartEndpointRequest) returns (EndpointResponse);
  rpc CleanStart(CleanStartRequest) returns (CleanStartResponse);  // Kill stale processes and optionally start endpoints

  // ─────────────────────────────────────────────────────────────────────────
  // Scheduler
  // ─────────────────────────────────────────────────────────────────────────
  rpc SchedulerStatus(google.protobuf.Empty) returns (SchedulerStatusResponse);
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJobResult(GetJobResultRequest) returns (GetJobResultResponse);

  // Streaming swarm analysis - returns progress events then final result
  // Handles backend wait internally, streaming QUEUED status while waiting
  rpc SwarmStream(SwarmStreamRequest) returns (stream SwarmEvent);

  // ─────────────────────────────────────────────────────────────────────────
  // Workload Management (Yunikorn-Style)
  // ─────────────────────────────────────────────────────────────────────────
  rpc BeginWorkload(BeginWorkloadRequest) returns (BeginWorkloadResponse);
  rpc CompleteWorkload(CompleteWorkloadRequest) returns (google.protobuf.Empty);
  rpc GetActiveWorkloads(google.protobuf.Empty) returns (GetActiveWorkloadsResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Embeddings (Engine-Managed)
  // ─────────────────────────────────────────────────────────────────────────
  rpc EmbedTexts(EmbedTextsRequest) returns (EmbedTextsResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Evolution
  // ─────────────────────────────────────────────────────────────────────────
  rpc EvolutionStatus(google.protobuf.Empty) returns (EvolutionStatusResponse);
  rpc TriggerEvolution(TriggerEvolutionRequest) returns (EvolutionCycleResponse);
  rpc StartEvolution(google.protobuf.Empty) returns (EvolutionStatusResponse);
  rpc StopEvolution(google.protobuf.Empty) returns (EvolutionStatusResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Cognition
  // ─────────────────────────────────────────────────────────────────────────
  rpc CognitionStatus(google.protobuf.Empty) returns (CognitionStatusResponse);
  rpc GetRecentThoughts(GetRecentThoughtsRequest) returns (GetRecentThoughtsResponse);
  rpc TriggerCognition(TriggerCognitionRequest) returns (TriggerCognitionResponse);
  rpc CognitionActivity(google.protobuf.Empty) returns (CognitionActivityResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Grid (Embedding Projection)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ProjectEmbeddings(ProjectEmbeddingsRequest) returns (ProjectEmbeddingsResponse);
  rpc ProjectQuery(ProjectQueryRequest) returns (ProjectQueryResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // TDA (Topological Data Analysis)
  // ─────────────────────────────────────────────────────────────────────────
  rpc ComputeTDA(ComputeTDARequest) returns (TDAResponse);

  // ─────────────────────────────────────────────────────────────────────────
  // Streaming
  // ─────────────────────────────────────────────────────────────────────────
  rpc HealthStream(HealthStreamRequest) returns (stream HealthMetrics);
  rpc EventStream(EventStreamRequest) returns (stream Event);

  // Bidirectional initialization stream - allows TUI/MCP to connect immediately
  // during engine startup and receive real-time progress, while also sending
  // control commands (pause, cancel, health checks) back to the engine.
  rpc InitStream(stream InitCommand) returns (stream InitEvent);
}
