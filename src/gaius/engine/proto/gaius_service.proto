// ═══════════════════════════════════════════════════════════════════════════
// CLT Service Messages (Cross-Layer Transcoders)
// ═══════════════════════════════════════════════════════════════════════════

// Request to extract sparse features from text
message CLTExtractRequest {
  string text = 1;                      // Input text to analyze
  repeated int32 layer_indices = 2;     // Which layers to extract from (empty = all)
  int32 top_k = 3;                      // Top-k features per position (default: 115)
  string model_name = 4;                // CLT model name (default: "qwen3-1.7b")
  string device = 5;                    // Target device (default: "cuda")
}

// A sparse feature activation from CLT encoder
message SparseFeature {
  int32 layer_idx = 1;                  // Transformer layer index
  int32 position = 2;                   // Token position in sequence
  int32 feature_idx = 3;                // Feature index (0-20479)
  float activation = 4;                 // Activation magnitude
  string semantic_label = 5;            // Human-readable label (if available)
}

// Response with extracted sparse features
message CLTExtractResponse {
  bool success = 1;
  repeated SparseFeature features = 2;  // Active sparse features
  int32 total_positions = 3;            // Number of token positions processed
  float sparsity = 4;                   // Actual sparsity ratio
  string model_used = 5;                // CLT model that was used
  int32 duration_ms = 6;
  string error = 7;
}

// Request to compute attribution graph for text positions
message CLTAttributeRequest {
  string text = 1;                      // Input text
  repeated int32 target_positions = 2;  // Token positions to trace (empty = last position)
  float threshold = 3;                  // Minimum weight to include edge (default: 0.01)
  string model_name = 4;                // CLT model name (default: "qwen3-1.7b")
  string device = 5;                    // Target device (default: "cuda")
}

// An edge in the CLT attribution graph
message CLTAttributionEdge {
  int32 source_layer = 1;
  int32 source_feature = 2;
  int32 target_layer = 3;
  int32 target_feature = 4;
  float weight = 5;                     // Attribution weight: a_s * ||w_{s->t}||
}

// Response with attribution graph
message CLTAttributeResponse {
  bool success = 1;
  repeated CLTAttributionEdge edges = 2;
  string dot_graph = 3;                 // GraphViz DOT representation
  int32 edge_count = 4;
  string model_used = 5;
  int32 duration_ms = 6;
  string error = 7;
}

// Request for CLT model status
message CLTStatusRequest {}

// CLT model status response
message CLTStatusResponse {
  bool available = 1;                   // Is CLT capability available?
  repeated string models = 2;           // Available model names
  string loaded_model = 3;              // Currently loaded model (empty if none)
  int32 features_per_layer = 4;         // Number of features per layer
  int32 l0_sparsity = 5;                // Expected active features per position
  float memory_used_mb = 6;             // GPU memory used by model
  repeated int32 gpu_ids = 7;           // GPUs allocated
  string error = 8;                     // Error message if not available
}

// ═══════════════════════════════════════════════════════════════════════════
// HealthObserver Messages (Autonomous FMEA Monitoring + ACP Escalation)
// ═══════════════════════════════════════════════════════════════════════════

// Health observer status request
message HealthObserverStatusRequest {}

// Health observer status response
message HealthObserverStatusResponse {
  bool running = 1;                      // Is observer daemon running?
  bool enabled = 2;                      // Is observer enabled in config?
  int32 poll_count = 3;                  // Total health checks completed
  string last_poll_at = 4;               // ISO timestamp of last poll
  int32 active_incidents = 5;            // Number of active incidents
  repeated HealthIncident incidents = 6; // Active incidents
  HealthObserverMetrics metrics = 7;     // Aggregate metrics
  HealthObserverConfig config = 8;       // Current configuration
}

// Health incident tracked by observer
message HealthIncident {
  string incident_id = 1;        // UUID
  string fingerprint = 2;        // Deduplication key (failure_mode_id:endpoint)
  string endpoint = 3;           // Affected endpoint
  string failure_mode_id = 4;    // FMEA failure mode
  int32 rpn_score = 5;           // Risk Priority Number (1-1000)
  int32 rpn_severity = 6;        // Severity component (1-10)
  int32 rpn_occurrence = 7;      // Occurrence component (1-10)
  int32 rpn_detection = 8;       // Detection component (1-10)
  int32 current_tier = 9;        // Escalation tier (0, 1, 2, or 3=manual)
  string sequence_id = 10;       // Healing event sequence UUID
  string created_at = 11;        // ISO timestamp
  string last_check_at = 12;     // ISO timestamp
  int32 attempts = 13;           // Number of remediation attempts
  int32 github_issue = 14;       // Linked GitHub issue number (0 if none)
  string status = 15;            // active, healing, recovering, resolved, manual_required
}

// Health observer metrics
message HealthObserverMetrics {
  int32 incidents_created = 1;   // Total incidents created
  int32 incidents_resolved = 2;  // Total incidents resolved
  int32 acp_escalations = 3;     // Total ACP escalations
}

// Health observer configuration
message HealthObserverConfig {
  float poll_interval = 1;       // Seconds between health checks
  bool escalate_to_acp = 2;      // Whether ACP escalation is enabled
  string github_repo = 3;        // GitHub repo for issue tracking
}

// Request to start/stop observer
message HealthObserverControlRequest {
  bool start = 1;                // True to start, false to stop
}

// Request to force an immediate health check
message ForceHealthCheckRequest {}

// Response for forced health check
message ForceHealthCheckResponse {
  bool healthy = 1;              // Overall health status
  string summary = 2;            // Health summary text
  int32 passed = 3;              // Number of passed checks
  int32 warnings = 4;            // Number of warnings
  int32 failures = 5;            // Number of failures
  int32 new_incidents = 6;       // Incidents created from this check
  repeated HealthCheckResult checks = 7;  // Individual check results
}

// Individual health check result
message HealthCheckResult {
  string name = 1;               // Check name (e.g., "gpu_0_health", "endpoint_fast")
  string status = 2;             // PASS, WARN, or FAIL
  string message = 3;            // Human-readable description
  string heuristic_id = 4;       // FMEA heuristic (e.g., "GPU_001")
  string details_json = 5;       // JSON-encoded details
}

// Request for incident details
message GetIncidentDetailRequest {
  string fingerprint = 1;        // Incident fingerprint
}

// Response with incident details
message GetIncidentDetailResponse {
  HealthIncident incident = 1;   // Incident details
  bool found = 2;                // Whether incident was found
  string healing_events_json = 3; // JSON array of healing events
  string acp_history_json = 4;   // JSON array of ACP escalation events
  string github_issue_detail_json = 5; // JSON object with GitHub issue details
}

// Request to list incidents
message ListIncidentsRequest {
  string status = 1;             // Filter by status (active, resolved, all)
}

// Response with list of incidents
message ListIncidentsResponse {
  repeated HealthIncident incidents = 1;
}

// Request to explicitly resolve an incident
message ResolveIncidentRequest {
  string fingerprint = 1;          // Incident fingerprint (e.g., "GPU_001:reasoning")
}

// Response for incident resolution
message ResolveIncidentResponse {
  bool resolved = 1;               // True if operation succeeded
  string fingerprint = 2;          // The fingerprint that was resolved
  bool was_active = 3;             // True if incident was in active tracking
  string note = 4;                 // Additional info (e.g., "already resolved")
}

// Request to get orphaned GitHub issues
message GetOrphanedIssuesRequest {}

// Response with orphaned GitHub issues
message GetOrphanedIssuesResponse {
  repeated OrphanedGitHubIssue orphans = 1;
}

// Represents an orphaned GitHub issue (open issue with no active incident)
message OrphanedGitHubIssue {
  int32 issue_number = 1;          // GitHub issue number
  string repo = 2;                 // Repository name
  string fingerprint = 3;          // Incident fingerprint
  string created_at = 4;           // ISO timestamp when issue was created
  string issue_url = 5;            // Full GitHub issue URL
}

// ═══════════════════════════════════════════════════════════════════════════
// X Bookmarks Service Messages
// ═══════════════════════════════════════════════════════════════════════════

// Request to start OAuth flow
message XBookmarksAuthRequest {}

// OAuth flow response
message XBookmarksAuthResponse {
  string auth_url = 1;           // URL to open in browser
  string state = 2;              // CSRF state parameter
  string verifier = 3;           // PKCE verifier (must be passed to complete)
}

// Complete OAuth with callback code
message XBookmarksCompleteAuthRequest {
  string code = 1;               // Authorization code from callback
  string verifier = 2;           // PKCE verifier from AuthResponse
}

// Complete OAuth using state parameter (for Engine Federation and Cloudflare Worker callbacks)
message XBookmarksCompleteAuthByStateRequest {
  string code = 1;               // Authorization code from callback
  string state = 2;              // State parameter from OAuth flow (used to look up verifier)
}

// Auth completion response
message XBookmarksCompleteAuthResponse {
  bool success = 1;
  string user_id = 2;            // X user ID
  string username = 3;           // X @handle
  repeated string scopes = 4;    // Granted scopes
  string expires_at = 5;         // ISO timestamp
  string error = 6;
  string message = 7;            // Success/error message
}

// Auth status request
message XBookmarksAuthStatusRequest {
  string user_id = 1;            // Optional: specific user
}

// Auth status response
message XBookmarksAuthStatusResponse {
  bool authenticated = 1;
  string user_id = 2;
  string username = 3;
  string expires_at = 4;
  repeated string scopes = 5;
  string error = 6;
  string guru_code = 7;
  string action_required = 8;     // "TOKEN_EXPIRED", "TOKEN_EXPIRING", "NOT_AUTHENTICATED", or empty
  string guidance_message = 9;    // Human-readable guidance for next steps
}

// Trigger sync request
message XBookmarksSyncRequest {
  string user_id = 1;            // Optional: specific user
  bool full_sync = 2;            // If true, sync all bookmarks. If false, only new ones.
  string folder_id = 3;          // Optional: sync specific folder only
}

// Sync run result
message XBookmarksSyncResponse {
  bool started = 1;              // True if sync was started
  int32 run_id = 2;              // Run ID if started
  string message = 3;            // Status message or error
  // Extended fields for detailed sync results
  string status = 4;             // "completed", "failed", "partial", "queued"
  int32 bookmarks_fetched = 5;   // Total from X API (or existing in DB)
  int32 iceberg_written = 6;     // New rows written to raw.bookmarks
  int32 queue_items = 7;         // KB sync work queue items created
  string action_required = 8;    // TOKEN_EXPIRED, NOT_AUTHENTICATED, etc.
  string guidance_message = 9;   // Human-readable guidance for next steps
}

// Sync status request
message XBookmarksSyncStatusRequest {
  string user_id = 1;            // Optional: specific user
}

// Sync status response
message XBookmarksSyncStatusResponse {
  bool configured = 1;
  string user_id = 2;
  string username = 3;
  string token_status = 4;       // "valid", "expired", "expiring_soon", "none"
  int32 folder_count = 5;
  int32 bookmark_count = 6;
  int32 queued_requests = 7;
  string last_sync_at = 8;       // ISO timestamp
  string last_run_status = 9;    // "completed", "failed", "running"
  string action_required = 10;   // "TOKEN_EXPIRED", "TOKEN_EXPIRING", "SYNC_FAILED", "NOT_CONFIGURED", or empty
  string guidance_message = 11;  // Human-readable guidance for next steps
}

// Service status request
message XBookmarksServiceStatusRequest {}

// Service status response
message XBookmarksServiceStatusResponse {
  bool running = 1;              // Is queue processor running?
  int32 total_syncs = 2;         // Total syncs completed
  int32 total_bookmarks = 3;     // Total bookmarks synced
  string last_sync_at = 4;       // ISO timestamp
  int32 queue_poll_interval_s = 5;
}

// Bookmark folder
message XBookmarkFolder {
  string id = 1;                 // Folder ID from X API
  string name = 2;               // Folder name
  string kb_path = 3;            // KB path (e.g., "current/bookmarks/folder_name")
  int32 bookmark_count = 4;      // Number of bookmarks in folder
}

// List folders request
message XBookmarksListFoldersRequest {
  string user_id = 1;            // Optional: specific user
}

// List folders response
message XBookmarksListFoldersResponse {
  repeated XBookmarkFolder folders = 1;
  bool folders_available = 2;    // False if API tier doesn't support folders
  string message = 3;            // Status message or error
}

// Queue status request (for InitPanel cooldown timer)
message XBookmarksQueueStatusRequest {}

// Queue status response
message XBookmarksQueueStatusResponse {
  int32 queue_depth = 1;           // Total pending requests in work queue
  string cooldown_end_iso = 2;     // ISO8601 timestamp when cooldown ends (empty if can request)
  int32 cooldown_seconds = 3;      // Seconds remaining until next request allowed
  bool can_request = 4;            // True if rate limit allows request now
}

// Emit test event request (for debugging XB event propagation chain with OTel tracing)
message XBookmarksEmitTestEventRequest {
  string event_type = 1;           // XB_AUTH_COMPLETED, XB_AUTH_FAILED, XB_STATUS_CHANGED (default: XB_AUTH_COMPLETED)
}

// Emit test event response
message XBookmarksEmitTestEventResponse {
  bool success = 1;
  string event_type = 2;           // Event type that was emitted
  string message = 3;              // Status message
}

