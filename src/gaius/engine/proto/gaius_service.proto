// ═══════════════════════════════════════════════════════════════════════════
// ThetaAgent Messages (Neuromorphic Consolidation)
// ═══════════════════════════════════════════════════════════════════════════

// Consolidation request - NVAR-mediated cross-temporal linking
message ThetaConsolidateRequest {
  string temporal_slice = 1;      // Slice ID (e.g., "2025-W52"). Empty = current week
  int32 max_candidates = 2;       // Max subsumption candidates to evaluate (default: 10)
  bool research_mode = 3;         // Bypass KG cost threshold (default: true)
}

// Consolidation response
message ThetaConsolidateResponse {
  bool success = 1;
  string slice_id = 2;

  // NVAR signal
  float urgency = 3;              // Consolidation urgency [0, 1]
  float drift = 4;                // Embedding drift from prediction

  // Subsumption results
  int32 candidates_evaluated = 5;
  int32 candidates_selected = 6;
  int32 documents_augmented = 7;

  // Error handling
  string error = 8;
  string guru_meditation = 9;     // Guru code if DeepOnto unavailable
}

// Consolidation statistics request
message ThetaConsolidationStatsRequest {}

// Consolidation statistics
message ThetaConsolidationStatsResponse {
  // NVAR dynamics
  int32 nvar_k = 1;               // Delay parameter
  int32 nvar_order = 2;           // Polynomial order
  int32 slice_count = 3;          // Number of temporal slices tracked
  bool can_predict = 4;           // Has enough history for NVAR prediction

  // Knowledge Gradient policy
  bool research_mode = 5;
  float measurement_cost = 6;
  int32 n_measurements = 7;
  float current_best_value = 8;

  // Effectiveness tracker
  int32 effectiveness_history_length = 9;
  string effectiveness_trend = 10; // "improving", "stable", "declining", "unknown"
  float mean_contribution = 11;

  // Subsumption inferencer
  float confidence_threshold = 12;
  string template_type = 13;      // "IC", "PC", or "BC"
  bool classifier_loaded = 14;
}

// SITREP request (situational awareness report)
message ThetaSitrepRequest {
  string horizon = 1;             // "day", "week", "quarter", "open"
}

// SITREP response
message ThetaSitrepResponse {
  bool success = 1;
  string horizon = 2;
  int64 generated_at_ms = 3;

  // System health
  bool healthy = 4;
  string status_text = 5;
  int32 gpu_count = 6;
  int32 endpoint_count = 7;

  // Summary counts
  int32 priority_count = 8;
  int32 thought_count = 9;
  int32 objective_count = 10;
  int32 project_count = 11;

  // Serialized data
  bytes report_json = 12;         // Full SituationReport as JSON
  string ascii_format = 13;       // Human-readable ASCII output
  string error = 14;
}

// KB-oriented day agenda (current/agenda.md + project agendas).
// Not Synth's gesture/procedure FSM.
message ThetaAgendaRequest {
  string action = 1;              // "list" | "init"
  string horizon = 2;             // "day", "week", "quarter", "open"
}

message ThetaAgendaItem {
  string description = 1;
  string priority = 2;
