[workspace]
resolver = "2"
members = ["crates/gaius-ui"]
default-members = ["crates/gaius-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros", "ws", "json", "multipart"] }
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
askama = "0.13"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
thiserror = "2"
vt100 = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
