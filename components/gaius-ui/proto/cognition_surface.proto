// Client subset of gaius.engine.GaiusService — field numbers MUST match
// src/gaius/engine/proto/gaius_service.proto (CognitionSurface).
syntax = "proto3";
package gaius.engine;

message ThoughtMessage {
  string id = 1;
  string thought_type = 2;
  string title = 3;
  string summary = 4;
  float salience = 5;
  int32 generation = 6;
  int64 timestamp_ms = 7;
  string note_path = 8;
}

message CognitionSurfaceRequest {
  int32 window_days = 1;
  int32 thought_limit = 2;
  string stream = 3;
  string window = 4;
  string bucket = 5;
  int64 from_ms = 6;
  int64 to_ms = 7;
}

message CognitionDayBucket {
  string date = 1;
  int32 thoughts = 2;
  int32 cycles = 3;
}

message CognitionBucket {
  int64 start_ms = 1;
  int64 end_ms = 2;
  int32 thoughts = 3;
  int32 cycles = 4;
  int64 tokens = 5;
  float salience_max = 6;
}

message CognitionHourCell {
  int32 weekday = 1;
  int32 hour = 2;
  int32 thoughts = 3;
}

message CognitionStreamCount {
  string id = 1;
  int32 thoughts = 2;
}

message CognitionContribution {
  string group = 1;
  string id = 2;
  string system = 3;
  int32 total = 4;
  repeated int32 series = 5;
  string peer = 6;
}

message CognitionSurfaceResponse {
  bool running = 1;
  int32 cycles_completed = 2;
  int32 cycles_in_window = 3;
  int64 last_cycle_timestamp_ms = 4;
  string current_task = 5;
  int32 thoughts = 6;
  int32 streams = 7;
  int32 active_days = 8;
  float thoughts_per_cycle = 9;
  string concentration_stream = 10;
  float concentration_pct = 11;
  int32 reserve_tokens = 12;
  string project = 13;
  string unit = 14;
  repeated ThoughtMessage recent = 15;
  repeated ThoughtMessage top = 16;
  repeated CognitionDayBucket days = 17;
  repeated CognitionHourCell hours = 18;
  repeated CognitionStreamCount stream_counts = 19;
  string error = 20;
  repeated CognitionBucket buckets = 21;
  string interval = 22;
  int64 range_start_ms = 23;
  int64 range_end_ms = 24;
  int64 effective_end_ms = 25;
  int32 bucket_seconds = 26;
  repeated CognitionContribution contributions = 27;
}

message CognitionThoughtRequest {
  string id = 1;
}

message CognitionThoughtDetail {
  string id = 1;
  string thought_type = 2;
  string title = 3;
  string summary = 4;
  string content = 5;
  float salience = 6;
  float confidence = 7;
  float novelty = 8;
  int32 generation = 9;
  int64 timestamp_ms = 10;
  string note_path = 11;
  string status = 12;
  string generator_model = 13;
  int32 tokens_used = 14;
  repeated string domains = 15;
  string thought_chain_id = 16;
  string predecessor_id = 17;
}

message CognitionThoughtResponse {
  CognitionThoughtDetail thought = 1;
  repeated CognitionThoughtDetail chain = 2;
  string error = 3;
}

message CognitionStreamRequest {
  int32 buffer_size = 1;
  repeated string event_types = 2;
}

message CognitionEvent {
  enum Type {
    CYCLE_START = 0;
    THOUGHT = 1;
    PATTERN = 2;
    CONNECTION = 3;
    CURIOSITY = 4;
    SELF_OBSERVATION = 5;
    ENGINE_AUDIT = 6;
    CYCLE_END = 7;
    ERROR = 8;
  }
  Type type = 1;
  int64 timestamp_ms = 2;
  string thought_id = 3;
  string thought_type = 4;
  string title = 5;
  string summary = 6;
  float salience = 7;
  int32 generation = 8;
  string cycle_id = 9;
  int32 thoughts_in_cycle = 10;
  string error = 11;
}

message CognitionWaterfallRequest {
  int32 window_s = 1;
}

message CognitionWaterfallResponse {
  int64 epoch_unix_ms = 1;
  int32 n_channels = 2;
  int32 n_times = 3;
  repeated string channel_names = 4;
  repeated float matrix = 5;
  string driver = 6;
  string error = 7;
  int32 hn_tokens = 8;
  int32 fmp_tokens = 9;
  string bokeh_json = 10;
}

message AgendaCheck {
  bool done = 1;
  string text = 2;
}

message AgendaCard {
  string path = 1;
  string kind = 2;
  string title = 3;
  string body = 4;
  string excerpt = 5;
  string prev = 6;
  string next = 7;
  string starts = 8;
  string ends = 9;
  repeated string tags = 10;
  bool pin = 11;
  repeated AgendaCheck checks = 12;
  int64 created_ms = 13;
  string intent = 14;
  string with_whom = 15;
  string calendar_url = 16;
  string timezone = 17;
  string join_url = 18;
}

message AgendaListRequest {
  int32 window_days = 1;
  string kind = 2;
  string tag = 3;
  string origin = 4;
  string timezone = 5;
}

message AgendaListResponse {
  repeated AgendaCard items = 1;
  string error = 2;
}

message AgendaGetRequest {
  string path = 1;
}

message AgendaGetResponse {
  AgendaCard item = 1;
  string error = 2;
}

message AgendaCreateRequest {
  string kind = 1;
  string title = 2;
  string body = 3;
  string starts = 4;
  string ends = 5;
  repeated string tags = 6;
  bool pin = 7;
  string intent = 8;
  string with_whom = 9;
  string timezone = 10;
}

message AgendaCreateResponse {
  AgendaCard item = 1;
  string error = 2;
}

message AgendaUpdateRequest {
  string path = 1;
  string title = 2;
  string body = 3;
  string starts = 4;
  string ends = 5;
  repeated string tags = 6;
  bool pin = 7;
  bool has_pin = 8;
  repeated AgendaCheck checks = 9;
  bool has_checks = 10;
  string intent = 11;
  bool has_intent = 12;
  string with_whom = 13;
  bool has_with = 14;
  string timezone = 15;
  bool has_timezone = 16;
}

message AgendaUpdateResponse {
  AgendaCard item = 1;
  string error = 2;
}

message SummaryNote {
  string id = 1;
  string title = 2;
  string body = 3;
  string section = 4;
  string lens = 5;
  string week = 6;
  int64 mtime_ms = 7;
  repeated string links = 8;
  string origin_project = 9;
  string origin_id = 10;
  string excerpt = 11;
  bool virtual = 12;
}

message SummaryIndexRequest {
  string section = 1;
  string lens = 2;
  string week = 3;
  int32 limit = 4;
}

message SummaryIndexResponse {
  string week = 1;
  string landing_id = 2;
  SummaryNote seed = 3;
  repeated SummaryNote items = 4;
  string error = 5;
}

message SummaryGetRequest {
  string id = 1;
  string section = 2;
  string lens = 3;
  string week = 4;
}

message SummaryGetResponse {
  SummaryNote note = 1;
  string error = 2;
}

message SummaryHopRequest {
  string from_id = 1;
  string target = 2;
  string section = 3;
  string lens = 4;
  string week = 5;
}

message SummaryHopResponse {
  SummaryNote note = 1;
  string resolved_id = 2;
  string error = 3;
}

message SummaryForkRequest {
  string id = 1;
  string origin_project = 2;
}

message SummaryForkResponse {
  SummaryNote note = 1;
  string error = 2;
}

message SummarySchedule {
  string id = 1;
  string cron = 2;
  string task_type = 3;
  string source = 4;
  bool enabled = 5;
  bool triggerable = 6;
  string cadence = 7;
}

message SummarySchedulesRequest {}

message SummarySchedulesResponse {
  repeated SummarySchedule items = 1;
  string error = 2;
}

message SummaryScheduleTriggerRequest {
  string id = 1;
}

message SummaryScheduleTriggerResponse {
  int32 task_id = 1;
  string task_type = 2;
  string error = 3;
}

message FederationSurface {
  string project = 1;
  string engine_target = 2;
  string primary_ui = 3;
}

message FederationSurfacesRequest {}

message FederationSurfacesResponse {
  repeated FederationSurface items = 1;
  string error = 2;
}

message FederationCognitionRequest {}

message FederationCognitionItem {
  string project = 1;
  string unit = 2;
  bool running = 3;
  int32 thoughts = 4;
  int32 cycles = 5;
  int64 last_cycle_ms = 6;
  string interval = 7;
  int64 range_start_ms = 8;
  int64 range_end_ms = 9;
  repeated CognitionBucket buckets = 10;
  repeated CognitionStreamCount stream_counts = 11;
}

message FederationCognitionResponse {
  repeated FederationCognitionItem items = 1;
  string error = 2;
}

message FederationContributionsRequest {}

message FederationContributionsItem {
  string project = 1;
  string interval = 2;
  int64 range_start_ms = 3;
  int64 range_end_ms = 4;
  repeated CognitionBucket buckets = 5;
  repeated CognitionContribution items = 6;
}

message FederationContributionsResponse {
  repeated FederationContributionsItem items = 1;
  string error = 2;
}

message CognitionCorpusRequest {
  int32 limit = 1;
  int32 window_days = 2;
  string flow = 3;
}

message CognitionCorpusItem {
  string id = 1;
  string flow_name = 2;
  string step_name = 3;
  string run_id = 4;
  string subject = 5;
  string technique = 6;
  string model_name = 7;
  string decision = 8;
  double confidence = 9;
  int64 input_tokens = 10;
  int64 output_tokens = 11;
  int64 latency_ms = 12;
  int64 generated_at_ms = 13;
  string product_id = 14;
  bool has_layers = 15;
  int32 layer_count = 16;
}

message CognitionCorpusResponse {
  repeated CognitionCorpusItem items = 1;
  int32 total = 2;
  string error = 3;
}

message CognitionTraceRequest {
  string id = 1;
}

message CognitionReasoningLayer {
  string layer = 1;
  string producer = 2;
  int64 tokens = 3;
  string text = 4;
}

message CognitionTraceResponse {
  CognitionCorpusItem item = 1;
  string prompt = 2;
  string reasoning_trace = 3;
  string output = 4;
  repeated CognitionReasoningLayer layers = 5;
  string error = 6;
}

message AskPresentRequest {
  string kind = 1;
  string symbol = 2;
  string title = 3;
  string from_date = 4;
  string to_date = 5;
  string payload_json = 6;
}

message AskPresentResponse {
  string artifact_json = 1;
  string error = 2;
  int32 n_items = 3;
}

message StartEndpointRequest {
  string endpoint_name = 1;
}

message StopEndpointRequest {
  string endpoint_name = 1;
  bool force = 2;
}

message EndpointResponse {
  bool success = 1;
  string message = 2;
}

message EnsureEndpointResponse {
  bool healthy = 1;
  string status = 2;
  int32 port = 3;
  repeated int32 gpu_ids = 4;
  string message = 5;
}

message SignalsTelemetryRequest {}

message GpuWatt {
  int32 index = 1;
  string uuid = 2;
  string model = 3;
  double power_w = 4;
  double util = 5;
  double memory_used_mib = 6;
  double memory_free_mib = 7;
  double energy_mj = 8;
  double temp_c = 9;
}

message SignalsTelemetryResponse {
  string source_url = 1;
  string scraped_at = 2;
  repeated GpuWatt gpus = 3;
  double total_w = 4;
  double parked_w = 5;
  double inferring_w = 6;
  string error = 7;
}

message DiscoverSurfaceRequest {
  string window = 1;
  string query = 2;
  string breakdown = 3;
  int32 limit = 4;
  string cursor = 5;
  repeated string feature_pins = 6;
  string from_ts = 7;
  string to_ts = 8;
}

message DiscoverBucket {
  string t = 1;
  int32 n = 2;
  string breakdown_key = 3;
  double salience = 4;
  double watts = 5;
  double util = 6;
  double salience_ma = 7;
  double watts_ma = 8;
  double util_ma = 9;
}

message DiscoverEpisode {
  string kind = 1;
  string at = 2;
  int32 eta_s = 3;
  string label = 4;
}

message DiscoverDoc {
  string id = 1;
  string stream = 2;
  string source = 3;
  string ts = 4;
  string title = 5;
  string body = 6;
  string source_id = 7;
  string url = 8;
}

message DiscoverFacet {
  string key = 1;
  string kind = 2;
  int32 count = 3;
  double salience = 4;
  string label = 5;
}

message DiscoverSurfaceResponse {
  repeated DiscoverBucket buckets = 1;
  repeated DiscoverDoc docs = 2;
  repeated DiscoverFacet facets = 3;
  int32 total = 4;
  string window = 5;
  string query = 6;
  string scraped_at = 7;
  string interval = 8;
  string error = 9;
  string last_salience_at = 10;
  DiscoverEpisode next_episode = 11;
  string clock = 12;
  DiscoverStatus status = 13;
}

message DiscoverStatus {
  bool updating = 1;
  int32 workflows = 2;
  string waiting_at = 3;
  double watts = 4;
  int32 articles = 5;
  int32 projects = 6;
  int32 thoughts = 7;
  bool watts_live = 8;
  int32 terms_skos = 9;
  int32 terms_cites = 10;
  double agenda_min = 11;
  double agenda_max = 12;
  double agenda_std = 13;
  double salience_peak = 14;
  int32 cognition_tokens = 15;
}

service GaiusService {
  rpc CognitionSurface(CognitionSurfaceRequest) returns (CognitionSurfaceResponse);
  rpc CognitionWaterfall(CognitionWaterfallRequest) returns (CognitionWaterfallResponse);
  rpc CognitionThought(CognitionThoughtRequest) returns (CognitionThoughtResponse);
  rpc SubscribeCognition(CognitionStreamRequest) returns (stream CognitionEvent);
  rpc AgendaList(AgendaListRequest) returns (AgendaListResponse);
  rpc AgendaGet(AgendaGetRequest) returns (AgendaGetResponse);
  rpc AgendaCreate(AgendaCreateRequest) returns (AgendaCreateResponse);
  rpc AgendaUpdate(AgendaUpdateRequest) returns (AgendaUpdateResponse);
  rpc SummaryIndex(SummaryIndexRequest) returns (SummaryIndexResponse);
  rpc SummaryGet(SummaryGetRequest) returns (SummaryGetResponse);
  rpc SummaryHop(SummaryHopRequest) returns (SummaryHopResponse);
  rpc SummaryFork(SummaryForkRequest) returns (SummaryForkResponse);
  rpc SummarySchedules(SummarySchedulesRequest) returns (SummarySchedulesResponse);
  rpc SummaryScheduleTrigger(SummaryScheduleTriggerRequest) returns (SummaryScheduleTriggerResponse);
  rpc FederationSurfaces(FederationSurfacesRequest) returns (FederationSurfacesResponse);
  rpc FederationCognition(FederationCognitionRequest) returns (FederationCognitionResponse);
  rpc CognitionCorpus(CognitionCorpusRequest) returns (CognitionCorpusResponse);
  rpc CognitionTrace(CognitionTraceRequest) returns (CognitionTraceResponse);
  rpc FederationContributions(FederationContributionsRequest) returns (FederationContributionsResponse);
  rpc AskPresent(AskPresentRequest) returns (AskPresentResponse);
  rpc EnsureEndpoint(StartEndpointRequest) returns (EnsureEndpointResponse);
  rpc StopEndpoint(StopEndpointRequest) returns (EndpointResponse);
  rpc SignalsTelemetry(SignalsTelemetryRequest) returns (SignalsTelemetryResponse);
  rpc DiscoverSurface(DiscoverSurfaceRequest) returns (DiscoverSurfaceResponse);
}
