<!DOCTYPE html>
<html lang="en" data-theme="keiretsu" data-mode="{{ mode }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · Gaius</title>
  <link rel="stylesheet" href="/assets/css/theme-keiretsu.css?v={{ asset_v }}" />
  <link rel="stylesheet" href="/assets/css/shell.css?v={{ asset_v }}" />
  <script src="/assets/js/md.js?v={{ asset_v }}"></script>
  <link rel="icon" href="/assets/brand/{{ brand_id }}/favicon.svg?v={{ asset_v }}" type="image/svg+xml" />
</head>
<body>
  <header class="atelier-chrome">
    <a class="brand" href="/">
      <img src="{{ logo_href }}" alt="{{ logo_alt }}" class="brand-logo" height="28" />
      <span class="brand-name">Gaius</span>
    </a>
    <nav class="nav">
      {# Landing is Board at `/` — brand mark is home; no redundant Board item #}
      <a href="/agenda" {% if active == "agenda" %}class="active"{% endif %}>Agenda</a>
      <a href="/cognition" {% if active == "cognition" %}class="active"{% endif %}>Cognition</a>
      <a href="/summary" {% if active == "summary" %}class="active"{% endif %}>Summary</a>
      <a href="/terminal" {% if active == "terminal" %}class="active"{% endif %}>Terminal</a>
    </nav>
    <div class="chrome-right">
      <button type="button" id="waffle-toggle" class="chrome-icon-btn" aria-label="Federated apps" aria-pressed="false" title="Federated primary UIs">
        <svg class="icon-waffle" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <circle cx="5" cy="5" r="1.7" fill="currentColor"/>
          <circle cx="12" cy="5" r="1.7" fill="currentColor"/>
          <circle cx="19" cy="5" r="1.7" fill="currentColor"/>
          <circle cx="5" cy="12" r="1.7" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
          <circle cx="19" cy="12" r="1.7" fill="currentColor"/>
          <circle cx="5" cy="19" r="1.7" fill="currentColor"/>
          <circle cx="12" cy="19" r="1.7" fill="currentColor"/>
          <circle cx="19" cy="19" r="1.7" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" id="ask-toggle" class="chrome-icon-btn" aria-label="Ask" aria-pressed="false" title="Ask (Ctrl+E) — surface-aware companion">
        <svg class="icon-ask" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9.2L5 19.6V16H6a2 2 0 0 1-2-2V5zm3.2 3.25h9.6v1.3H7.2V8.25zm0 3.1h6.8v1.3H7.2v-1.3z"/>
        </svg>
      </button>
      <button type="button" id="mode-toggle" class="chrome-icon-btn" aria-label="Switch to light" title="Switch to light">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M11 4h2v3h-2V4zm0 13h2v3h-2v-3zM4 11h3v2H4v-2zm13 0h3v2h-3v-2zM6.2 5.1l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1zm9.1 9.1l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1zM4.8 18.9l1.4 1.4 2.1-2.1-1.4-1.4-2.1 2.1zm11.2-11.2l1.4 1.4 2.1-2.1-1.4-1.4-2.1 2.1zM8 12a4 4 0 108 0 4 4 0 00-8 0z"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M13 3a8.5 8.5 0 108.4 10.7 7 7 0 01-8.4-10.7z"/>
        </svg>
      </button>
      <a href="/settings" class="chrome-icon-btn{% if active == "settings" %} active{% endif %}"
         aria-label="Settings" title="Settings — deployment configuration">
        <svg class="icon-gear" viewBox="64 64 896 896" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M924.8 625.7l-65.5-35.9c3.1-19 4.7-38.4 4.7-57.8s-1.6-38.8-4.7-57.8l65.5-35.9c10.1-5.5 14.2-18.1 9.4-28.7-13.1-28.7-29.6-55.6-49.4-79.6-7.3-8.8-20.3-11.2-30.3-5.7l-65.5 35.9c-29.8-25.2-64.3-43.5-101.5-54.1V160c0-11.7-8.1-21.9-19.6-24.3-33.4-7.2-67.9-7.2-101.3 0-11.5 2.5-19.6 12.6-19.6 24.3v71.9c-37.2 10.6-71.7 28.9-101.5 54.1l-65.5-35.9c-10-5.5-23-3.1-30.3 5.7-19.8 24-36.3 50.9-49.4 79.6-4.8 10.6-.7 23.2 9.4 28.7l65.5 35.9c-3.1 19-4.7 38.4-4.7 57.8s1.6 38.8 4.7 57.8l-65.5 35.9c-10.1 5.5-14.2 18.1-9.4 28.7 13.1 28.7 29.6 55.6 49.4 79.6 7.3 8.8 20.3 11.2 30.3 5.7l-65.5-35.9c29.8 25.2 64.3 43.5 101.5 54.1V864c0 11.7 8.1 21.9 19.6 24.3 33.4 7.2 67.9 7.2 101.3 0 11.5 2.5-19.6 12.6-19.6 24.3v-71.9c37.2-10.6 71.7 28.9 101.5 54.1l-65.5 35.9c10 5.5 23 3.1 30.3-5.7 19.8-24 36.3-50.9 49.4-79.6 4.8-10.6.7-23.2-9.4-28.7zM512 624c-61.9 0-112-50.1-112-112s50.1-112 112-112 112 50.1 112 112-50.1 112-112 112z"/>
        </svg>
      </a>
    </div>
  </header>
  <aside id="waffle-rail" class="waffle-rail" hidden>
    <div class="waffle-rail-head">
      <span>Federation</span>
      <button type="button" id="waffle-close" class="chrome-icon-btn" aria-label="Close">×</button>
    </div>
    <ul id="waffle-list" class="waffle-list"></ul>
    <p id="waffle-empty" class="waffle-empty muted" hidden>No peers advertising a primary UI.</p>
  </aside>
  <main class="shell-main">
