{% include "chrome.html" %}
<div class="agenda-page" id="agenda-page">
  <aside class="agenda-rail" id="agenda-rail">
    <div class="agenda-rail-body">
      <div class="agenda-rail-icons" role="toolbar" aria-label="Agenda tools">
        <button type="button" class="agenda-ico" id="agenda-ico-cal" title="Calendar" aria-label="Show calendar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M7 3h2v2h6V3h2v2h3v16H4V5h3V3zm13 6H4v11h16V9zM6 13h4v4H6v-4z"/>
          </svg>
          <span class="agenda-ico-badge" id="agenda-ico-cal-badge" hidden></span>
        </button>
        <button type="button" class="agenda-ico" id="agenda-ico-search" title="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M10 4a6 6 0 014.47 10.03l4.25 4.25-1.41 1.41-4.25-4.25A6 6 0 1110 4zm0 2a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
        </button>
      </div>
      <div class="agenda-cal" id="agenda-cal" aria-label="Month"></div>
      <input id="agenda-q" class="agenda-search" type="search" placeholder="Search" autocomplete="off" />
      <nav class="agenda-filters" aria-label="Kind">
        <button type="button" class="agenda-filter active" data-kind="" title="All">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
          <span class="agenda-filter-label">All</span>
        </button>
        <button type="button" class="agenda-filter" data-kind="note" title="Notes">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6 3h9l5 5v13H6V3zm8 1.2V9h4.8L14 4.2zM8 12h8v1.4H8V12zm0 3.2h8V16.6H8v-1.4z"/></svg>
          <span class="agenda-filter-label">Notes</span>
        </button>
        <button type="button" class="agenda-filter" data-kind="list" title="Lists">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 7h2v2H5V7zm4 0h10v2H9V7zM5 11h2v2H5v-2zm4 0h10v2H9v-2zM5 15h2v2H5v-2zm4 0h10v2H9v-2z"/></svg>
          <span class="agenda-filter-label">Lists</span>
        </button>
        <button type="button" class="agenda-filter" data-kind="event" title="Events">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 3h2v2h6V3h2v2h3v16H4V5h3V3zm13 6H4v11h16V9z"/></svg>
          <span class="agenda-filter-label">Events</span>
        </button>
      </nav>
      <div class="agenda-tag-cloud" id="agenda-tags" hidden></div>
    </div>
    <footer class="agenda-rail-foot">
      <button type="button" class="agenda-rail-toggle" id="agenda-rail-toggle"
              aria-expanded="true" aria-controls="agenda-rail" title="Collapse panel">
        <svg class="agenda-rail-chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M14.7 6.3L8 13l6.7 6.7-1.4 1.4L5.2 13l8.1-8.1 1.4 1.4zm5 0L13 13l6.7 6.7-1.4 1.4L10.2 13l8.1-8.1 1.4 1.4z"/>
        </svg>
        <span class="agenda-filter-label">Collapse</span>
      </button>
    </footer>
  </aside>
  <section class="agenda-main">
    <div class="agenda-toolbar">
      <div>
        <h1 class="agenda-title">Agenda</h1>
        <p class="agenda-kicker">Letters and memos. Shared lists. Catch-ups with a colleague.</p>
      </div>
    </div>
    <div id="agenda-error" class="cog-error" hidden></div>
    <div id="agenda-schedule" class="agenda-schedule"></div>
  </section>
  <button type="button" class="agenda-fab" id="agenda-fab" aria-haspopup="true" aria-label="Create">+</button>
  <div class="agenda-fab-menu" id="agenda-fab-menu" hidden>
    <button type="button" data-create="note">Brief</button>
    <button type="button" data-create="list">List</button>
    <button type="button" data-create="event">Event</button>
    <button type="button" data-create="session">Session</button>
  </div>
</div>
<div class="agenda-editor" id="agenda-editor" hidden>
  <div class="agenda-editor-card">
    <div class="agenda-editor-bar">
      <span class="pill" id="ed-kind">note</span>
      <span class="muted mono" id="ed-path"></span>
      <div class="agenda-ed-actions">
        <button type="button" class="ask-icon-btn" id="ed-edit" title="Edit" aria-label="Edit">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M4 17.2V20h2.8l8.2-8.2-2.8-2.8L4 17.2zm14.7-8.5c.3-.3.3-.8 0-1.1l-2.3-2.3c-.3-.3-.8-.3-1.1 0l-1.8 1.8 3.4 3.4 1.8-1.8z"/>
          </svg>
        </button>
        <button type="button" class="ask-icon-btn primary" id="ed-save" title="Save" aria-label="Save" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M9.2 16.6L4.8 12.2l1.4-1.4 3 3 8.6-8.6 1.4 1.4-10 10z"/>
          </svg>
        </button>
        <button type="button" class="ask-icon-btn" id="ed-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M6.4 5L12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="agenda-view" class="agenda-view">
      <h2 class="agenda-ed-title" id="view-title"></h2>
      <p class="agenda-view-meta" id="view-meta"></p>
      <div id="view-body" class="agenda-md ask-md"></div>
    </div>
    <div id="agenda-edit-form" hidden>
      <input id="ed-title" class="agenda-ed-title" type="text" placeholder="Title" />
      <div class="agenda-ed-meta">
        <input id="ed-starts" type="datetime-local" aria-label="Starts" />
        <input id="ed-ends" type="datetime-local" aria-label="Ends" />
        <input id="ed-tags" type="text" placeholder="tags, comma separated" />
        <select id="ed-intent" aria-label="Intent">
          <option value="brief">brief</option>
          <option value="reminder">reminder</option>
          <option value="session">session</option>
        </select>
        <label class="agenda-pin"><input type="checkbox" id="ed-pin" /> Pin</label>
      </div>
      <nav class="agenda-ed-links" id="ed-links" aria-label="prev next"></nav>
      <textarea id="ed-body" class="agenda-ed-body" rows="14" spellcheck="true"></textarea>
    </div>
  </div>
</div>
<script src="/assets/js/agenda.js?v={{ asset_v }}" defer></script>
{% include "footer.html" %}
