  </main>
  <aside class="ask-panel" id="ask-panel" hidden>
    <header class="ask-head">
      <div>
        <h2 class="ask-title">Ask</h2>
        <p class="ask-context" id="ask-context">Looking at this page</p>
      </div>
      <div class="ask-head-actions">
        <button type="button" class="ask-icon-btn" id="ask-new" title="New" aria-label="New conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/>
          </svg>
        </button>
        <button type="button" class="ask-icon-btn" id="ask-close" title="Close" aria-label="Close Ask">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M6.4 5L12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/>
          </svg>
        </button>
      </div>
    </header>
    <div class="ask-log" id="ask-log"></div>
    <form class="ask-compose" id="ask-form">
      <textarea id="ask-input" rows="3" placeholder="Ask about what you are looking at…"></textarea>
      <button type="submit" class="ask-icon-btn primary" id="ask-send" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M3 20.4V3.6L21.2 12 3 20.4zm2.5-3.3L15.6 12 5.5 6.9v3.6l5.4 1.5-5.4 1.5v3.6z"/>
        </svg>
      </button>
    </form>
  </aside>
  <footer class="shell-footer">
    <span>gaius-ui · Axum · Keiretsu · brand={{ brand_id }}</span>
    <a href="/api/gaius/v1/board">board API</a>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('mode-toggle');
      function apply(mode) {
        root.setAttribute('data-mode', mode);
        try { localStorage.setItem('gaius-ui-mode', mode); } catch (e) {}
        if (btn) {
          var next = mode === 'light' ? 'Switch to dark' : 'Switch to light';
          btn.title = next;
          btn.setAttribute('aria-label', next);
        }
      }
      var saved = null;
      try { saved = localStorage.getItem('gaius-ui-mode'); } catch (e) {}
      if (saved === 'light' || saved === 'dark') apply(saved);
      if (btn) btn.addEventListener('click', function () {
        apply(root.getAttribute('data-mode') === 'light' ? 'dark' : 'light');
      });
    })();
  </script>
  <script src="/assets/js/chrome.js?v={{ asset_v }}" defer></script>
  <script src="/assets/js/agent.js?v={{ asset_v }}" defer></script>
</body>
</html>
