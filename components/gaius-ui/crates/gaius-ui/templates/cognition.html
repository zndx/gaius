{% include "chrome.html" %}
<div class="cog-page" id="cog-page">
  <aside class="cog-rail" aria-label="Thought stream">
    <div class="cog-rail-head">
      <span class="cog-kicker" id="cog-rail-count">— THOUGHTS</span>
      <label class="cog-sr-only" for="cog-stream">Stream</label>
      <select id="cog-stream" class="cog-select" aria-label="Stream">
        <option value="">All streams</option>
      </select>
    </div>
    <ul class="cog-rail-list" id="cog-rail-list"></ul>
    <div class="cog-rail-foot mono muted" id="cog-rail-foot">federation.project=gaius</div>
  </aside>
  <section class="cog-main">
    <div id="cog-error" class="cog-error" hidden></div>
    <div class="cog-toolbar">
      <label class="cog-toolbar-label">Window
        <select id="cog-win" class="cog-select" aria-label="Window">
          <option value="24h">Last 24 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="90d">Last 90 days</option>
          <option value="365d" selected>Last year</option>
          <option value="all">All history</option>
        </select>
      </label>
      <label class="cog-toolbar-label">Buckets
        <select id="cog-bucket" class="cog-select" aria-label="Bucket granularity">
          <option value="" selected>Auto</option>
          <option value="hour">Hour</option>
          <option value="6h">6 hours</option>
          <option value="day">Day</option>
          <option value="week">Week</option>
          <option value="month">Month</option>
        </select>
      </label>
      <button type="button" id="cog-range-chip" class="cog-chip" hidden>range ✕</button>
      <button type="button" id="cog-refresh" class="btn">Refresh</button>
      <span class="muted mono" id="cog-updated">UTC</span>
      <span class="cog-live-dot" id="cog-live" title="live stream"></span>
      <span class="pill" id="cog-running">—</span>
    </div>
    <div class="cog-stats" id="cog-stats" aria-label="Cognition totals"></div>
    <div class="cog-panel" id="cog-fed-panel" hidden>
      <div class="cog-panel-head">
        <h2>Federation</h2>
      </div>
      <div id="cog-fed" class="cog-fed" aria-label="Federation cognition lanes"></div>
    </div>
    <div class="cog-panel" id="cog-calendar-panel">
      <div class="cog-panel-head">
        <h2>Activity</h2>
      </div>
      <div id="cog-year" class="cog-year" role="img" aria-label="Activity heatmap"></div>
    </div>
    <div class="cog-panel" id="cog-corpus-panel" hidden>
      <div class="cog-panel-head">
        <h2>Reasoning corpus</h2>
      </div>
      <div id="cog-corpus" class="cog-corpus" aria-label="Retained reasoning traces"></div>
    </div>
    <div class="cog-split">
      <div class="cog-panel">
        <div class="cog-panel-head">
          <h3>Contributions</h3>
        </div>
        <div id="cog-contrib" class="cog-contrib" aria-label="Contributions by source and workflow"></div>
      </div>
      <div class="cog-panel">
        <div class="cog-panel-head">
          <h2>Top thoughts</h2>
          <span class="muted">salience</span>
        </div>
        <ol id="cog-top" class="cog-top"></ol>
      </div>
    </div>
  </section>
</div>
<div id="cog-drawer-root"></div>
<script src="/assets/js/cogchart.js?v={{ asset_v }}" defer></script>
<script src="/assets/js/cognition.js?v={{ asset_v }}" defer></script>
{% include "footer.html" %}
