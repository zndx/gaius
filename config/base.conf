# Gaius Base Configuration
# =========================
# HOCON format - supports ${?ENV_VAR} substitution and includes
#
# Configuration hierarchy (highest to lowest priority):
# 1. Environment variables (via ${?VAR} substitution)
# 2. Profile-specific config (config/profiles/*.conf)
# 3. This base config (config/base.conf)

gaius {
  # Application identity
  app {
    name = "Gaius"
    version = "0.2.0"
    subtitle = "Spatial Intelligence Interface"
  }

  # Active profile (can be overridden by CLI or env)
  profile = "default"
  profile = ${?GAIUS_PROFILE}

  # Knowledge Base paths
  kb {
    root = "build/dev"
    root = ${?GAIUS_KB_ROOT}

    # Subdirectory structure
    current = ${gaius.kb.root}/current
    scratch = ${gaius.kb.root}/scratch
    archive = ${gaius.kb.root}/archive
  }

  # Database configuration
  database {
    url = "postgres://localhost:5438/zndx_gaius?sslmode=disable"
    url = ${?DATABASE_URL}
    pool_size = 10
  }

  # Vector store (Qdrant)
  vector_store {
    host = "localhost"
    host = ${?QDRANT_HOST}
    port = 6339
    port = ${?QDRANT_PORT}
    collection = "gaius_kb"
    embedding_model = "all-MiniLM-L6-v2"
  }

  # Inference settings
  inference {
    backend = "optillm"
    backend = ${?GAIUS_BACKEND}

    model = "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    model = ${?GAIUS_MODEL}

    fallback_model = "gpt-4o-mini"
    fallback_model = ${?GAIUS_FALLBACK_MODEL}

    # optillm settings
    optillm {
      url = "http://localhost:8080/v1"
      url = ${?GAIUS_OPTILLM_URL}
      api_key = "sk-optillm"
      api_key = ${?GAIUS_OPTILLM_API_KEY}
      technique = ""
      technique = ${?GAIUS_OPTILLM_TECHNIQUE}
    }

    # vLLM settings
    vllm {
      url = "http://localhost:8088/v1"
      url = ${?GAIUS_VLLM_URL}
    }

    # Phase-based model routing
    phase_models {
      exploration = ${gaius.inference.model}
      synthesis = ${gaius.inference.model}
      evaluation = "claude-sonnet-4-20250514"
    }

    offline_mode = false
    offline_mode = ${?GAIUS_OFFLINE}

    timeout = 60
    max_tokens = 2048
  }

  # Search configuration
  search {
    hybrid {
      bm25_weight = 0.3
      vector_weight = 0.7
    }
    max_results = 20
  }

  # Worker pool settings
  workers {
    pool_size = 4
    poll_interval = 30
    job_timeout = 300
    batch_size = 10
    max_retries = 3
  }

  # Swarm agent configuration
  swarm {
    enabled = true
    auto_trigger_on_domain = true  # Run swarm when domain changes

    roles = [
      "Leader",
      "Risk",
      "Optimizer",
      "Planner",
      "Critic",
      "Executor",
      "Adversary"
    ]
  }

  # TDA (Topological Data Analysis) settings
  tda {
    enabled = true
    compute_interval_minutes = 60  # Background computation frequency
    projection_method = "umap"  # or "pca"
  }

  # UI settings
  ui {
    left_panel_visible = true
    right_panel_visible = true
    view_mode = "go"
    overlay_mode = "none"
    center_panel_mode = "graph"  # graph, think, none
  }

  # Startup procedure (like devenv enterShell)
  startup {
    commands = []  # Commands to run on app start
    show_situational = true  # Show situational awareness on startup
  }

  # Situational awareness horizons
  awareness {
    emphasis_hours = 24
    default_horizon_days = 7
    strategic_horizon_days = 90
    secular_horizon_days = 365
  }

  # OpenTelemetry observability
  telemetry {
    enabled = false
    enabled = ${?GAIUS_TELEMETRY_ENABLED}
    exporter = "console"  # console, otlp
    endpoint = "http://localhost:4317"
    endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    service_name = "gaius"
  }
}
