# Gaius Base Configuration
# =========================
# HOCON format - supports ${?ENV_VAR} substitution and includes
#
# Configuration hierarchy (highest to lowest priority):
# 1. Environment variables (via ${?VAR} substitution)
# 2. Profile-specific config (config/profiles/*.conf)
# 3. This base config (config/base.conf)

gaius {
  # Application identity
  app {
    name = "Gaius"
    version = "0.2.0"
    subtitle = "Spatial Intelligence Interface"
  }

  # Active profile (can be overridden by CLI or env)
  profile = "default"
  profile = ${?GAIUS_PROFILE}

  # Knowledge Base paths
  kb {
    root = "build/dev"
    root = ${?GAIUS_KB_ROOT}

    # Subdirectory structure
    current = ${gaius.kb.root}/current
    scratch = ${gaius.kb.root}/scratch
    archive = ${gaius.kb.root}/archive
  }

  # Database configuration
  database {
    url = "postgres://localhost:5438/zndx_gaius?sslmode=disable"
    url = ${?DATABASE_URL}
    pool_size = 10
  }

  # Vector store (Qdrant)
  vector_store {
    host = "localhost"
    host = ${?QDRANT_HOST}
    port = 6339
    port = ${?QDRANT_PORT}
    collection = "gaius_kb"

    # Embedding model selection
    # Nomic: 768-dim, excellent quality, unified text+vision space
    # Alternative: all-MiniLM-L6-v2 (384-dim, faster)
    embedding_model = "nomic-ai/nomic-embed-text-v1.5"
    embedding_model = ${?EMBEDDING_MODEL}

    # Security settings - Pin model versions to prevent malicious code injection
    # For production, pin to specific commit hash instead of "main"
    # Find commit hash at: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5/commits/main
    # Example: model_revision = "5c80574db15564a574b91b22ea8a7c4c70dabc00"
    model_revision = "main"  # Pin to specific commit in production
    model_revision = ${?EMBEDDING_MODEL_REVISION}

    # Require safetensors format (safer than pickle - no arbitrary code execution)
    use_safetensors = true

    # Allow remote code execution (needed for Nomic, disabled by default for security)
    # SECURITY: Only enable for trusted models. Nomic is maintained by Nomic AI.
    # Disable if using standard models like all-MiniLM-L6-v2
    trust_remote_code = true
    trust_remote_code = ${?TRUST_REMOTE_CODE}

    # Embedding type: "single" (sentence-transformers) or "multi" (ColQwen multimodal)
    embedding_type = "single"  # Change to "multi" for multimodal embeddings
    embedding_type = ${?EMBEDDING_TYPE}

    # Multimodal settings (only used when embedding_type = "multi")
    multimodal {
      # ColQwen2.5 model (7B params, unified text+image embeddings)
      model = "nomic-ai/colnomic-embed-multimodal-7b"
      model = ${?MULTIMODAL_MODEL}

      # Pin model version for security (same as above)
      model_revision = "main"  # Pin to commit hash in production
      model_revision = ${?MULTIMODAL_MODEL_REVISION}

      # Aggregation method for single-vector projection (UMAP/TDA)
      # Options: "mean" (preserves centroid), "max" (emphasizes features), "first" (CLS token)
      aggregation = "mean"
      aggregation = ${?MULTIMODAL_AGGREGATION}

      # Batch size for embedding (small for 7B model, adjust based on VRAM)
      batch_size = 4  # 7GB VRAM with fp16
      batch_size = ${?MULTIMODAL_BATCH_SIZE}

      # Use fp16 precision to reduce VRAM (14GB → 7GB)
      use_fp16 = true
    }
  }

  # Inference settings
  inference {
    backend = "optillm"
    backend = ${?GAIUS_BACKEND}

    model = "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    model = ${?GAIUS_MODEL}

    fallback_model = "gpt-4o-mini"
    fallback_model = ${?GAIUS_FALLBACK_MODEL}

    # optillm settings
    optillm {
      url = "http://localhost:8080/v1"
      url = ${?GAIUS_OPTILLM_URL}
      api_key = "sk-optillm"
      api_key = ${?GAIUS_OPTILLM_API_KEY}
      technique = ""
      technique = ${?GAIUS_OPTILLM_TECHNIQUE}
    }

    # vLLM settings (legacy single endpoint)
    vllm {
      url = "http://localhost:8088/v1"
      url = ${?GAIUS_VLLM_URL}
    }

    # Multi-GPU endpoint configuration
    # Each endpoint runs a vLLM instance with specific models
    endpoints {
      # Reasoning models (GPU 0-1, tensor parallel)
      reasoning {
        url = "http://localhost:8081/v1"
        url = ${?GAIUS_ENDPOINT_REASONING}
        models = ["Qwen/QwQ-32B"]
        gpus = [0, 1]
        tensor_parallel = 2
      }

      # Coding/structured models (GPU 2)
      coding {
        url = "http://localhost:8082/v1"
        url = ${?GAIUS_ENDPOINT_CODING}
        models = ["Qwen/Qwen3-Coder-30B-A3B-Instruct"]
        gpus = [2]
      }

      # Fast models for quick responses (GPU 3)
      fast {
        url = "http://localhost:8083/v1"
        url = ${?GAIUS_ENDPOINT_FAST}
        models = ["mistralai/Mistral-7B-Instruct-v0.3"]
        gpus = [3]
      }

      # Orchestration/routing (GPU 4-5, TP=2 for full 40k context)
      orchestration {
        url = "http://localhost:8084/v1"
        url = ${?GAIUS_ENDPOINT_ORCHESTRATION}
        models = ["nvidia/Orchestrator-8B"]
        gpus = [4, 5]
        tensor_parallel = 2
      }
    }

    # Model to endpoint routing
    model_routing {
      "Qwen/QwQ-32B" = "reasoning"
      "Qwen/Qwen3-Coder-30B-A3B-Instruct" = "coding"
      "mistralai/Mistral-7B-Instruct-v0.3" = "fast"
      "nvidia/Orchestrator-8B" = "orchestration"
      default = "coding"  # Fallback endpoint
    }

    # Phase-based model routing
    phase_models {
      exploration = ${gaius.inference.model}
      synthesis = ${gaius.inference.model}
      evaluation = "claude-sonnet-4-20250514"
    }

    offline_mode = false
    offline_mode = ${?GAIUS_OFFLINE}

    timeout = 60
    max_tokens = 2048

    # GPU Orchestrator settings
    orchestrator {
      enabled = true
      enabled = ${?GAIUS_ORCHESTRATOR_ENABLED}

      # On-demand loading (no auto-start on app launch)
      auto_start = false
      auto_start = ${?GAIUS_ORCHESTRATOR_AUTO_START}

      # Health monitoring
      health_check_interval = 15
      startup_timeout = 120
      max_consecutive_failures = 3
      max_recovery_attempts = 3

      # vLLM defaults
      vllm {
        binary = "vllm"
        binary = ${?GAIUS_VLLM_BINARY}
        gpu_memory_utilization = 0.9
        max_model_len = 32768
      }

      # GPU health thresholds
      thresholds {
        vram_warning_percent = 85
        vram_critical_percent = 95
        temp_warning_c = 75
        temp_critical_c = 85
      }
    }
  }

  # Search configuration
  search {
    hybrid {
      bm25_weight = 0.3
      vector_weight = 0.7
    }
    max_results = 20
  }

  # Worker pool settings
  workers {
    pool_size = 4
    poll_interval = 30
    job_timeout = 300
    batch_size = 10
    max_retries = 3
  }

  # Swarm agent configuration
  swarm {
    enabled = true
    auto_trigger_on_domain = true  # Run swarm when domain changes

    roles = [
      "Leader",
      "Risk",
      "Optimizer",
      "Planner",
      "Critic",
      "Executor",
      "Adversary"
    ]
  }

  # TDA (Topological Data Analysis) settings
  tda {
    enabled = true
    compute_interval_minutes = 60  # Background computation frequency
    projection_method = "umap"  # or "pca" (faster but less accurate)
    max_points = 300  # Subsample to this many points for TDA (giotto-tda is O(n^3))
    # For GPU acceleration: cuML requires CUDA drivers (currently unavailable)
  }

  # UI settings
  ui {
    left_panel_visible = true
    right_panel_visible = true
    view_mode = "go"
    overlay_mode = "none"
    center_panel_mode = "graph"  # graph, think, none
  }

  # Theme configuration
  # Built-in themes: dark, light, terminal, go
  # Or customize individual properties below
  theme {
    name = "dark"
    name = ${?GAIUS_THEME}

    border_style = "solid"  # solid, round, double, heavy, none

    # Semantic colors (use Textual CSS variables or hex)
    primary = "$primary"
    secondary = "$secondary"
    surface = "$surface"
    accent = "$accent"

    # Component-specific colors
    panel_border = "$primary-darken-2"
    header_bg = "$primary-darken-3"
    status_bar_bg = "$primary-darken-3"
  }

  # Startup procedure (like devenv enterShell)
  startup {
    commands = []  # Commands to run on app start
    show_situational = true  # Show situational awareness on startup
  }

  # Situational awareness horizons
  awareness {
    emphasis_hours = 24
    default_horizon_days = 7
    strategic_horizon_days = 90
    secular_horizon_days = 365
  }

  # Background cognition agent
  # Generates thoughts (patterns, connections, curiosities) between sessions
  cognition {
    enabled = true
    enabled = ${?GAIUS_COGNITION_ENABLED}

    content_threshold = 10     # New items before auto-cognition
    time_threshold_hours = 4   # Max hours between cycles
    max_thoughts = 20          # Active thought limit
    greeting_thoughts = 3      # Thoughts to show on startup
    stale_days = 7             # Days before thoughts become stale
    use_llm = true             # Always use LLM for rich thought generation
  }

  # Session lifecycle management
  # Tracks sessions and research threads for continuity
  session {
    enabled = true
    enabled = ${?GAIUS_SESSION_ENABLED}

    gap_hours = 4              # Gap that defines a new session
    track_threads = true       # Auto-detect research threads
    handoff_llm = true         # Use LLM for handoff summaries
    max_threads = 10           # Max active threads to track
  }

  # Background evolution daemon (Agent0-style self-improvement)
  # Runs optimization cycles when GPUs are idle
  evolution {
    enabled = true
    enabled = ${?GAIUS_EVOLUTION_ENABLED}

    # GPU utilization threshold (percent) - run when below this
    idle_threshold = 20
    idle_threshold = ${?GAIUS_EVOLUTION_IDLE_THRESHOLD}

    # Minimum idle duration before starting (seconds)
    min_idle_duration = 30

    # How often to check idle status (seconds)
    poll_interval = 5

    # Candidates to evaluate per optimization cycle
    candidates_per_cycle = 3

    # Maximum cycles per hour (rate limiting)
    max_cycles_per_hour = 10
    max_cycles_per_hour = ${?GAIUS_EVOLUTION_MAX_CYCLES}

    # Minimum training examples required to run optimization
    min_examples = 5

    # Optimization strategy: apo (mutation), gepa (pareto), hybrid
    strategy = "gepa"
    strategy = ${?GAIUS_EVOLUTION_STRATEGY}

    # Minimum improvement percent to save new version
    min_improvement = 5.0

    # Agents to optimize (rotation order)
    agents = ["leader", "risk", "optimizer", "critic", "synthesizer"]
  }

  # Latent collaboration (LatentMAS-style)
  # Enables agents to share embeddings instead of full text
  latent {
    enabled = true
    enabled = ${?GAIUS_LATENT_ENABLED}

    # Qdrant collection for latent thoughts
    collection = "gaius_latent_thoughts"
    collection = ${?GAIUS_LATENT_COLLECTION}

    # Maximum thoughts to keep per domain
    max_thoughts_per_domain = 100

    # Minimum similarity threshold for retrieval
    similarity_threshold = 0.5

    # Whether to clear domain thoughts before each swarm run
    clear_on_run = true
  }

  # OpenTelemetry observability
  telemetry {
    enabled = false
    enabled = ${?GAIUS_TELEMETRY_ENABLED}
    exporter = "console"  # console, otlp
    endpoint = "http://localhost:4317"
    endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    service_name = "gaius"
  }
}
