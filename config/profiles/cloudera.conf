# Cloudera Profile Configuration
# ===============================
# Apache data infrastructure focus (Kudu, Impala, Iceberg, Hive)
# Inherits from base.conf (merged at load time)

gaius {
  profile = "cloudera"

  # Focus on enterprise data infrastructure
  startup {
    commands = [
      "/domain cloudera",
      "/overlay agents"
    ]
    show_situational = true
  }

  # Search tuned for technical documentation
  search {
    hybrid {
      bm25_weight = 0.4
      vector_weight = 0.6
    }
    max_results = 30
  }

  # Subset of agents for technical analysis
  swarm {
    enabled = true
    auto_trigger_on_domain = true
    roles = [
      "Leader",
      "Planner",
      "Critic",
      "Executor"
    ]
  }

  # Custom awareness horizons for enterprise context
  awareness {
    emphasis_hours = 48
    default_horizon_days = 14
    strategic_horizon_days = 180
  }
}
