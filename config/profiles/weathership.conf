# Weathership Profile Configuration
# ==================================
# Research focus: distributed systems, synthetic biology, philosophy
# Inherits from base.conf (merged at load time)

gaius {
  profile = "weathership"

  # Research-oriented startup
  startup {
    commands = [
      "/domain research",
      "/situational"
    ]
    show_situational = true
  }

  # Search tuned for academic/research content
  search {
    hybrid {
      bm25_weight = 0.25
      vector_weight = 0.75
    }
    max_results = 25
  }

  # Full agent complement for deep analysis
  swarm {
    enabled = true
    auto_trigger_on_domain = true
    roles = [
      "Leader",
      "Risk",
      "Optimizer",
      "Planner",
      "Critic",
      "Executor",
      "Adversary"
    ]
  }

  # Use COT reflection for deeper reasoning
  inference {
    optillm {
      technique = "cot_reflection"
    }
  }

  # TDA more frequent for research context
  tda {
    compute_interval_minutes = 30
    projection_method = "umap"
  }

  # Research-oriented awareness horizons
  awareness {
    emphasis_hours = 24
    default_horizon_days = 7
    strategic_horizon_days = 90
    secular_horizon_days = 365
  }
}
