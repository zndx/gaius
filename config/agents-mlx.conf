# Gaius MLX Agent Configuration (MacBook Pro: Apple Silicon)
# ========================================================
# MLX/Exo-based agents for Apple Silicon inference with external API routing.
# This file is included by agents.conf when GAIUS_PLATFORM=mlx.
#
# Platform: macOS with Apple Silicon (M1/M2/M3/M4)
# Hardware: Single MacBook Pro with unified memory
#
# Design Philosophy:
# - Local exo/MLX agents handle lightweight/generic tasks (fast, swarm, embedding)
#   - Ministral 3 (3B/8B): Fast edge inference with vision capabilities
#   - Qwen3-1.7B: CLT-ready swarm agents for interpretability research
# - Cerebras GLM-4.7: Orchestration + Thinking (with interleaved thinking traces)
# - xAI Grok 4.1 Fast: Deep reasoning with 2M token context window
# - This maximizes MacBook battery life while maintaining full functionality

# ============================================================================
# Local MLX Agents - Run on Apple Silicon unified memory
# ============================================================================

gaius.agents.mlx {

  # --------------------------------------------------------------------------
  # Fast Local Agent - Quick responses, swarm coordination
  # --------------------------------------------------------------------------
  # Ministral 3 3B - tiny but capable edge model with vision (Dec 2025)
  # Fits in <8GB RAM when quantized, ideal for fast local inference
  fast {
    alias = "fast"
    description = "Quick responses for simple queries (local MLX - Ministral 3 3B)"
    model = "mlx-community/Ministral-3-3B-Instruct-2512"
    backend = "exo"
    resources {
      gpus = 0                      # MLX uses unified memory, not discrete GPUs
      memory-gb = 4                 # Tiny footprint in bf16
      context-length = 32768
    }
  }

  # --------------------------------------------------------------------------
  # Local Instruct Agent - Instruction following for moderate tasks
  # --------------------------------------------------------------------------
  # Ministral 3 8B 4-bit - more capable edge model with vision
  # Fits in ~5GB with 4-bit quantization
  instruct-local {
    alias = "instruct-local"
    description = "Local instruction following for moderate tasks (Ministral 3 8B)"
    model = "mlx-community/Ministral-3-8B-Instruct-2512-4bit"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 5                 # 4-bit quantization
      context-length = 32768
    }
  }

  # --------------------------------------------------------------------------
  # Fast Remote Agent - Quick responses via Bytez API
  # --------------------------------------------------------------------------
  # Same Mistral-7B-Instruct model used in CUDA config, hosted on Bytez
  # Use when local MLX is busy or for consistent behavior with Tinybox
  fast-remote {
    alias = "fast-remote"
    description = "Quick responses via Bytez API (Mistral 7B Instruct)"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "bytez"
    resources {
      gpus = 0
      memory-gb = 0                 # No local memory - API call only
      context-length = 32768
    }
    endpoint {
      api-key = ${?BYTEZ_API_KEY}
      base-url = "https://api.bytez.com/models/v2"
    }
  }

  # --------------------------------------------------------------------------
  # Embedding Agent - Semantic search and retrieval
  # --------------------------------------------------------------------------
  embedding {
    alias = "embedding"
    description = "Local embeddings for semantic search"
    model = "mlx-community/nomic-embed-text-v1.5-GGUF"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
    endpoint {
      embedding-dim = 768
      task = "embed"
    }
  }

  # ============================================================================
  # External API Agents - Heavy workloads routed to cloud providers
  # ============================================================================
  # These agents use external APIs to offload compute-intensive tasks.
  # This preserves MacBook battery and provides access to larger models.

  # --------------------------------------------------------------------------
  # Orchestrator - Request routing via Cerebras GLM-4.7
  # --------------------------------------------------------------------------
  orchestrator {
    alias = "orchestrator"
    description = "Routes requests to appropriate models (Cerebras GLM-4.7)"
    model = "zai-glm-4.7"
    backend = "cerebras"
    resources {
      gpus = 0
      memory-gb = 0                 # No local memory - API call only
      context-length = 131072
    }
    endpoint {
      api-key = ${?CEREBRAS_API_KEY}
      base-url = "https://api.cerebras.ai/v1"
    }
  }

  # --------------------------------------------------------------------------
  # Reasoning Agent - Deep analysis via xAI Grok 4.1 Fast
  # --------------------------------------------------------------------------
  # Grok 4.1 Fast with reasoning enabled - 2M context window!
  # Chain-of-thought reasoning with reasoning tokens, vision, audio, web search
  reasoning {
    alias = "reasoning"
    description = "Deep reasoning and analysis (xAI Grok 4.1 Fast)"
    model = "grok-4-1-fast-reasoning"
    backend = "xai"
    resources {
      gpus = 0
      memory-gb = 0
      context-length = 2000000      # 2M token context window
    }
    endpoint {
      api-key = ${?XAI_API_KEY}
      base-url = "https://api.x.ai/v1"
      reasoning-enabled = true      # Enable chain-of-thought reasoning
    }
  }

  # --------------------------------------------------------------------------
  # Coding Agent - Code generation via external API
  # --------------------------------------------------------------------------
  coding {
    alias = "coding"
    description = "Code generation and structured output (external API)"
    model = "qwen-3-32b"
    backend = "cerebras"
    resources {
      gpus = 0
      memory-gb = 0
      context-length = 32768
    }
    endpoint {
      api-key = ${?CEREBRAS_API_KEY}
      base-url = "https://api.cerebras.ai/v1"
    }
  }

  # --------------------------------------------------------------------------
  # Thinking Agent - Extended reasoning with thinking traces (GLM-4.7)
  # --------------------------------------------------------------------------
  # GLM-4.7 on Cerebras supports "interleaved thinking" with parameters:
  # - disable_reasoning: Set to False to enable reasoning traces
  # - clear_thinking: Set to False to preserve thinking state across turns
  thinking {
    alias = "thinking"
    description = "Extended reasoning with thinking traces (Cerebras GLM-4.7)"
    model = "zai-glm-4.7"
    backend = "cerebras"
    resources {
      gpus = 0
      memory-gb = 0
      context-length = 131072
    }
    endpoint {
      api-key = ${?CEREBRAS_API_KEY}
      base-url = "https://api.cerebras.ai/v1"
      # GLM-4.7 thinking configuration
      disable-reasoning = false     # Enable interleaved thinking
      clear-thinking = false        # Preserve thinking state across turns
    }
  }

  # ============================================================================
  # Swarm Agents - Local coordination with MLX
  # ============================================================================
  # Swarm agents run locally for lower latency during evolution cycles.
  # Using Qwen3-1.7B bf16 - CLT-ready for interpretability research.
  # Qwen3 has thinking capabilities enabled by default (like QwQ-32B).

  leader {
    alias = "leader"
    description = "Swarm leader for synthesis and coordination (local MLX, CLT-ready)"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }

  risk {
    alias = "risk"
    description = "Risk analysis and edge case detection (local MLX, CLT-ready)"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }

  critic {
    alias = "critic"
    description = "Quality evaluation and scoring (local MLX, CLT-ready)"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }

  optimizer {
    alias = "optimizer"
    description = "Prompt optimization and refinement (local MLX, CLT-ready)"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }

  domain {
    alias = "domain"
    description = "Domain-specific knowledge specialist (local MLX, CLT-ready)"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }

  synthesis {
    alias = "synthesis"
    description = "Cross-domain synthesis and pattern detection (local MLX, CLT-ready)"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }

  validator {
    alias = "validator"
    description = "Output validation and consistency checking (local MLX, CLT-ready)"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }

  # ============================================================================
  # CLT-Inspectable Agents - Local for interpretability research
  # ============================================================================
  # Dedicated CLT agents using Qwen3-1.7B for maximum interpretability.
  # Note: Swarm agents above are also CLT-ready with the same model.

  interpretable {
    alias = "interpretable"
    description = "CLT-enabled agent for inspectable reasoning"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 32768
    }
  }

  leader-clt {
    alias = "leader-clt"
    description = "Swarm leader with CLT-inspectable features"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }

  critic-clt {
    alias = "critic-clt"
    description = "Quality evaluation with CLT-inspectable features"
    model = "mlx-community/Qwen3-1.7B-bf16"
    backend = "exo"
    resources {
      gpus = 0
      memory-gb = 2
      context-length = 8192
    }
  }
}

# ============================================================================
# MLX Backend Configuration
# ============================================================================

gaius.inference.backends.mlx {
  enabled = true
  base-url = "http://localhost:52415/v1"
  base-url = ${?EXO_API_URL}
}

# External API backends
gaius.inference.backends.xai {
  enabled = true
  enabled = ${?XAI_API_KEY}        # Only enable if API key is set
  base-url = "https://api.x.ai/v1"
}

gaius.inference.backends.cerebras {
  enabled = true
  enabled = ${?CEREBRAS_API_KEY}   # Only enable if API key is set
  base-url = "https://api.cerebras.ai/v1"
}

gaius.inference.backends.bytez {
  enabled = true
  enabled = ${?BYTEZ_API_KEY}      # Only enable if API key is set
  base-url = "https://api.bytez.com/models/v2"
}

# ============================================================================
# MLX Resource Configuration
# ============================================================================

gaius.resources.mlx {
  # Unified memory management for Apple Silicon
  memory {
    # Total unified memory available (auto-detected at runtime)
    total-gb = 32
    total-gb = ${?GAIUS_UNIFIED_MEMORY_GB}

    # Reserved for system and other apps
    reserved-gb = 8

    # Maximum concurrent models (memory-bound)
    max-concurrent-models = 3
  }

  scheduling {
    # Prefer sequential model loading to avoid memory pressure
    prefer-sequential = true

    # Model swap timeout (seconds)
    swap-timeout = 30

    # Allow hot-swapping models based on usage patterns
    allow-hot-swap = true
  }
}

# ============================================================================
# MLX Startup Configuration
# ============================================================================

gaius.startup.mlx {
  # Preload commonly used local agents
  preload-endpoints = ["fast", "embedding"]
  preload-endpoints = ${?GAIUS_PRELOAD_ENDPOINTS}

  # Verify external API connectivity on startup
  verify-external-apis = true
}
