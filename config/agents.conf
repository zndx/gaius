# Gaius Engine Agent Configuration
# ==================================
# Platform-aware agent configuration dispatcher.
#
# This file dispatches to platform-specific agent configs based on GAIUS_PLATFORM:
#   - cuda (default): NVIDIA GPU inference via vLLM (Tinybox: 6x RTX 4090)
#   - mlx: Apple Silicon inference via exo/MLX (MacBook Pro)
#
# Include base config for shared settings
include "base.conf"

# ============================================================================
# Engine Configuration (shared across all platforms)
# ============================================================================

gaius.engine {
  # Aeron IPC configuration
  aeron {
    directory = "/dev/shm/gaius-aeron"
    directory = ${?GAIUS_AERON_DIR}

    # Stream IDs
    request_stream = 100
    response_stream = 101
    event_stream = 102
    health_stream = 103
  }

  # Health broadcast interval (milliseconds)
  health_interval_ms = 1000

  # OpenTelemetry (enabled by default, disable via OTEL_SDK_DISABLED=true)
  telemetry {
    exporter = "otlp"  # otlp or console
    exporter = ${?OTEL_TRACES_EXPORTER}
    endpoint = "http://localhost:4317"
    endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    service_name = "gaius-engine"
    sampling_rate = 0.01  # 1% in production
  }
}

# ============================================================================
# Platform Detection and Dispatch
# ============================================================================
# GAIUS_PLATFORM determines which agent configuration is loaded:
#   - cuda (default): Include agents-cuda.conf for NVIDIA GPUs
#   - mlx: Include agents-mlx.conf for Apple Silicon
#
# The platform can be overridden for testing:
#   GAIUS_PLATFORM=mlx TINYBOX_PASSTHROUGH=true  # Test MLX routing on Tinybox

gaius.platform {
  # Platform identifier (cuda | mlx)
  # Defaults to cuda for backwards compatibility
  id = "cuda"
  id = ${?GAIUS_PLATFORM}

  # Feature flags for development/testing
  tinybox-passthrough = false
  tinybox-passthrough = ${?TINYBOX_PASSTHROUGH}
}

# ============================================================================
# Shared Inference Backend Configuration
# ============================================================================

gaius.inference.backends {
  # optillm configuration (used on both platforms for swarm optimization)
  optillm {
    enabled = true
    api-key = ${?OPTILLM_API_KEY}
    base-url = "http://localhost:8000"
    base-url = ${?OPTILLM_URL}
    default-technique = "cot_reflection"
    timeout = 120

    # Use gunicorn WSGI server (production-ready)
    use-gunicorn = true
    use-gunicorn = ${?OPTILLM_USE_GUNICORN}

    # Gunicorn WSGI server settings
    gunicorn {
      workers = 4              # Throughput optimized: 4 workers
      workers = ${?OPTILLM_WORKERS}
      worker-class = "gthread" # Thread-based for concurrent requests
      threads = 2              # 4 workers × 2 threads = 8 concurrent
      timeout = 120            # Long timeout for expensive techniques
      graceful-timeout = 30    # Time for graceful worker shutdown
      max-requests = 1000      # Worker recycling to prevent memory leaks
      max-requests-jitter = 50 # Add variance to prevent thundering herd
      config-dir = "/tmp/gaius"  # Directory for generated config files
      config-dir = ${?OPTILLM_CONFIG_DIR}
    }
  }

  # External API backends (shared across platforms)
  cerebras {
    enabled = true
    api-key = ${?CEREBRAS_API_KEY}
    base-url = "https://api.cerebras.ai/v1"
    timeout = 60
  }

  xai {
    enabled = true
    api-key = ${?XAI_API_KEY}
    base-url = "https://api.x.ai/v1"
    timeout = 60
  }
}

# ============================================================================
# Evolution Daemon Settings (shared across platforms)
# ============================================================================

gaius.evolution {
  enabled = true
  enabled = ${?ENABLE_EVOLUTION}

  # Agent rotation order (uses platform-specific agents)
  rotation = ["leader", "risk", "critic", "optimizer", "domain", "synthesis", "validator"]

  # Optimization settings
  strategy = "apo"  # apo | gepa | hybrid
  candidates-per-iteration = 5
  max-iterations = 3

  # Resource thresholds (platform-dependent interpretation)
  # CUDA: min-idle-gpus refers to NVIDIA GPUs
  # MLX: min-idle-gpus=0 (ignored), uses memory-gb thresholds
  min-idle-gpus = 2
  idle-timeout-seconds = 300

  # Parallel evolution
  parallel {
    enabled = false
    enabled = ${?ENABLE_PARALLEL_EVOLUTION}
    max-concurrent = 6
  }
}

# ============================================================================
# Startup Configuration (shared with platform-specific overrides)
# ============================================================================

gaius.startup {
  # Clean start: kill stale processes and start fresh on engine boot
  clean-start = true
  clean-start = ${?GAIUS_CLEAN_START}

  # Auto-start evolution daemon if evolution.enabled = true
  auto-start-evolution = true
  auto-start-evolution = ${?GAIUS_AUTO_EVOLUTION}

  # Auto-start cognition daemon (processes pg_cron scheduled tasks)
  auto-start-cognition = true
  auto-start-cognition = ${?GAIUS_AUTO_COGNITION}

  # Auto-restart failed endpoints (max attempts before giving up)
  auto-restart-failed = true
  auto-restart-failed = ${?GAIUS_AUTO_RESTART}
  max-restart-attempts = 3

  # Auto-resume ambient workload after engine restart
  auto-resume-ambient = true
  auto-resume-ambient = ${?GAIUS_AUTO_RESUME_AMBIENT}
}

# ============================================================================
# Platform-Specific Includes
# ============================================================================
# HOCON include directives are processed at parse time, so we include both
# platform configs and rely on the agent code to select the appropriate
# namespace based on gaius.platform.id at runtime.
#
# Platform-specific configs define agents under namespaced keys:
#   - agents-cuda.conf: gaius.agents.cuda.{agent}
#   - agents-mlx.conf:  gaius.agents.mlx.{agent}
#
# The engine's config loader will flatten gaius.agents.{platform} → gaius.agents

include "agents-cuda.conf"
include "agents-mlx.conf"

# ============================================================================
# Capability-Based Routing (optional, future)
# ============================================================================
# These files define capability metadata with platform-specific implementations.
# Agents are selected based on capability requirements rather than explicit names.

include "capabilities/orchestration.conf"
include "capabilities/reasoning.conf"
include "capabilities/coding.conf"
include "capabilities/fast.conf"
include "capabilities/embedding.conf"
include "capabilities/swarm.conf"
include "capabilities/interpretable.conf"
