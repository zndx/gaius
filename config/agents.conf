# Gaius Engine Agent Configuration
# ==================================
# Agent-model pairings with resource requirements for gaius-engine daemon.
# This file is the source of truth for agent specifications.
#
# Include base config for shared settings
include "base.conf"

gaius.engine {
  # Aeron IPC configuration
  aeron {
    directory = "/dev/shm/gaius-aeron"
    directory = ${?GAIUS_AERON_DIR}

    # Stream IDs
    request_stream = 100
    response_stream = 101
    event_stream = 102
    health_stream = 103
  }

  # Health broadcast interval (milliseconds)
  health_interval_ms = 1000

  # OpenTelemetry (enabled by default, disable via OTEL_SDK_DISABLED=true)
  telemetry {
    exporter = "otlp"  # otlp or console
    exporter = ${?OTEL_TRACES_EXPORTER}
    endpoint = "http://localhost:4317"
    endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    service_name = "gaius-engine"
    sampling_rate = 0.01  # 1% in production
  }
}

# Agent definitions with model pairings and resource requirements
gaius.agents {

  # ============================================================================
  # Core Agents - Primary inference workloads
  # ============================================================================

  orchestrator {
    alias = "orchestrator"
    description = "Routes requests to appropriate models and manages inference flow"
    model = "nvidia/Orchestrator-8B"
    backend = "vllm"
    resources {
      gpus = 2                    # Needs 2 GPUs for 32K context with KV cache
      vram-gb = 40                # 20GB x 2 GPUs
      context-length = 32768
    }
    endpoint {
      tensor-parallel = 2         # Distribute across 2 GPUs
    }
  }

  reasoning {
    alias = "reasoning"
    description = "Deep reasoning and analysis with extended thinking"
    # DeepSeek-R1-Distill-Qwen-32B: SOTA reasoning via R1 distillation
    # Alternative: Qwen/QwQ-32B (requires download)
    model = "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
    backend = "vllm"
    resources {
      gpus = 4                    # 4-GPU tensor parallel for intensive reasoning
      vram-gb = 96                # 24GB × 4 GPUs
      context-length = 32768      # 32K context (stable with 4x RTX 4090)
    }
    endpoint {
      tensor-parallel = 4         # Distribute across 4 GPUs
      max-num-seqs = 64           # Increased concurrency for 32K context
    }
  }

  coding {
    alias = "coding"
    description = "Code generation and structured output"
    # DeepSeek Coder 6.7B - efficient code model that fits on 1 GPU
    # Larger models (Qwen2.5-Coder-32B) require PP=3 which conflicts with orchestrator
    model = "deepseek-ai/deepseek-coder-6.7b-instruct"
    backend = "vllm"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 16384
    }
  }

  fast {
    alias = "fast"
    description = "Quick responses for simple queries - uses thinking endpoint"
    # Shares the thinking endpoint - no dedicated GPU
    model = "Qwen/Qwen3.8-27B"
    backend = "vllm"
    capabilities = ["thinking", "vision"]
    resources {
      gpus = 0  # Uses shared thinking endpoint
      context-length = 262144
    }
  }

  # ============================================================================
  # On-Demand Capability Agents - Dynamically scheduled via capability routing
  # ============================================================================

  open-thinking {
    alias = "open-thinking"
    # Olmo 3 ships the entire model flow (training data, code, checkpoints),
    # not just weights. That is the capability label.
    description = "Olmo 3-32B-Think — open-thinking (full model flow is public)"
    model = "allenai/Olmo-3-32B-Think"
    capabilities = ["open-thinking"]
    backend = "vllm"
    resources {
      gpus = 4
      vram-gb = 96
      context-length = 65536
    }
    endpoint {
      tensor-parallel = 4
      max-num-seqs = 16
      dtype = "bfloat16"
      enforce-eager = true
      gpu-memory-utilization = 0.95
      swap-space = 8
      task = "generate"
    }
  }

  thinking {
    alias = "thinking"
    description = "Qwen3.8-27B — thinking (default) then vision; native BF16, 262k context"
    model = "Qwen/Qwen3.8-27B"
    backend = "vllm"
    # Ordered: thinking first, vision next. This is the preload / Ambient endpoint.
    capabilities = ["thinking", "vision", "instruct"]  # instruct = same model at effort low (operating profile); thinking stays primary, vision second
    resources {
      gpus = 4
      vram-gb = 96
      context-length = 262144
    }
    endpoint {
      tensor-parallel = 4
      max-num-seqs = 8
      dtype = "bfloat16"
      enforce-eager = true
      gpu-memory-utilization = 0.90
      swap-space = 8
      task = "generate"
      extra-args = [
        "--trust-remote-code",
        "--enable-prefix-caching",
        "--reasoning-parser", "qwen3",
        "--enable-auto-tool-choice",
        "--tool-call-parser", "qwen3_coder",
        "--default-chat-template-kwargs",
        """{"enable_thinking":true,"preserve_thinking":true}"""
      ]
    }
  }

  embedding {
    alias = "embedding"
    description = "ColBERT-Zero open late-interaction (MaxSim, 128-d, public data)"
    # Fully open: weights, training data (Nomic-embed mix), code (PyLate).
    # Contrastive pre-training is multi-vector from the start, not a dense afterthought.
    # Text only. Vision is Qwen3.8-27B. New Qdrant collection (index is not ColNomic).
    model = "lightonai/ColBERT-Zero"
    backend = "colbert"
    capabilities = ["open-embedding"]
    resources {
      gpus = 1
      vram-gb = 2
      context-length = 512
    }
    endpoint {
      embedding-dim = 128  # ColNomic projects to 128-dim per token
      task = "embed"
    }
  }

  # ============================================================================
  # Evolution Swarm Agents - Used during overnight optimization
  # ============================================================================

  leader {
    alias = "leader"
    description = "Swarm leader for synthesis and coordination"
    # Uses thinking endpoint via optillm
    model = "Qwen/Qwen3.8-27B"
    backend = "optillm"
    optillm-technique = "cot_reflection"
    resources {
      gpus = 0  # Uses shared thinking endpoint
      context-length = 32768
    }
  }

  risk {
    alias = "risk"
    description = "Risk analysis and edge case detection"
    model = "Qwen/Qwen3.8-27B"
    backend = "optillm"
    optillm-technique = "bon"
    resources {
      gpus = 0
      context-length = 32768
    }
  }

  critic {
    alias = "critic"
    description = "Quality evaluation and scoring"
    model = "Qwen/Qwen3.8-27B"
    backend = "optillm"
    optillm-technique = "moa"
    resources {
      gpus = 0
      context-length = 32768
    }
  }

  optimizer {
    alias = "optimizer"
    description = "Prompt optimization and refinement"
    model = "Qwen/Qwen3.8-27B"
    backend = "optillm"
    optillm-technique = "leap"
    resources {
      gpus = 0
      context-length = 32768
    }
  }

  domain {
    alias = "domain"
    description = "Domain-specific knowledge specialist"
    model = "Qwen/Qwen3.8-27B"
    backend = "optillm"
    optillm-technique = "cot_reflection"
    resources {
      gpus = 0
      context-length = 32768
    }
  }

  synthesis {
    alias = "synthesis"
    description = "Cross-domain synthesis and pattern detection"
    model = "Qwen/Qwen3.8-27B"
    backend = "optillm"
    optillm-technique = "mcts"
    resources {
      gpus = 0
      context-length = 32768
    }
  }

  validator {
    alias = "validator"
    description = "Output validation and consistency checking"
    model = "Qwen/Qwen3.8-27B"
    backend = "optillm"
    optillm-technique = "pvg"
    resources {
      gpus = 0
      context-length = 32768
    }
  }

  # ============================================================================
  # Ask light (1 GPU) / medium (2 GPU) on devices 4–5. All-or-nothing:
  #   * one model owns a whole GPU — never pack two models on one card
  #     even if VRAM is free;
  #   * a medium model takes as many *whole* GPUs as tensor-parallel needs.
  # ============================================================================

  interpretable {
    alias = "interpretable"
    description = "Ask replica A: Qwen3-1.7B on one whole leftover GPU"
    model = "Qwen/Qwen3-1.7B"
    backend = "vllm"
    capabilities = ["ask"]
    resources {
      gpus = 1
      vram-gb = 24
      context-length = 32768
    }
    endpoint {
      tensor-parallel = 1
      max-num-seqs = 16
      gpu-memory-utilization = 0.90
    }
  }

  interpretable-b {
    alias = "interpretable-b"
    description = "Ask replica B: Qwen3-1.7B on the other whole leftover GPU"
    model = "Qwen/Qwen3-1.7B"
    backend = "vllm"
    capabilities = ["ask"]
    resources {
      gpus = 1
      vram-gb = 24
      context-length = 32768
    }
    endpoint {
      tensor-parallel = 1
      max-num-seqs = 16
      gpu-memory-utilization = 0.90
    }
  }

  clt {
    alias = "clt"
    description = "BluelightAI CLT worker — exclusive whole leftover GPU (not beside a 1.7B)"
    model = "Qwen/Qwen3-1.7B"
    backend = "clt"
    resources {
      gpus = 1
      vram-gb = 24
      context-length = 8192
    }
  }

  ask-sae {
    alias = "ask-sae"
    description = "Ask Qwen3.5-9B-Base + SAE — two whole leftover GPUs (TP=2)"
    model = "Qwen/Qwen3.5-9B-Base"
    backend = "vllm"
    capabilities = ["ask"]
    resources {
      gpus = 2
      vram-gb = 24
      context-length = 32768
    }
    endpoint {
      tensor-parallel = 2
      max-num-seqs = 8
      dtype = "bfloat16"
      gpu-memory-utilization = 0.90
    }
  }

  # Swarm agents using interpretable model (for CLT analysis)
  leader-clt {
    alias = "leader-clt"
    description = "Swarm leader with CLT-inspectable features"
    model = "Qwen/Qwen3-1.7B"
    backend = "optillm"
    optillm-technique = "cot_reflection"
    resources {
      gpus = 1
      vram-gb = 8
      context-length = 8192
    }
  }

  critic-clt {
    alias = "critic-clt"
    description = "Quality evaluation with CLT-inspectable features"
    model = "Qwen/Qwen3-1.7B"
    backend = "optillm"
    optillm-technique = "moa"
    resources {
      gpus = 1
      vram-gb = 8
      context-length = 8192
    }
  }

  # ============================================================================
  # External API Agents - Remote inference via Cerebras, XAI, etc.
  # ============================================================================
  # These agents route through BackendRouter._route_to_external() which uses
  # ExternalInferenceRouter for budget tracking, exchange capture, and metrics.
  # Federation-ready: requests can be routed to remote engine nodes.

  cerebras-glm {
    alias = "cerebras-glm"
    description = "Cerebras GLM 4.7 for structured YAML generation and fast inference"
    model = "zai-glm-4.7"
    backend = "cerebras"
    resources {
      gpus = 0                    # Remote API - no local GPU
      context-length = 8192
    }
  }

  xai-grok-fast {
    alias = "xai-grok-fast"
    description = "XAI Grok 4.1 Fast for error diagnosis and quick analysis"
    model = "grok-4-1-fast"
    backend = "xai"
    resources {
      gpus = 0                    # Remote API - no local GPU
      context-length = 131072     # 128K context
    }
  }
}

# Inference backend configuration
gaius.inference.backends {

  # optillm configuration
  optillm {
    enabled = true
    api-key = ${?OPTILLM_API_KEY}
    base-url = "http://localhost:8000"
    base-url = ${?OPTILLM_URL}
    default-technique = "cot_reflection"
    timeout = 600              # Wall-clock safety net (idle-timeout is the real guard)
    idle-timeout = 120         # No vLLM token progress for this long = stalled

    # Use gunicorn WSGI server (production-ready)
    use-gunicorn = true
    use-gunicorn = ${?OPTILLM_USE_GUNICORN}

    # Gunicorn WSGI server settings
    gunicorn {
      workers = 4              # Throughput optimized: 4 workers
      workers = ${?OPTILLM_WORKERS}
      worker-class = "gthread" # Thread-based for concurrent requests
      threads = 2              # 4 workers × 2 threads = 8 concurrent
      timeout = 600            # Wall-clock safety net (matches optillm.timeout)
      graceful-timeout = 30    # Time for graceful worker shutdown
      max-requests = 1000      # Worker recycling to prevent memory leaks
      max-requests-jitter = 50 # Add variance to prevent thundering herd
      config-dir = "/tmp/gaius"  # Directory for generated config files
      config-dir = ${?OPTILLM_CONFIG_DIR}
    }
  }

  # vLLM configuration
  vllm {
    binary = "vllm"
    binary = ${?VLLM_BINARY}
    gpu-memory-utilization = 0.9
    max-model-len = 32768
    dtype = "auto"
    # Additional vLLM arguments
    extra-args = []
  }
}

# GPU inventory for resource management
gaius.resources {
  gpus {
    total = 6
    total = ${?GPU_COUNT}
    reserved = []  # GPU IDs to exclude from scheduling
  }

  # Gang scheduling settings (future)
  scheduling {
    # Prefer contiguous GPU allocation for NVLink
    prefer-contiguous = true
    # Maximum time to wait for resources (seconds)
    allocation-timeout = 30
    # Allow preemption of lower-priority workloads
    allow-preemption = false
  }
}

# Evolution daemon settings
gaius.evolution {
  enabled = true
  enabled = ${?ENABLE_EVOLUTION}

  # Agent rotation order
  rotation = ["leader", "risk", "critic", "optimizer", "domain", "synthesis", "validator"]

  # Optimization settings
  strategy = "apo"  # apo | gepa | hybrid
  candidates-per-iteration = 5
  max-iterations = 3

  # Resource thresholds
  min-idle-gpus = 2
  idle-timeout-seconds = 300

  # Parallel evolution (uses evo0-evo5 endpoints)
  parallel {
    enabled = false
    enabled = ${?ENABLE_PARALLEL_EVOLUTION}
    max-concurrent = 6
  }
}

# Startup configuration - controls autonomous engine behavior
gaius.startup {
  # Clean start: kill stale processes and start fresh on engine boot
  clean-start = true
  clean-start = ${?GAIUS_CLEAN_START}

  # Endpoints to preload on startup (empty = lazy start on demand)
  # Hard requirement: thinking (Qwen3.8-27B TP=4) must become HEALTHY first.
  # Orchestrator starts after thinking is up (Ambient / on demand).
  # Embedding is ColBERT-Zero (pylate), loaded on demand — not vLLM.
  # Metaflow clt_skos_label Complete(capability=thinking). Empty preload was
  # an outage: label ticks fail-fast when thinking is not HEALTHY.
  preload-endpoints = ["thinking"]
  preload-endpoints = ${?GAIUS_PRELOAD_ENDPOINTS}

  # Auto-start evolution daemon if evolution.enabled = true
  auto-start-evolution = true
  auto-start-evolution = ${?GAIUS_AUTO_EVOLUTION}

  # Auto-start cognition daemon (processes pg_cron scheduled tasks)
  auto-start-cognition = true
  auto-start-cognition = ${?GAIUS_AUTO_COGNITION}

  # Auto-restart failed endpoints (max attempts before giving up)
  auto-restart-failed = true
  auto-restart-failed = ${?GAIUS_AUTO_RESTART}
  max-restart-attempts = 3

  # Auto-resume ambient workload after engine restart
  # If the ambient daemon was running when the engine stopped, resume it on startup
  auto-resume-ambient = true
  auto-resume-ambient = ${?GAIUS_AUTO_RESUME_AMBIENT}

  # Start Ambient unless the operator explicitly stopped it
  auto-start-ambient = true
  auto-start-ambient = ${?GAIUS_AUTO_START_AMBIENT}
}
