# Gaius CUDA Agent Configuration (Tinybox: 6x RTX 4090)
# ======================================================
# CUDA/vLLM-based agents for NVIDIA GPU inference.
# This file is included by agents.conf when GAIUS_PLATFORM=cuda (default).
#
# Platform: Linux with NVIDIA GPUs
# Hardware: Tinybox (6x RTX 4090, 144GB VRAM total)

# ============================================================================
# Core CUDA Agents - Primary inference workloads
# ============================================================================

gaius.agents.cuda {

  orchestrator {
    alias = "orchestrator"
    description = "Routes requests to appropriate models and manages inference flow"
    model = "nvidia/Orchestrator-8B"
    backend = "vllm"
    resources {
      gpus = 2                    # Needs 2 GPUs for 32K context with KV cache
      vram-gb = 40                # 20GB x 2 GPUs
      context-length = 32768
    }
    endpoint {
      tensor-parallel = 2         # Distribute across 2 GPUs
    }
  }

  reasoning {
    alias = "reasoning"
    description = "Deep reasoning and analysis with extended thinking"
    model = "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
    backend = "vllm"
    resources {
      gpus = 4                    # 4-GPU tensor parallel for intensive reasoning
      vram-gb = 96                # 24GB × 4 GPUs
      context-length = 32768      # 32K context (stable with 4x RTX 4090)
    }
    endpoint {
      tensor-parallel = 4         # Distribute across 4 GPUs
      max-num-seqs = 64           # Increased concurrency for 32K context
    }
  }

  coding {
    alias = "coding"
    description = "Code generation and structured output"
    model = "deepseek-ai/deepseek-coder-6.7b-instruct"
    backend = "vllm"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 16384
    }
  }

  fast {
    alias = "fast"
    description = "Quick responses for simple queries"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "vllm"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 32768
    }
  }

  # ============================================================================
  # On-Demand Capability Agents - Dynamically scheduled
  # ============================================================================

  thinking {
    alias = "thinking"
    description = "Extended reasoning with thinking traces (OLMo3-32B-Think, 64K context)"
    model = "allenai/Olmo-3-32B-Think"
    backend = "vllm"
    resources {
      gpus = 4
      vram-gb = 96
      context-length = 65536
    }
    endpoint {
      tensor-parallel = 4
      max-num-seqs = 16
      dtype = "bfloat16"
      enforce-eager = true
      gpu-memory-utilization = 0.95
      swap-space = 8
      task = "generate"
    }
  }

  instruct {
    alias = "instruct"
    description = "Long-context instruction following (Devstral-Small-24B, 256K context)"
    model = "mistralai/Devstral-Small-2-24B-Instruct-2512"
    backend = "vllm"
    resources {
      gpus = 4
      vram-gb = 96
      context-length = 262144
    }
    endpoint {
      tensor-parallel = 4
      max-num-seqs = 32
      dtype = "auto"
      enforce-eager = true
      gpu-memory-utilization = 0.95
      swap-space = 8
      task = "generate"
    }
  }

  embedding {
    alias = "embedding"
    description = "Multimodal ColNomic embeddings for text, vision, and document retrieval"
    model = "nomic-ai/colnomic-embed-multimodal-7b"
    backend = "colpali"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 8192
    }
    endpoint {
      embedding-dim = 128
      task = "embed"
    }
  }

  # ============================================================================
  # Evolution Swarm Agents - Used during overnight optimization
  # ============================================================================

  leader {
    alias = "leader"
    description = "Swarm leader for synthesis and coordination"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "optillm"
    optillm-technique = "cot_reflection"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 8192
    }
  }

  risk {
    alias = "risk"
    description = "Risk analysis and edge case detection"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "optillm"
    optillm-technique = "bon"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 8192
    }
  }

  critic {
    alias = "critic"
    description = "Quality evaluation and scoring"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "optillm"
    optillm-technique = "moa"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 8192
    }
  }

  optimizer {
    alias = "optimizer"
    description = "Prompt optimization and refinement"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "optillm"
    optillm-technique = "leap"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 8192
    }
  }

  domain {
    alias = "domain"
    description = "Domain-specific knowledge specialist"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "optillm"
    optillm-technique = "cot_reflection"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 8192
    }
  }

  synthesis {
    alias = "synthesis"
    description = "Cross-domain synthesis and pattern detection"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "optillm"
    optillm-technique = "mcts"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 8192
    }
  }

  validator {
    alias = "validator"
    description = "Output validation and consistency checking"
    model = "mistralai/Mistral-7B-Instruct-v0.3"
    backend = "optillm"
    optillm-technique = "pvg"
    resources {
      gpus = 1
      vram-gb = 16
      context-length = 8192
    }
  }

  # ============================================================================
  # Interpretable Swarm Agents - CLT inspection via BluelightAI
  # ============================================================================

  interpretable {
    alias = "interpretable"
    description = "CLT-enabled agent for inspectable reasoning"
    model = "Qwen/Qwen3-1.7B"
    backend = "vllm"
    resources {
      gpus = 1
      vram-gb = 8
      context-length = 32768
    }
  }

  leader-clt {
    alias = "leader-clt"
    description = "Swarm leader with CLT-inspectable features"
    model = "Qwen/Qwen3-1.7B"
    backend = "optillm"
    optillm-technique = "cot_reflection"
    resources {
      gpus = 1
      vram-gb = 8
      context-length = 8192
    }
  }

  critic-clt {
    alias = "critic-clt"
    description = "Quality evaluation with CLT-inspectable features"
    model = "Qwen/Qwen3-1.7B"
    backend = "optillm"
    optillm-technique = "moa"
    resources {
      gpus = 1
      vram-gb = 8
      context-length = 8192
    }
  }
}

# ============================================================================
# CUDA Backend Configuration
# ============================================================================

gaius.inference.backends.vllm {
  binary = "vllm"
  binary = ${?VLLM_BINARY}
  gpu-memory-utilization = 0.9
  max-model-len = 32768
  dtype = "auto"
  extra-args = []
}

# ============================================================================
# CUDA Resource Configuration
# ============================================================================

gaius.resources.cuda {
  gpus {
    total = 6
    total = ${?GPU_COUNT}
    reserved = []
  }
  scheduling {
    prefer-contiguous = true
    allocation-timeout = 30
    allow-preemption = false
  }
}

# ============================================================================
# CUDA Startup Configuration
# ============================================================================

gaius.startup.cuda {
  # Preload orchestrator (2 GPUs) + instruct (4 GPUs) = 6 GPUs
  preload-endpoints = ["orchestrator", "instruct"]
  preload-endpoints = ${?GAIUS_PRELOAD_ENDPOINTS}
}
