# NodePort Services for Exposing Devenv Services to Kubernetes
#
# These services allow K8s pods (e.g., Metaflow jobs, Argo workflows) to access
# the devenv PostgreSQL and Signals' RustFS object store running on the host.
# (devenv MinIO retired 2026-09-05 — nixpkgs marks it insecure; RustFS is the
# federation's single S3 store, owned by wxs/signals, API 9010 / console 9011.)
#
# Usage:
#   1. Get your RKE2 node IP: kubectl get nodes -o wide
#   2. Replace ${NODE_IP} below with the actual IP
#   3. Apply: kubectl apply -f infra/k8s/devenv-services.yaml
#
# Services:
#   - devenv-postgres: PostgreSQL on 5444 -> NodePort 30438
#   - devenv-rustfs: RustFS S3 API on 9010 (console 9011)
#
# NOTE: the Endpoints ports below are the DECLARED lattice ports. devenv's
# daemon port allocator may shift Postgres (e.g. 5445);
# scripts/processes/metaflow-bootstrap.sh patches the postgres Endpoints to
# the effective $PGPORT after every apply. RustFS runs under Signals' strict
# port policy and is never shifted. This file must stay valid static YAML
# because infra/tilt/Tiltfile consumes it unrendered via k8s_yaml.

---
# PostgreSQL Service (for Metaflow metadata, Gaius lineage)
apiVersion: v1
kind: Service
metadata:
  name: devenv-postgres
  labels:
    app: devenv-postgres
    component: database
spec:
  type: ClusterIP
  ports:
    - port: 5444
      targetPort: 5444
      protocol: TCP
      name: postgres

---
# PostgreSQL Endpoints (pointing to host)
apiVersion: v1
kind: Endpoints
metadata:
  name: devenv-postgres
subsets:
  - addresses:
      # Host IP for tinybox (where devenv postgres runs)
      - ip: "192.168.1.55"
    ports:
      - port: 5444
        name: postgres

---
# RustFS Service (Signals' object store: Metaflow artifacts, HX data lake, KB storage)
apiVersion: v1
kind: Service
metadata:
  name: devenv-rustfs
  labels:
    app: devenv-rustfs
    component: storage
spec:
  type: ClusterIP
  ports:
    - port: 9010
      targetPort: 9010
      protocol: TCP
      name: api
    - port: 9011
      targetPort: 9011
      protocol: TCP
      name: console

---
# RustFS Endpoints (pointing to host)
apiVersion: v1
kind: Endpoints
metadata:
  name: devenv-rustfs
subsets:
  - addresses:
      # Host IP for tinybox (where Signals' RustFS runs)
      - ip: "192.168.1.55"
    ports:
      - port: 9010
        name: api
      - port: 9011
        name: console

---
# RustFS credentials secret (for Metaflow S3 access)
apiVersion: v1
kind: Secret
metadata:
  name: devenv-rustfs-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "rustfsadmin"
  AWS_SECRET_ACCESS_KEY: "rustfsadmin"
  AWS_ENDPOINT_URL_S3: "http://devenv-rustfs:9010"
