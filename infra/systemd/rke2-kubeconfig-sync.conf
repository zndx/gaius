# Systemd drop-in for rke2-server.service
# Syncs kubeconfig to user-readable location after every RKE2 start.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/rke2-server.service.d
#   sudo cp infra/systemd/rke2-kubeconfig-sync.conf \
#        /etc/systemd/system/rke2-server.service.d/kubeconfig-sync.conf
#   sudo systemctl daemon-reload
#
# Verify:
#   systemctl cat rke2-server | grep ExecStartPost

[Service]
# data-dir is /raid/rancher/rke2 but some rke2 kubeconfigs still open
# /var/lib/rancher/rke2/server/tls/*. After a host reboot that path is
# missing → crash loop, Airflow NodePort 30800 dead, Hermes DECLAREFAIL.
ExecStartPre=/bin/mkdir -p /var/lib/rancher
ExecStartPre=/bin/ln -sfn /raid/rancher/rke2 /var/lib/rancher/rke2
ExecStartPost=/bin/bash -c 'sleep 2 && /home/rch/local/src/zndx/gaius/scripts/lib/kubeconfig-sync.sh'
