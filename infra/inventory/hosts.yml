---
# Gaius Infrastructure Inventory
#
# Define hosts for local development, LambdaLabs GPU instances, and AWS
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/<playbook>.yml
#

all:
  vars:
    # Common variables
    ansible_python_interpreter: /usr/bin/python3
    gaius_root: "{{ lookup('env', 'GAIUS_ROOT') | default('/home/rch/local/src/zndx/gaius') }}"
    database_url: "{{ lookup('env', 'DATABASE_URL') | default('postgres://localhost:5438/zndx_gaius?sslmode=disable') }}"

  children:
    # Local development machine
    local:
      hosts:
        localhost:
          ansible_connection: local
          endpoint_port: 8000

    # GPU nodes (local or remote)
    gpu_nodes:
      hosts:
        localhost:
          ansible_connection: local
          gpu_count: 6
          endpoint_port: 8000

    # LambdaLabs GPU instances
    lambdalabs:
      hosts:
        # Add LambdaLabs instances here when provisioned
        # lambda-gpu-1:
        #   ansible_host: 192.168.x.x
        #   ansible_user: ubuntu
        #   ansible_ssh_private_key_file: ~/.ssh/lambda_key
        #   gpu_count: 8
        #   endpoint_port: 8000
      vars:
        ansible_user: ubuntu
        aws_region: us-west-2
        s3_bucket: gaius-kb-prod

    # AWS EC2 instances (for orchestration, not inference)
    aws:
      hosts:
        # Add AWS instances here when provisioned
        # aws-orchestrator-1:
        #   ansible_host: ec2-x-x-x-x.compute.amazonaws.com
        #   ansible_user: ec2-user
      vars:
        ansible_user: ec2-user
