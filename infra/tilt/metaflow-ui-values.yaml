# Metaflow UI Helm Values for devenv
# Uses PostgreSQL and MinIO from host devenv (via NodePort services)

uiBackend:
  metadatadb:
    host: devenv-postgres
    port: "5444"
    user: gaius
    password: "gaius"
    name: metaflow

  metaflowDatastoreSysRootS3: "s3://metaflow-artifacts/metaflow"
  metaflowS3EndpointURL: "http://devenv-minio:9010"

  image:
    name: public.ecr.aws/outerbounds/metaflow_metadata_service
    tag: "2.5.0"

  env:
    - name: AWS_ACCESS_KEY_ID
      value: minioadmin
    - name: AWS_SECRET_ACCESS_KEY
      value: minioadmin
    - name: METAFLOW_CARD_S3ROOT
      value: "s3://metaflow-artifacts/metaflow/cards"

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

uiStatic:
  # Use tinybox IP for external access from laptops
  metaflowUIBackendURL: "http://192.168.1.55:8083/api"

  image:
    name: public.ecr.aws/outerbounds/metaflow_ui
    tag: v1.3.14

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
