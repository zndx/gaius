# Metaflow Service Helm Values for devenv
# Uses PostgreSQL from host devenv (via NodePort service)

metadatadb:
  host: devenv-postgres
  port: "5438"
  user: gaius
  password: "gaius"
  database: metaflow

image:
  repository: public.ecr.aws/outerbounds/metaflow_metadata_service
  tag: "2.5.0"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Extra env vars for init container compatibility
env:
  - name: MF_METADATA_DB_PSWD
    value: "gaius"
