[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaius"
version = "0.2.0"
description = "Spatial Intelligence Interface - CLI-first TUI for complex data domains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.60.0",
]

[project.optional-dependencies]
# TDA features (requires Python 3.11 for giotto-tda)
tda = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "giotto-tda>=0.6.0",
]
# Swarm/agent features
swarm = [
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
]
# Full installation (TDA + Swarm)
full = [
    "gaius[tda]",
    "gaius[swarm]",
]

[project.scripts]
gaius = "gaius.app:main"
gaius-cli = "gaius.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaius"]
