[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaius"
version = "0.2.0"
description = "Spatial Intelligence Interface - CLI-first TUI for complex data domains"
readme = "README.md"
requires-python = "~=3.12.0"  # Pin to 3.12.x (giotto-tda not available for 3.13+)
dependencies = [
    "asyncpg>=0.31.0",
    "behave>=1.3.3",
    "deeponto>=0.9.3",
    "docling>=2.63.0",
    "einops>=0.8.1",
    "math-verify>=0.8.0",
    "optillm>=0.3.9",
    "owlready2>=0.49",
    "pyhocon>=0.3.61",
    "nvidia-ml-py>=12.0.0", # GPU monitoring (provides pynvml module)
    "textual>=0.60.0",
    "umap-learn>=0.5.7",
    "cuml-cu12>=25.6.0", # Updated for numba 0.61.2 compatibility (required by vLLM 0.9+)
    "vllm>=0.9.0", # Qwen3 support requires vLLM 0.9.0+
    "graphriccicurvature>=0.5.3.2",
    "ripser>=0.6.12",
    "deepagents>=0.2.8",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-instrumentation-logging>=0.60b0",
    "bm25s>=0.2.14",
    "stemming>=1.0.1",
    "colpali-engine[interpretability]>=0.3.2",
]

[project.optional-dependencies]
# TDA features (differential geometry + persistent homology)
# Uses Ollivier-Ricci curvature and fast ripser for topology
tda = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",                   # For k-NN graph structure
    "GraphRicciCurvature>=0.5.3",      # Ollivier-Ricci curvature computation
    "ripser>=0.6.12",                  # Fast persistent homology (H0, H1, H2)
]
# Swarm/agent features
swarm = [
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
]
# Full installation (TDA + Swarm)
full = [
    "gaius[tda]",
    "gaius[swarm]",
]
# Inference features (optillm, vLLM)
inference = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
]
# Scheduler features (OR-Tools for optimal job scheduling)
scheduler = [
    "ortools>=9.8.0",
]
# GPU monitoring (nvidia-ml-py provides pynvml module)
gpu = [
    "nvidia-ml-py>=12.0.0",
]
# Full GPU orchestrator (scheduler + GPU monitoring)
orchestrator = [
    "gaius[scheduler]",
    "gaius[gpu]",
]
# Search features (Brave API + BM25 + Qdrant)
search = [
    "gaius[inference]",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",  # For bm25s stemming
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",  # Local embeddings
]
# Multimodal features (ColQwen2.5 for unified text+image embeddings)
multimodal = [
    "colpali-engine>=0.3.0",  # ColQwen2.5 multimodal embeddings
    "Pillow>=10.0.0",         # Image loading
    "pypdf>=3.0.0",           # PDF page extraction
    "torch>=2.0.0",           # Required for ColQwen
    "transformers>=4.40.0",   # HuggingFace models
]
# MCP server
mcp = [
    "gaius[inference]",
    "gaius[search]",
    "mcp>=1.0.0",
]
# Fetch workers
workers = [
    "asyncpg>=0.29.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.25.0",
]
# Agent optimization (DSPy)
optimization = [
    "dspy-ai>=2.5.0",
]
# Ontology processing (DeepOnto)
ontology = [
    "deeponto>=0.9.0",
]
# Evaluation (frontier model judging)
eval = [
    "gaius[search]",
    "anthropic>=0.40.0",
]
# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
# Engine daemon (gaius-engine)
engine = [
    "flatbuffers>=24.3.25",  # FlatBuffers serialization (future upgrade from JSON)
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
# Gaius HX - Raw content data lake (Iceberg + lineage)
hx = [
    "pyiceberg[sql-postgres,s3fs]>=0.7.0",  # Iceberg with Postgres catalog and S3
    "pyarrow>=14.0.0",                       # Parquet support
    "s3fs>=2024.2.0",                        # S3/MinIO filesystem
    "fsspec>=2024.2.0",                      # Abstract filesystem
]
# Full engine with Aeron IPC (requires aeron-cpp native package)
engine-aeron = [
    "gaius[engine]",
    # Note: aeron-python requires native aeron-cpp library
    # Install via: pip install aeron-python (after installing aeron-cpp)
]
# gRPC transport (KServe OIP + Gaius extensions)
grpc = [
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
    "grpcio-status>=1.59.0",
    "grpcio-health-checking>=1.59.0",
    "protobuf>=4.25.0",
]
# Full engine with gRPC (primary transport)
engine-grpc = [
    "gaius[engine]",
    "gaius[grpc]",
]

[project.scripts]
gaius = "gaius.app:main"
gaius-cli = "gaius.cli:main"
gaius-mcp = "gaius.mcp_server:main"
gaius-worker = "gaius.workers.cli:main"
gaius-engine = "gaius.engine:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaius"]

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
