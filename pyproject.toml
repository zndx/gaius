[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaius"
version = "0.2.0"
description = "Spatial Intelligence Interface - CLI-first TUI for complex data domains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "behave>=1.3.3",
    "deeponto>=0.9.3",
    "docling>=2.63.0",
    "math-verify>=0.8.0",
    "optillm>=0.3.9",
    "owlready2>=0.49",
    "pyhocon>=0.3.61",
    "textual>=0.60.0",
]

[project.optional-dependencies]
# TDA features (requires Python 3.11 for giotto-tda)
tda = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "giotto-tda>=0.6.0",
]
# Swarm/agent features
swarm = [
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
]
# Full installation (TDA + Swarm)
full = [
    "gaius[tda]",
    "gaius[swarm]",
]
# Inference features (optillm, vLLM)
inference = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
]
# Search features (Brave API + BM25 + Qdrant)
search = [
    "gaius[inference]",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",  # For bm25s stemming
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",  # Local embeddings
]
# MCP server
mcp = [
    "gaius[inference]",
    "gaius[search]",
    "mcp>=1.0.0",
]
# Fetch workers
workers = [
    "asyncpg>=0.29.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.25.0",
]
# Agent optimization (DSPy)
optimization = [
    "dspy-ai>=2.5.0",
]
# Ontology processing (DeepOnto)
ontology = [
    "deeponto>=0.9.0",
]
# Evaluation (frontier model judging)
eval = [
    "gaius[search]",
    "anthropic>=0.40.0",
]

[project.scripts]
gaius = "gaius.app:main"
gaius-cli = "gaius.cli:main"
gaius-mcp = "gaius.mcp_server:main"
gaius-worker = "gaius.workers.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaius"]
