[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaius"
version = "0.2.0"
description = "Spatial Intelligence Interface - CLI-first TUI for complex data domains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "math-verify>=0.8.0",
    "optillm>=0.3.9",
    "textual>=0.60.0",
]

[project.optional-dependencies]
# TDA features (requires Python 3.11 for giotto-tda)
tda = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "giotto-tda>=0.6.0",
]
# Swarm/agent features
swarm = [
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
]
# Full installation (TDA + Swarm)
full = [
    "gaius[tda]",
    "gaius[swarm]",
]
# Inference features (optillm, vLLM)
inference = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
]
# Search features (Brave API)
search = [
    "gaius[inference]",
]
# MCP server
mcp = [
    "gaius[inference]",
    "gaius[search]",
    "mcp>=1.0.0",
]

[project.scripts]
gaius = "gaius.app:main"
gaius-cli = "gaius.cli:main"
gaius-mcp = "gaius.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaius"]
