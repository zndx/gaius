[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaius"
version = "0.2.0"
description = "Spatial Intelligence Interface - CLI-first TUI for complex data domains"
readme = "README.md"
requires-python = "~=3.12.0"  # Pin to 3.12.x (giotto-tda not available for 3.13+)
dependencies = [
    "asyncpg>=0.31.0",
    "behave>=1.3.3",
    "deeponto>=0.9.0", # Ontology verbalization (fastembed replaces colnomic, no peft conflict)
    "docling>=2.63.0",
    "einops>=0.8.1",
    "math-verify>=0.8.0",
    "optillm>=0.3.9",
    "gunicorn>=21.0.0", # Production WSGI server for optillm
    "owlready2>=0.49",
    "pyhocon>=0.3.61",
    "nvidia-ml-py>=12.0.0", # GPU monitoring (provides pynvml module)
    "textual>=0.60.0",
    "umap-learn>=0.5.7",
    "vllm>=0.27.0", # Qwen3.8-27B is Qwen3_5ForConditionalGeneration (0.12 cannot load it)
    "graphriccicurvature>=0.5.3.2",
    "ripser>=0.6.12",
    "deepagents>=0.2.8",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-instrumentation-logging>=0.60b0",
    "bm25s>=0.2.14",
    "stemming>=1.0.1",
    "pylate>=1.3.4", # ColBERT-Zero late-interaction (replaces colpali-engine)
    "pyiceberg[pyiceberg-core,s3fs,sql-postgres]>=0.10.0",
    "pystemmer>=3.0.0",
    "qdrant-client>=1.12.1",
    "feedparser>=6.0.12",
    "sentence-transformers>=5.1.2",
    "opentelemetry-exporter-otlp>=1.39.0",
    "minio>=7.2.0", # S3-compatible object storage (KB storage, sync, HX data lake)
    "ansible>=13.1.0",
    "ansible-runner>=2.4.2",
    "bytez>=3.0.1",
    "gensim>=4.4.0",
    "bertopic>=0.16.0", # Neural topic modeling with transformers
    "hdbscan>=0.8.33", # Required for BERTopic clustering
    "metaflow>=2.12.0", # Workflow orchestration with cards
    "kaleido>=1.2.0",
    "pydantic>=2.12.5",
    "ty>=0.0.5",
    "dspy>=3.0.4",
    "shap>=0.49.1",
    "reservoirpy>=0.4.1",
    # Cross-Layer Transcoders (CLT) for interpretable sparse features
    # Uses BluelightAI's circuit-tracer library with Qwen3 CLTs
    "circuit-tracer @ git+https://github.com/safety-research/circuit-tracer.git",
    "transformer-lens>=2.0.0", # Required for CLT model internals
    "datasets>=2.14.6",
    "agent-client-protocol>=0.7.0",
    "qrcode>=8.0", # Terminal QR codes for OAuth URLs on mobile devices
    "google-api-python-client>=2.187.0",
    "hf-mem>=0.1.1",
    "vulture>=2.14",
    "metabase-api>=3.5.2",
    "sqlglot>=26.0.0", # SQL parser/transpiler for fluent query compilation
    "xai-sdk>=1.4.0", # xAI Grok API (Collections support requires 1.4.0+)
    "holoviews>=1.23.1",
    "bokeh>=3.9.2",
]

[project.optional-dependencies]
# TDA features (differential geometry + persistent homology)
# Uses Ollivier-Ricci curvature and fast ripser for topology
waterfall = [
    "holoviews>=1.20.0",
    "bokeh>=3.6.0",
]
tda = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",                   # For k-NN graph structure
    "GraphRicciCurvature>=0.5.3",      # Ollivier-Ricci curvature computation
    "ripser>=0.6.12",                  # Fast persistent homology (H0, H1, H2)
]
# Swarm/agent features
swarm = [
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
]
# Full installation (TDA + Swarm)
full = [
    "gaius[tda]",
    "gaius[swarm]",
]
# Inference features (optillm, vLLM)
inference = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
]
# Scheduler features (OR-Tools for optimal job scheduling)
scheduler = [
    "ortools>=9.8.0",
]
# GPU monitoring (nvidia-ml-py provides pynvml module)
gpu = [
    "nvidia-ml-py>=12.0.0",
]
# Full GPU orchestrator (scheduler + GPU monitoring)
orchestrator = [
    "gaius[scheduler]",
    "gaius[gpu]",
]
# Search features (Brave API + BM25 + Qdrant)
search = [
    "gaius[inference]",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",  # For bm25s stemming
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",  # Local embeddings
]
# Multimodal features (ColQwen2.5 for unified text+image embeddings)
# Note: colpali-engine and peft must be installed manually after uv sync:
#   uv pip install "colpali-engine>=0.3.0" "peft>=0.18.0" --no-deps
# (conflicts with vllm torch==2.9.0 requirement)
multimodal = [
    "Pillow>=10.0.0",         # Image loading
    "pypdf>=3.0.0",           # PDF page extraction
]
# Dataset generation (NiFi SoM, etc.)
dataset = [
    "selenium>=4.15.0",       # Browser automation (works with nix chromium/chromedriver)
    "Pillow>=10.0.0",         # Image annotation
]
# MCP server
mcp = [
    "gaius[inference]",
    "gaius[search]",
    "mcp>=1.0.0",
]
# Fetch workers
workers = [
    "asyncpg>=0.29.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.25.0",
]
# Agent optimization (DSPy)
optimization = [
    "dspy-ai>=2.5.0",
]
# Ontology processing (DeepOnto)
ontology = [
    "deeponto>=0.9.0",
]
# Evaluation (frontier model judging)
eval = [
    "gaius[search]",
    "anthropic>=0.40.0",
]
# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
# Engine daemon (gaius-engine)
engine = [
    "flatbuffers>=24.3.25",  # FlatBuffers serialization (future upgrade from JSON)
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
# Gaius HX - Raw content data lake (Iceberg + lineage)
hx = [
    "pyiceberg[sql-postgres,s3fs]>=0.7.0",  # Iceberg with Postgres catalog and S3
    "pyarrow>=14.0.0",                       # Parquet support
    "s3fs>=2024.2.0",                        # S3/MinIO filesystem
    "fsspec>=2024.2.0",                      # Abstract filesystem
]
# Full engine with Aeron IPC (requires aeron-cpp native package)
engine-aeron = [
    "gaius[engine]",
    # Note: aeron-python requires native aeron-cpp library
    # Install via: pip install aeron-python (after installing aeron-cpp)
]
# gRPC transport (KServe OIP + Gaius extensions)
grpc = [
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
    "grpcio-status>=1.59.0",
    "grpcio-health-checking>=1.59.0",
    # 1.83+ ships reflection_pb2 gencode 7.35.1; xai-sdk/otel/grpcio-tools pin protobuf<7.
    "grpcio-reflection>=1.59.0,<1.82",
    "protobuf>=4.25.0,<7",
]
# Full engine with gRPC (primary transport)
engine-grpc = [
    "gaius[engine]",
    "gaius[grpc]",
]
# Visualization rendering (LuxCore physically-based renderer)
viz = [
    "Pillow>=10.0.0",
]

[project.scripts]
gaius = "gaius.launcher:main"
gaius-cli = "gaius.cli:main"
gaius-mcp = "gaius.mcp_server:main"
gaius-worker = "gaius.workers.cli:main"
gaius-engine = "gaius.engine:main"
gaius-dataset = "gaius.datasets.nifi_som.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
timeout = 60
# Exclude infrastructure-dependent tests from default run
# These require optillm/vLLM endpoints or other devenv services
addopts = "--ignore=tests/test_optillm_vllm.py --ignore=tests/test_inference.py --ignore=tests/test_artifacts.py"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "engine: tests requiring gRPC engine running",
    "inference: tests requiring LLM inference (llama.cpp or vLLM)",
    "db: tests requiring PostgreSQL database",
    "gpu: tests requiring GPU hardware (nvidia-smi, pynvml)",
    "nifi: tests requiring Apache NiFi",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gaius"]

[dependency-groups]
dev = [
    "grpc-stubs>=1.53.0.6",
    "mypy-protobuf>=4.0.0",
    "protobuf>=6.32.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "textual-dev>=1.8.0",
    "types-protobuf>=6.32.1.20251210",
    "types-aioboto3>=15.0.0", # Type stubs for aioboto3
    "bcrypt>=5.0.0",
]

# UV configuration
# Override peft version to support colnomic adapter's eva_config
# Note: colpali-engine>=0.3.5 has ColQwen2_5 but conflicts with vLLM torch==2.9.0
# Use ColQwen2 from 0.3.2 instead, or vidore/colqwen2-v1.0 model
[tool.uv]
# Lattice host is linux/x86_64 (tinybox). Do not lock Darwin/ARM splits.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "peft>=0.18.0",
    # rapidocr wants opencv-python which needs libGL.so.1 (unavailable on Nix).
    # vLLM wants opencv-python-headless (no libGL). Having both installed causes
    # opencv-python to win the import and crash. Force headless everywhere.
    "opencv-python>=4.11 ; sys_platform == 'never'",
    # ninja pip package is a manylinux ELF binary linked against host glibc.
    # It picks up Nix libstdc++ (glibc 2.42) via LD_LIBRARY_PATH but runs against
    # host glibc (2.35), causing GLIBC_2.38 not found. devenv provides ninja via Nix
    # which is self-contained with its own glibc. Block the pip version.
    "ninja>=1.0 ; sys_platform == 'never'",
    # Qwen3.8-27B is architecture qwen3_5; transformers 4.57 (colpali pin) cannot load it.
    "transformers>=5.8.0",
    # vLLM 0.27 serves Qwen3_5 on torch 2.13. pylate's fast-plaid extra pins
    # torch<=2.11; we encode with pylate.models.ColBERT and store in Qdrant
    # (no PLAID index). Force the vLLM torch.
    "torch==2.13.0",
    # vLLM 0.27.1 pulls xgrammar 0.2.4, which has no cp312 manylinux_x86_64 wheel.
    "xgrammar==0.2.3",
    # vLLM 0.27 CLI imports openai.types.responses.NamespaceTool (2.8.1 lacks it).
    "openai>=3.1.0",
    # Must match torch 2.13.0+cu129. PyPI 0.28.0 has no torchvision::nms for that ABI.
    "torchvision==0.28.0+cu129",
    # Default torchaudio is cu130 (libcudart.so.13). Tinybox toolkit is 12.4.
    "torchaudio==2.11.0+cu129",
    "torchcodec==0.16.0+cu129",
]

# Driver 570.148 = CUDA 12.8. Default vLLM/torch wheels are cu130 and
# refuse to init. Use the cu129 variant (closest published 0.27.1 wheel).
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.27.1/vllm-0.27.1+cu129-cp38-abi3-manylinux_2_28_x86_64.whl" }

# ty type checker configuration
# Strategy: Zero errors, warnings acceptable for third-party libs without stubs
[tool.ty.src]
# Exclude generated code, BDD step files (dynamic imports), scripts
exclude = [
    "src/gaius/engine/generated/",  # Auto-generated protobuf/gRPC
    "features/steps/",               # Behave step files with dynamic imports
    "scripts/",                      # Experimental scripts
    "*.py",                          # Root-level files
]

[tool.ty.environment]
# Custom type stubs for third-party libraries (metaflow, behave)
# Note: We only stub libraries where we can accurately model the API.
# For complex libraries (ortools, gtda, langchain), unresolved-import
# warnings are preferable to incorrect stubs that create false errors.
extra-paths = ["typings"]

# Downgrade unresolved-import to warning for third-party libs without stubs
# This allows CI to gate on errors while tracking stub gaps as warnings
[tool.ty.rules]
unresolved-import = "warn"
